/* ================================================================
   G3: 每日挑戰（依日期種子隨機棋種+難度，玩家先手 vs AI）
   ================================================================ */
var DAILY_GAMES=['ttt','c4','gomoku','c6','checkers','go','jungle','chess','reversi','xiangqi','draughts','hex','pente','dots','morris','mancala'];
var DAILY_DIFFS=['easy','normal','hard'];
/* 字串雜湊（djb2），純函式 */
function dateHash(str){
  var h=5381;
  for(var i=0;i<str.length;i++){h=((h<<5)+h+str.charCodeAt(i))|0;}
  return Math.abs(h);
}
/* 依日期字串決定當日棋種與難度（同一天結果固定）。純函式 */
function dailyPlan(dateStr){
  var h=dateHash(dateStr||new Date().toDateString());
  var game=DAILY_GAMES[h%DAILY_GAMES.length];
  var diff=DAILY_DIFFS[Math.floor(h/DAILY_GAMES.length)%DAILY_DIFFS.length];
  return {game:game,diff:diff};
}
function todayKey(){return new Date().toDateString();}
function loadDaily(){try{var s=localStorage.getItem('starchess.daily');if(s){var o=JSON.parse(s);state.dailyChallenge=o||{};}}catch(e){state.dailyChallenge={};}}
function saveDaily(){try{localStorage.setItem('starchess.daily',JSON.stringify(state.dailyChallenge||{}));}catch(e){}}
/* 計算連續完成天數：今天已完成則從今天往前數；今天未完成則從昨天往前數。純函式 */
function computeDailyStreak(map,baseDate){
  map=map||{};
  var streak=0;
  var d=baseDate?new Date(baseDate):new Date();
  /* 若今天還沒完成，從昨天開始數 */
  var key=d.toDateString();
  if(map[key]!=='win'){d.setDate(d.getDate()-1);}
  while(true){
    var k=d.toDateString();
    if(map[k]==='win'){streak++;d.setDate(d.getDate()-1);}
    else break;
  }
  return streak;
}
function dailyCompletedToday(){return (state.dailyChallenge||{})[todayKey()]==='win';}
/* 開始每日挑戰 */
function startDailyChallenge(){
  var plan=dailyPlan(todayKey());
  state.game=plan.game;
  state.mode='ai';
  state.diff=plan.diff;
  state.dailyActive=true;
  clearTimeout(aiTimer);clearTimeout(aiInnerTimer);state.gen++;disposeEngines();
  startGame();
}
/* 對局勝利時呼叫：若為每日挑戰則記錄完成 */
function markDailyCompleted(){
  if(!state.dailyActive)return;
  /* M2: 驗證當前局面確實是今日每日挑戰的棋種與難度，避免放棄後開普通局誤標完成 */
  var plan=dailyPlan(todayKey());
  if(state.game!==plan.game||state.diff!==plan.diff){state.dailyActive=false;return;}
  state.dailyChallenge=state.dailyChallenge||{};
  state.dailyChallenge[todayKey()]='win';
  saveDaily();
  state.dailyActive=false;
}

function dailyButtonLabel(){

  return tr('dailyNew')+' · '+tr('dailyStreak')+' '+computeDailyStreak(state.dailyChallenge);
}

function updateDailyBadge(){

/* 輕量提示 toast 佇列：避免多個 toast 同時重疊，依序顯示 */
var TOAST_QUEUE=[],toastActive=false;
var TOAST_SHOW_MS=2500,TOAST_GAP_MS=200;
function pushToast(html){
  /* L2: 佇列上限，避免一次性湧入過多 toast */
  if(TOAST_QUEUE.length>5)TOAST_QUEUE.shift();
  TOAST_QUEUE.push(html);
  if(!toastActive)nextToast();
}
function nextToast(){
  if(!TOAST_QUEUE.length){toastActive=false;return;}
  toastActive=true;
  var html=TOAST_QUEUE.shift();
  var n=document.createElement('div');n.className='ach-toast';n.innerHTML=html;
  document.body.appendChild(n);setTimeout(function(){n.classList.add('show');},50);
  setTimeout(function(){
    n.classList.remove('show');
    setTimeout(function(){
      if(n.parentNode)n.parentNode.removeChild(n);
      setTimeout(nextToast,TOAST_GAP_MS);
    },400);

/* U2: 黑白棋是否佔領全部4角（P1獲勝時檢查）。純函式 */
function reversiOwnsAllCorners(){

  if(n<8)return false;
  return g[0][0]===P1&&g[0][n-1]===P1&&g[n-1][0]===P1&&g[n-1][n-1]===P1;
}
/* U2: 是否完美棋局——P1每步質量皆為!!或!（無失誤/大漏）。純函式 */
function isPerfectGame(){
  var evs=state.moveEvals||[];
  if(evs.length<2)return false;
  var prev=evs[0].eval;
  for(var i=1;i<evs.length;i++){
    if(evs[i].turn!==P1){prev=evs[i].eval;continue;}
    var q=moveQuality(prev,evs[i].eval,P1);
    if(q&&(q.cls==='q-mistake'||q.cls==='q-blunder'))return false;
    prev=evs[i].eval;
  }
  return true;
}

/* ================================================================
   六子棋 Connect6：黑首手1子，其後每方2子，連6子勝
   ================================================================ */
function winLineC6(r,c,player){
  for(var d=0;d<DIRS4.length;d++){var dr=DIRS4[d][0],dc=DIRS4[d][1];
    var line=[[r,c]];var rr=r+dr,cc=c+dc;
    while(rr>=0&&rr<15&&cc>=0&&cc<15&&state.grid[rr][cc]===player){line.push([rr,cc]);rr+=dr;cc+=dc;}
    rr=r-dr;cc=c-dc;
    while(rr>=0&&rr<15&&cc>=0&&cc<15&&state.grid[rr][cc]===player){line.unshift([rr,cc]);rr-=dr;cc-=dc;}
    if(line.length>=6)return line;}
  return null;
}
function placeC6(r,c,player){
  if(state.grid[r][c]!==EMPTY)return;
  state.grid[r][c]=player;state.history.push({row:r,col:c,player:player});kickAnim('g'+r+'_'+c);playSound('place');recordHeatmap(r,c,player);
  var line=winLineC6(r,c,player);
  if(line){finish({start:line[0],end:line[line.length-1]},player);return;}
  if(state.history.length>=225){drawFinish();return;}
  /* 黑方首手只下1子；其後每方2子 */
  var isFirstMove=state.history.length===1;
  if(isFirstMove||state.c6Second){
    state.c6Second=false;
    state.turn=state.turn===P1?P2:P1;updateTurnUI();
  }else{
    state.c6Second=true;
  }
}
function aiC6(){
  var aiP=state.mode==='spectate'?state.turn:P2;
  /* H7: 比照五子棋——交換後以內部 P2 慣例搜尋，只回傳座標不落子；
     實際落子由 aiDoMove 以 state.turn 的真實顏色執行，避免 swap 後顏色顛倒 */
  if(aiP===P1){swapGridColors();try{return aiC6Internal();}finally{swapGridColors();}}
  return aiC6Internal();
}
function aiC6Internal(){
  /* 只計算兩手座標（m1,m2），不實際落子 */
  var m1=aiGomokuMoveFor(P2);
  if(!m1)return null;
  /* 黑方首手只下1子 */
  if(state.history.length===0)return{m1:m1,m2:null};
  /* 試探性放上 m1 以搜尋第二手，隨即還原 */
  state.grid[m1.row][m1.col]=P2;
  var win1=!!winLineC6(m1.row,m1.col,P2);
  var m2=win1?null:aiGomokuMoveFor(P2);
  state.grid[m1.row][m1.col]=EMPTY;
  return{m1:m1,m2:m2,win:win1};
}
/* 為六子棋複用五子棋AI：包裝成只計算不走子 */
function aiGomokuMoveFor(player){
  GK_WIN_LEN=6; /* M17: 六子棋需連6子才勝，深層搜索終局判定用6 */
  var g=state.grid,cands=gkCands(2),i;
  /* 成六直下 */
  for(i=0;i<cands.length;i++){var r=cands[i].row,c=cands[i].col;
    g[r][c]=player;if(winLineC6(r,c,player)){g[r][c]=EMPTY;return{row:r,col:c};}g[r][c]=EMPTY;}
  /* 擋對手成六 */
  var opp=player===P1?P2:P1;
  for(i=0;i<cands.length;i++){var r=cands[i].row,c=cands[i].col;
    g[r][c]=opp;if(winLineC6(r,c,opp)){g[r][c]=EMPTY;return{row:r,col:c};}g[r][c]=EMPTY;}
  /* 用評分選最佳 */
  var ordered=scoredCands(player,opp,2);
  if(state.diff==='easy')return ordered[0]||cands[0];
  /* normal/hard：擋活五(=5子開放)、活四 */
  for(i=0;i<ordered.length;i++){
    if(pointScore(ordered[i].row,ordered[i].col,opp)>=GKS.LIVE_FOUR)return ordered[i];}
  var my4=null;
  for(i=0;i<ordered.length;i++){
    if(pointScore(ordered[i].row,ordered[i].col,player)>=GKS.LIVE_FOUR){my4=ordered[i];break;}}
  if(my4)return my4;
  if(state.diff==='normal')return ordered[0]||cands[0];
  /* hard：alpha-beta 淺搜索2層 */
  GKTT={};HIST={};KILLER={};GK_NODES=0;zkey=0;
  for(var rr=0;rr<15;rr++)for(var cc=0;cc<15;cc++)if(g[rr][cc]!==EMPTY)zflip(rr,cc,g[rr][cc]);
  var root=ensureThreats(ordered.slice(0,20),ordered,opp,GKS.SLEEP_THREE);
  var best=root[0]||cands[0],bs=-Infinity;
  GK_DEADLINE=performance.now()+1500;
  try{
    for(i=0;i<root.length;i++){var pr=root[i].row,pc=root[i].col;
      g[pr][pc]=player;zflip(pr,pc,player);
      var sc;
      try{sc=mmGK(3,-Infinity,Infinity,false);}finally{g[pr][pc]=EMPTY;zflip(pr,pc,player);}
      if(sc>bs){bs=sc;best={row:pr,col:pc};}}
  }catch(e){}
  return best;
}

var stars=[];
var meteors=[];
var meteorTimer=0;
var starAnimOn=true;
var starRAF=null; /* Bug3: 記錄 rAF ID，避免前後台切換啟動兩條動畫鏈 */
function initStars(){
  starCanvas.width=innerWidth*DPR;starCanvas.height=innerHeight*DPR;
  starCanvas.style.width=innerWidth+'px';starCanvas.style.height=innerHeight+'px';
  sctx.setTransform(DPR,0,0,DPR,0,0);
  stars=[];
  for(var i=0;i<160;i++)stars.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    r:Math.random()*1.5+.5,a:Math.random(),s:Math.random()*.02+.005});
  meteors=[];meteorTimer=0;
}
function spawnMeteor(){
  meteors.push({x:Math.random()*innerWidth+innerWidth*.2,y:-20,
    vx:-(Math.random()*6+4),vy:Math.random()*4+3,len:Math.random()*80+60,life:1});
}
function drawStars(){
  /* 分頁背景時暫停 rAF 循環，回到前景再恢復（不影響計時器與其他邏輯） */
  if(!starAnimOn){starRAF=null;return;}
  sctx.clearRect(0,0,innerWidth,innerHeight);
  for(var i=0;i<stars.length;i++){var t=stars[i];t.a+=t.s;if(t.a>1||t.a<0)t.s=-t.s;
    sctx.beginPath();sctx.arc(t.x,t.y,t.r,0,Math.PI*2);
    sctx.fillStyle='rgba(255,255,255,'+Math.abs(t.a)+')';sctx.fill();}
  /* 流星 */
  if(!state.simplifiedAnim){
    meteorTimer++;
    if(meteorTimer>180&&Math.random()<.02){spawnMeteor();meteorTimer=0;}
  }
  for(var m=meteors.length-1;m>=0;m--){var mt=meteors[m];
    mt.x+=mt.vx;mt.y+=mt.vy;mt.life-=.012;
    if(mt.life<=0||mt.y>innerHeight+50||mt.x<-100){meteors.splice(m,1);continue;}
    var grad=sctx.createLinearGradient(mt.x,mt.y,mt.x+mt.vx*8,mt.y+mt.vy*8);
    grad.addColorStop(0,'rgba(255,255,255,'+mt.life+')');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    sctx.strokeStyle=grad;sctx.lineWidth=2;sctx.lineCap='round';
    sctx.beginPath();sctx.moveTo(mt.x,mt.y);sctx.lineTo(mt.x+mt.vx*8,mt.y+mt.vy*8);sctx.stroke();
    sctx.beginPath();sctx.arc(mt.x,mt.y,1.5,0,Math.PI*2);
    sctx.fillStyle='rgba(255,255,255,'+mt.life+')';sctx.fill();}
  starRAF=requestAnimationFrame(drawStars);
}

function mk2D(r,c){var a=[];for(var i=0;i<r;i++)a.push(new Array(c).fill(0));return a;}

/* ================================================================
   棋盤縮放（100%–300%）＋放大後拖動平移（單指/雙指質心）
   ================================================================ */
var ZOOM_STEP=.25,ZOOM_MIN=1,ZOOM_MAX=3;
var view={zoom:1,tx:0,ty:0};
var zoomVP=null,zoomPointers={},lastCent=null,panMoved=false,panSuppressClick=false;
var pinchStartDist=0,pinchStartZoom=1; /* U9: 雙指縮放基準 */
function zoomVPEl(){return zoomVP||(zoomVP=$('boardViewport'));}
function resetZoomView(){view.zoom=1;view.tx=0;view.ty=0;applyZoomTransform();updateZoomUI();}
function applyZoomTransform(){
  boardCanvas.style.transform='translate('+view.tx+'px,'+view.ty+'px) scale('+view.zoom+')';
}
function zoomLayout(){
  return{cw:boardCanvas.offsetWidth,ch:boardCanvas.offsetHeight,
    vw:zoomVPEl().clientWidth,vh:zoomVPEl().clientHeight};
}
function clampPan(){
  var L=zoomLayout(),sw=L.cw*view.zoom,sh=L.ch*view.zoom;
  view.tx=view.zoom<=1?0:Math.min(0,Math.max(L.vw-sw,view.tx));
  view.ty=view.zoom<=1?0:Math.min(0,Math.max(L.vh-sh,view.ty));
}
function setZoom(z){
  view.zoom=Math.min(ZOOM_MAX,Math.max(ZOOM_MIN,z));
  clampPan();applyZoomTransform();updateZoomUI();
}
function updateZoomUI(){
  var zv=$('zoomVal');if(zv)zv.textContent=Math.round(view.zoom*100)+'%';
  var zo=$('zoomOut'),zi=$('zoomIn');
  if(zo)zo.disabled=view.zoom<=ZOOM_MIN+1e-6;
  if(zi)zi.disabled=view.zoom>=ZOOM_MAX-1e-6;
}
function ptrCentroid(){var sx=0,sy=0,n=0;
  for(var k in zoomPointers){sx+=zoomPointers[k].x;sy+=zoomPointers[k].y;n++;}
  return n?{x:sx/n,y:sy/n}:null;}
function bindZoom(){
  $('zoomOut').addEventListener('click',function(e){e.preventDefault();setZoom(view.zoom-ZOOM_STEP);});
  $('zoomIn').addEventListener('click',function(e){e.preventDefault();setZoom(view.zoom+ZOOM_STEP);});
  var vp=$('boardViewport');
  boardCanvas.addEventListener('click',function(e){
    if(panSuppressClick){e.stopPropagation();e.preventDefault();panSuppressClick=false;}
  },true);
  vp.addEventListener('pointerdown',function(e){
    /* U9: 雙指縮放——無論目前縮放倍率皆追蹤指針，以便從 100% 開始縮放 */
    var wasEmpty=Object.keys(zoomPointers).length===0;
    if(wasEmpty){panSuppressClick=false;panMoved=false;pinchStartDist=0;pinchStartZoom=view.zoom;}
    zoomPointers[e.pointerId]={x:e.clientX,y:e.clientY};
    try{vp.setPointerCapture(e.pointerId);}catch(_){}
    lastCent=ptrCentroid();
    if(view.zoom>1||Object.keys(zoomPointers).length>=2)vp.classList.add('panning');
  });
  vp.addEventListener('pointermove',function(e){
    if(zoomPointers[e.pointerId]==null)return;
    zoomPointers[e.pointerId]={x:e.clientX,y:e.clientY};
    var pts=Object.keys(zoomPointers);
    /* U9: 雙指捏合縮放 */
    if(pts.length>=2){
      var p1=zoomPointers[pts[0]],p2=zoomPointers[pts[1]];
      var dist=Math.hypot(p1.x-p2.x,p1.y-p2.y);
      if(pinchStartDist>0&&dist>0){
        var ratio=dist/pinchStartDist;
        setZoom(pinchStartZoom*ratio);
        panMoved=true;
      }else{pinchStartDist=dist;pinchStartZoom=view.zoom;}
      lastCent=ptrCentroid();
      return;
    }
    if(view.zoom<=1)return;
    var c=ptrCentroid();
    if(lastCent&&c){var dx=c.x-lastCent.x,dy=c.y-lastCent.y;
      if(Math.abs(dx)+Math.abs(dy)>0.6)panMoved=true;
      view.tx+=dx;view.ty+=dy;clampPan();applyZoomTransform();}
    lastCent=c;
  });
  function endPtr(e){
    if(zoomPointers[e.pointerId]==null)return;
    delete zoomPointers[e.pointerId];lastCent=ptrCentroid();
    if(!ptrCentroid()){
      vp.classList.remove('panning');
      if(panMoved){
        /* 平移結束：抑制後續合成 click，避免誤落子 */
        panSuppressClick=true;
      }else{
        /* 短按（縮放>100% 時 pointer 被 vp 捕獲，canvas click 收不到）：
           自行把 client 座標換算到畫布邏輯座標並落子 */
        var rect=boardCanvas.getBoundingClientRect();
        var mx=(e.clientX-rect.left)*(boardW()/rect.width);
        var my=(e.clientY-rect.top)*(boardH()/rect.height);
        panSuppressClick=true; /* 已直接處理，抑制可能洩漏的合成 click */
        handleBoardClick(mx,my);
      }
    }
  }
  vp.addEventListener('pointerup',endPtr);
  vp.addEventListener('pointercancel',endPtr);
  if(typeof window!=='undefined'){
    var __starResizeT=null;
    window.addEventListener('resize',function(){
      clampPan();applyZoomTransform();
      /* 視窗尺寸變化後重新生成星空背景，覆蓋新尺寸（debounce） */
      if(__starResizeT)clearTimeout(__starResizeT);
      __starResizeT=setTimeout(function(){try{initStars();drawStars();}catch(e){}},150);
    });
  }
}

/* 落子星芒漣漪與粒子特效 + 提子/吃子消散特效 */
var EFFECTS=[];
var CAPTURE_ANIMS=[];
function spawnCaptureAnim(x,y,color,rad){
  if(state.animSpeed==='off'||state.simplifiedAnim)return;
  var sparks=[];
  for(var i=0;i<10;i++){
    var ang=(Math.PI*2*i)/10+(Math.random()*0.35);
    sparks.push({ang:ang,dist:(rad||18)*(1.3+Math.random()*1.1),sz:1.8+Math.random()*2.2});
  }
  CAPTURE_ANIMS.push({x:x,y:y,color:color||'#ffd700',rad:rad||18,sparks:sparks,start:performance.now(),dur:aMs(460)});
}
function drawCaptureAnims(){
  if(!CAPTURE_ANIMS.length)return;
  var now=performance.now();
  for(var i=CAPTURE_ANIMS.length-1;i>=0;i--){
    var ca=CAPTURE_ANIMS[i],t=(now-ca.start)/ca.dur;
    if(t>=1){CAPTURE_ANIMS.splice(i,1);continue;}
    var ease=1-Math.pow(1-t,3),alpha=1-t;
    bctx.save();
    /* 消散光環 */
    bctx.globalAlpha=alpha*0.75;
    bctx.strokeStyle=ca.color;bctx.lineWidth=2.5*(1-t*0.5);
    bctx.beginPath();bctx.arc(ca.x,ca.y,ca.rad*(0.7+ease*1.15),0,Math.PI*2);bctx.stroke();
    /* 內部殘影縮放消散 */
    bctx.globalAlpha=alpha*0.45;
    bctx.fillStyle=ca.color;
    bctx.beginPath();bctx.arc(ca.x,ca.y,Math.max(1,ca.rad*(1-ease*0.85)),0,Math.PI*2);bctx.fill();
    /* 四散星屑 */
    bctx.globalAlpha=alpha*0.9;
    for(var j=0;j<ca.sparks.length;j++){
      var sp=ca.sparks[j];
      var sx=ca.x+Math.cos(sp.ang)*sp.dist*ease;
      var sy=ca.y+Math.sin(sp.ang)*sp.dist*ease;
      bctx.beginPath();bctx.arc(sx,sy,sp.sz*(1-t*0.6),0,Math.PI*2);bctx.fill();
    }
    bctx.restore();
  }
  if(CAPTURE_ANIMS.length>0&&typeof requestAnimationFrame==='function')requestAnimationFrame(render);
}

function drawEffects(){

    bctx.save();

function boardBg(w,h){

  if(style==='wood'){

    for(var wy=8;wy<h;wy+=14){bctx.beginPath();bctx.moveTo(0,wy+Math.sin(wy)*3);bctx.lineTo(w,wy+Math.cos(wy*.7)*3);bctx.stroke();}

  if(style==='stone'){
    var g2=bctx.createLinearGradient(0,0,w,h);
    g2.addColorStop(0,'#3a3f4a');g2.addColorStop(1,'#23262e');

    g3.addColorStop(0,'#e8e8f0');g3.addColorStop(1,'#c8c8d8');
    bctx.fillStyle=g3;bctx.fillRect(0,0,w,h);

    bctx.fillStyle='#16161e';bctx.fillRect(0,0,w,h);

    bctx.globalAlpha=1;return;
  }
  /* default: 星空深藍 */
  var g=bctx.createRadialGradient(w/2,h/2,40,w/2,h/2,w);
  g.addColorStop(0,'#1a1a4e');g.addColorStop(1,'#0a0a24');

var ANIM_MS=340, TTT_DRAW_MS=300;
/* U6: 動畫速度乘數——slow=2x時長, normal=1x, fast=0.5x, off≈0(瞬間)。回傳時長倍率 */
function animScale(){
  var s=state.animSpeed||'normal';
  if(s==='off')return 0.001;

  if(s==='fast')return 0.5;

}
/* 依動畫速度縮放基礎時長（毫秒），保留下限避免除零/瞬間負載 */
function aMs(base){return Math.max(1,Math.round(base*animScale()));}
function easeOutBack(t){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}
function birthT(key){
  var b=state.animBirth[key];
  if(b==null)return 1;
  var t=(performance.now()-b.t)/b.d;
  if(t>=1)return 1;if(t<=0)return 0;return t;
}
function birthScale(key){return easeOutBack(birthT(key));}
function kickAnim(key,dur){

function drawXO(x,y,player,p){

    if(drop&&drop.r===rr&&drop.c===cc){

      py=fy+(c4cy(rr)-fy)*t*t;
    }
    drawCoin(px,py,state.grid[rr][cc],false,1,C4_COIN);
  }
  // 2) 實心板（16 圓洞以 evenodd 鏤空，只透出洞內棋子）
  bctx.save();
  bctx.shadowColor='rgba(77,208,225,.4)';bctx.shadowBlur=18;
  var pg=bctx.createLinearGradient(0,by,0,by+bh);
  pg.addColorStop(0,'#2d2275');pg.addColorStop(1,'#120d38');
  bctx.beginPath();
  bctx.moveTo(bx+16,by);bctx.arcTo(bx+bw,by,bx+bw,by+bh,16);bctx.arcTo(bx+bw,by+bh,bx,by+bh,16);
  bctx.arcTo(bx,by+bh,bx,by,16);bctx.arcTo(bx,by,bx+bw,by,16);bctx.closePath();
  for(var r=0;r<4;r++)for(var c=0;c<4;c++){
    bctx.moveTo(c4cx(c)+C4_SLOT,c4cy(r));
    bctx.arc(c4cx(c),c4cy(r),C4_SLOT,0,Math.PI*2,true);
  }
  bctx.fillStyle=pg;bctx.fill('evenodd');bctx.restore();
  // 3) 圓洞邊緣（凹陷陰影＋頂側微光）
  for(var r2=0;r2<4;r2++)for(var c2=0;c2<4;c2++){
    var x=c4cx(c2),y=c4cy(r2);
    bctx.beginPath();bctx.arc(x,y,C4_SLOT,0,Math.PI*2);
    bctx.strokeStyle='rgba(0,0,0,.6)';bctx.lineWidth=2;bctx.stroke();
    bctx.beginPath();bctx.arc(x,y,C4_SLOT-1,Math.PI*1.12,Math.PI*1.88);
    bctx.strokeStyle='rgba(125,249,255,.2)';bctx.lineWidth=1.5;bctx.stroke();
  }
  c4RoundRect(bx,by,bw,bh,16);bctx.strokeStyle='rgba(125,249,255,.5)';bctx.lineWidth=2;bctx.stroke();
  // 4) 最後一手金圈（疊在板上）
  var lh=state.history[state.history.length-1];
  if(lh&&!drop){
    bctx.strokeStyle='#ffd700';bctx.lineWidth=2;
    bctx.beginPath();bctx.arc(c4cx(lh.col),c4cy(lh.row),C4_COIN+3,0,Math.PI*2);bctx.stroke();
  }
  if(state.win&&state.win.cells){
    var s0=state.win.cells[0],s1=state.win.cells[1],wp=winLineProgress();
    var x1=c4cx(s0[1]),y1=c4cy(s0[0]),x2=c4cx(s1[1]),y2=c4cy(s1[0]);
    bctx.strokeStyle=state.win.player===P1?'#4dd0e1':'#e040fb';
    bctx.lineWidth=5;bctx.lineCap='round';bctx.shadowColor=bctx.strokeStyle;bctx.shadowBlur=20;
    bctx.beginPath();bctx.moveTo(x1,y1);bctx.lineTo(x1+(x2-x1)*wp,y1+(y2-y1)*wp);
    bctx.stroke();bctx.shadowBlur=0;
  }
  drawCoords();
}
function drawCoin(x,y,player,isLast,scale,rad,sx){
  if(scale==null)scale=1;
  if(sx==null)sx=scale;
  bctx.save();bctx.translate(x,y);bctx.scale(sx,scale);bctx.translate(-x,-y);
  var r=rad||28,cyan=player===P1;
  var halo=bctx.createRadialGradient(x,y,r*.5,x,y,r*1.55);
  halo.addColorStop(0,cyan?'rgba(77,208,225,.3)':'rgba(224,64,251,.3)');
  halo.addColorStop(1,'rgba(0,0,0,0)');
  bctx.fillStyle=halo;bctx.beginPath();bctx.arc(x,y,r*1.55,0,Math.PI*2);bctx.fill();
  // 扁平幣面（上下金屬反光，非球面）
  var face=bctx.createLinearGradient(x,y-r,x,y+r);
  if(cyan){face.addColorStop(0,'#2ccfe2');face.addColorStop(.5,'#0097a7');face.addColorStop(1,'#006070');}
  else{face.addColorStop(0,'#e553fc');face.addColorStop(.5,'#a31abb');face.addColorStop(1,'#660f7c');}
  bctx.fillStyle=face;bctx.beginPath();bctx.arc(x,y,r,0,Math.PI*2);bctx.fill();
  // 凸起金屬邊
  bctx.lineWidth=3.5;bctx.strokeStyle=cyan?'#93f2f7':'#f692ff';
  bctx.beginPath();bctx.arc(x,y,r-1.6,0,Math.PI*2);bctx.stroke();
  // 頂緣高光弧
  bctx.lineWidth=2;bctx.strokeStyle='rgba(255,255,255,.6)';
  bctx.beginPath();bctx.arc(x,y,r-2.6,Math.PI*1.15,Math.PI*1.85);bctx.stroke();
  // 內凹槽雙線
  bctx.lineWidth=1.2;bctx.strokeStyle='rgba(0,0,0,.35)';
  bctx.beginPath();bctx.arc(x,y,r-7,0,Math.PI*2);bctx.stroke();
  bctx.strokeStyle='rgba(255,255,255,.22)';
  bctx.beginPath();bctx.arc(x,y,r-8.3,0,Math.PI*2);bctx.stroke();
  // 中心星徽
  bctx.fillStyle='rgba(255,255,255,.85)';starShape(x,y,5,r*.28,r*.12);
  if(isLast){bctx.strokeStyle='#ffd700';bctx.lineWidth=2;bctx.beginPath();bctx.arc(x,y,r+4,0,Math.PI*2);bctx.stroke();}
  bctx.restore();
}
function starShape(cx,cy,sp,oR,iR){
  var rot=-Math.PI/2,step=Math.PI/sp;
  bctx.beginPath();bctx.moveTo(cx,cy+oR);
  for(var i=0;i<sp;i++){bctx.lineTo(cx+Math.cos(rot)*oR,cy+Math.sin(rot)*oR);rot+=step;
    bctx.lineTo(cx+Math.cos(rot)*iR,cy+Math.sin(rot)*iR);rot+=step;}
  bctx.closePath();bctx.fill();
}

var GK_CS=32,GK_PAD=28;
function renderGomoku(){
  boardBg(560,560);
  bctx.strokeStyle='rgba(125,249,255,.3)';bctx.lineWidth=1;
  for(var i=0;i<15;i++){
    bctx.beginPath();bctx.moveTo(GK_PAD,GK_PAD+i*GK_CS);bctx.lineTo(GK_PAD+14*GK_CS,GK_PAD+i*GK_CS);bctx.stroke();
    bctx.beginPath();bctx.moveTo(GK_PAD+i*GK_CS,GK_PAD);bctx.lineTo(GK_PAD+i*GK_CS,GK_PAD+14*GK_CS);bctx.stroke();
  }
  bctx.fillStyle='rgba(255,215,0,.6)';
  var pts=[[3,3],[3,11],[7,7],[11,3],[11,11]];
  for(var p=0;p<pts.length;p++){bctx.beginPath();bctx.arc(GK_PAD+pts[p][1]*GK_CS,GK_PAD+pts[p][0]*GK_CS,4,0,Math.PI*2);bctx.fill();}
  for(var r=0;r<15;r++)for(var c=0;c<15;c++){
    if(state.grid[r][c]===EMPTY)continue;
    drawGKPiece(GK_PAD+c*GK_CS,GK_PAD+r*GK_CS,state.grid[r][c],birthScale('g'+r+'_'+c));}
  /* F4: 禁手提示模式——黑方(P1)輪到時，以紅色虛線小圈標記禁手點（不影響點擊） */
  if(state.gkForbidden&&state.gkForbiddenHint&&state.turn===P1&&!state.over){
    for(var fr=0;fr<15;fr++)for(var fc=0;fc<15;fc++){
      if(state.grid[fr][fc]!==EMPTY)continue;
      if(gkForbiddenCheck(fr,fc,P1)){
        bctx.save();
        bctx.strokeStyle='rgba(255,70,70,.75)';bctx.lineWidth=1.6;bctx.setLineDash([3,3]);
        bctx.beginPath();bctx.arc(GK_PAD+fc*GK_CS,GK_PAD+fr*GK_CS,GK_CS*.3,0,Math.PI*2);bctx.stroke();
        bctx.globalAlpha=.18;bctx.fillStyle='#ff4646';
        bctx.beginPath();bctx.arc(GK_PAD+fc*GK_CS,GK_PAD+fr*GK_CS,GK_CS*.3,0,Math.PI*2);bctx.fill();
        bctx.restore();
      }
    }
  }
  if(state.history.length&&!state.win){
    var h=state.history[state.history.length-1];
    bctx.strokeStyle=h.player===P1?'#ff6b6b':'#ffd700';bctx.lineWidth=2;
    bctx.beginPath();bctx.arc(GK_PAD+h.col*GK_CS,GK_PAD+h.row*GK_CS,GK_CS/2-3,0,Math.PI*2);bctx.stroke();
  }
  if(state.win&&state.win.start&&state.win.end){
    var wp=winLineProgress();
    var x1=GK_PAD+state.win.start[1]*GK_CS,y1=GK_PAD+state.win.start[0]*GK_CS;
    var x2=GK_PAD+state.win.end[1]*GK_CS,y2=GK_PAD+state.win.end[0]*GK_CS;
    bctx.strokeStyle=state.win.player===P1?'#ff6b6b':'#ffd700';
    bctx.lineWidth=4.5;bctx.lineCap='round';bctx.shadowColor=bctx.strokeStyle;bctx.shadowBlur=18;
    bctx.beginPath();bctx.moveTo(x1,y1);bctx.lineTo(x1+(x2-x1)*wp,y1+(y2-y1)*wp);
    bctx.stroke();bctx.shadowBlur=0;
  }
  drawCoords();
}
function drawGKPiece(x,y,player,scale){
  if(scale==null)scale=1;
  bctx.save();bctx.translate(x,y);bctx.scale(scale,scale);bctx.translate(-x,-y);
  var r=14;
  var halo=bctx.createRadialGradient(x,y,r*.4,x,y,r*1.7);
  halo.addColorStop(0,player===P1?'rgba(100,100,180,.35)':'rgba(255,255,200,.4)');
  halo.addColorStop(1,'rgba(0,0,0,0)');
  bctx.fillStyle=halo;bctx.beginPath();bctx.arc(x,y,r*1.7,0,Math.PI*2);bctx.fill();
  var g=bctx.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);
  if(player===P1){g.addColorStop(0,'#5a5a8a');g.addColorStop(.5,'#2a2a4a');g.addColorStop(1,'#0a0a1a');}
  else{g.addColorStop(0,'#fff');g.addColorStop(.5,'#e0e0f0');g.addColorStop(1,'#a0a0c0');}
  bctx.fillStyle=g;bctx.beginPath();bctx.arc(x,y,r,0,Math.PI*2);bctx.fill();
  bctx.fillStyle=player===P1?'rgba(150,150,200,.25)':'rgba(255,255,255,.55)';
  bctx.beginPath();bctx.arc(x-r*.35,y-r*.35,r*.25,0,Math.PI*2);bctx.fill();
  bctx.restore();
}

function fmtTime(s){var m=Math.floor(s/60),ss=Math.floor(s%60);return(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;}
/* 計時模式初始秒數：unlimited=0（正數累加），blitz=600，bullet=180；custom 由使用者輸入分鐘數 */
/* U11: fischer 基礎秒數（預設600=10分），每步增量由 state.fischerInc（秒）控制 */
var TIMER_LIMITS={unlimited:0,blitz:600,rapid:300,bullet:180,bullet1:60,custom:600,fischer:600};
/* G1: 倒數環——半徑14，圓周約 87.96 */
var TIMER_RING_C=2*Math.PI*14;
/* 回傳 0~1 的剩餘比例；無限/無限制回傳 -1（隱藏環）。純函式便於測試 */
function timerRingFraction(remaining,limit){
  if(!limit||limit<=0)return -1;
  var f=remaining/limit;
  if(f<0)f=0;if(f>1)f=1;return f;
}
/* 依剩餘秒數與比例決定環樣式類別：''(綠) / 'timer-ring-yellow' / 'timer-ring-red'。純函式 */
function timerRingClass(remainingSec,frac){
  if(frac<0)return '';
  if(remainingSec<=30)return 'timer-ring-red';
  if(frac<=0.5)return 'timer-ring-yellow';
  return '';
}
function updateTimerUI(){
  var p1=$('timerP1'),p2=$('timerP2');
  if(p1)p1.textContent=fmtTime(state.timer.p1);
  if(p2)p2.textContent=fmtTime(state.timer.p2);
  updateTimerRings();
}
/* G1: 依目前倒數限制更新雙方進度環；無限制隱藏環 */
function updateTimerRings(){
  var bar=$('timerBar');
  var limit=(TIMER_LIMITS[state.timerMode]||0);
  var countdown=limit>0&&!state.questRun;
  if(bar)bar.classList.toggle('no-ring',!countdown);
  updateOneRing('P1',state.timer.p1,countdown?limit:0);
  updateOneRing('P2',state.timer.p2,countdown?limit:0);
}
function updateOneRing(side,remaining,limit){
  var fg=$('ringFg'+side),wrap=$('ringWrap'+side);
  var frac=timerRingFraction(remaining,limit);
  if(!fg)return;
  if(frac<0){ if(wrap)wrap.style.visibility='hidden'; return; }
  if(wrap)wrap.style.visibility='visible';
  if(typeof fg.setAttribute==='function'){
    fg.setAttribute('stroke-dasharray',String(TIMER_RING_C));
    fg.setAttribute('stroke-dashoffset',String(TIMER_RING_C*(1-frac)));
  }
  if(wrap&&wrap.classList){
    wrap.classList.remove('timer-ring-yellow','timer-ring-red');
    var cls=timerRingClass(remaining,frac);
    if(cls)wrap.classList.add(cls);
  }
}
var __lastTickTime=Date.now();
/* F1/M6: 是否有彈窗/覆層打開（規則、成就、統計、筆記等），打開時暫停計時 */
function anyOverlayActive(){
  var ids=['overlay','ruleOverlay','genModal'];
  for(var i=0;i<ids.length;i++){var el=$(ids[i]);if(el&&el.classList&&el.classList.contains('active'))return true;}
  return false;
}
setInterval(function(){
  /* 基於時間戳計算經過秒數，避免背景分頁/計時器被節流造成漂移 */
  var now=Date.now();
  /* M12: 非遊戲視圖（選單/難度等）不扣時，僅刷新基準時間，避免回到棋局時巨量跳時 */
  if(!$('view-game').classList.contains('active')){__lastTickTime=now;return;}
  var delta=(now-__lastTickTime)/1000;
  __lastTickTime=now;
  if(state.over||!state.game)return;
  if(state.replay)return;
  /* F1/M6: 彈窗打開時暫停扣時 */
  if(anyOverlayActive()){updateTimerUI();return;}
  /* M5: AI 思考時(state.thinking=true)輪到的正是 AI(P2)，應繼續扣 AI 的鐘，否則 AI 永不超時；
     原先 `state.turn===P1` 的暫停條件為死代碼（thinking 時 turn 必為 P2），已移除 */
  var tl=(TIMER_LIMITS[state.timerMode]||0)&&!state.questRun;
  if(tl>0){
    /* 倒數模式（闖關解謎不計時） */
    var curSide=state.turn===P1?'p1':'p2';
    var beforeT=state.timer[curSide];
    if(state.turn===P1)state.timer.p1-=delta;else state.timer.p2-=delta;
    /* M4: 低時間警告通用於所有棋種——跨過 30/20/10 秒整界線時播一次 */
    var afterT=state.timer[curSide];
    if(afterT>0&&afterT<30){
      if(Math.ceil(beforeT/10)!==Math.ceil(afterT/10)&&Math.ceil(afterT/10)<=3)playSound('lowtime');
    }
    if(state.timer.p1<=0){state.timer.p1=0;onTimeOut(P1);}
    else if(state.timer.p2<=0){state.timer.p2=0;onTimeOut(P2);}
  }else{
    /* 無限制：正數累加 */
    if(state.turn===P1)state.timer.p1+=delta;else state.timer.p2+=delta;
  }
  updateTimerUI();
},500);
/* 倒數計時歸零：該方超時落敗 */
function onTimeOut(timedOutSide){
  if(state.over)return;
  var winner=timedOutSide===P1?P2:P1;
  state.timeoutSide=timedOutSide;
  finish({timeout:timedOutSide},winner);
}

var arrowDrag=null,longPressTimer=null,longPressFired=false;
/* F2: 多色箭頭循環（青→金→品紅），每次新畫一條換下一個顏色 */
var ARROW_COLORS=['rgba(77,208,225,.75)','rgba(255,215,0,.75)','rgba(224,64,251,.75)'];
var arrowColorIdx=0;
function nextArrowColor(){var c=ARROW_COLORS[arrowColorIdx%ARROW_COLORS.length];arrowColorIdx++;return c;}
function canvasPos(e){
  var rect=boardCanvas.getBoundingClientRect();
  var cx=(e.clientX!=null?e.clientX:0),cy=(e.clientY!=null?e.clientY:0);
  return{x:(cx-rect.left)*(boardW()/rect.width),y:(cy-rect.top)*(boardH()/rect.height)};
}
boardCanvas.addEventListener('contextmenu',function(e){e.preventDefault();});
boardCanvas.addEventListener('mousedown',function(e){
  if(state.game!=='chess')return;
  if(e.button!==2)return; /* 僅右鍵 */
  e.preventDefault();
  var p=canvasPos(e),cell=chessCellFromPoint(p.x,p.y);
  if(cell)arrowDrag={fr:cell.r,fc:cell.c,tr:cell.r,tc:cell.c};
});
boardCanvas.addEventListener('mousemove',function(e){
  if(!arrowDrag)return;
  var p=canvasPos(e),cell=chessCellFromPoint(p.x,p.y);
  if(cell){arrowDrag.tr=cell.r;arrowDrag.tc=cell.c;render();}
});
if(typeof window!=='undefined')window.addEventListener('mouseup',function(e){
  if(!arrowDrag)return;
  var a=arrowDrag;arrowDrag=null;
  if(a.fr===a.tr&&a.fc===a.tc){
    /* 起點=終點：清除該格相關箭頭 */
    state.chArrows=state.chArrows.filter(function(x){return !(x.fr===a.fr&&x.fc===a.fc);});
  }else{
    state.chArrows.push({fr:a.fr,fc:a.fc,tr:a.tr,tc:a.tc,color:nextArrowColor()});
  }
  render();
});
/* 移動端：長按 300ms 進入箭頭模式 */
boardCanvas.addEventListener('touchstart',function(e){
  if(state.game!=='chess'||!e.touches||!e.touches.length)return;
  var t=e.touches[0];
  longPressTimer=setTimeout(function(){
    var p=canvasPos(t),cell=chessCellFromPoint(p.x,p.y);
    if(cell){arrowDrag={fr:cell.r,fc:cell.c,tr:cell.r,tc:cell.c};longPressFired=true;}
  },300);
},{passive:true});
boardCanvas.addEventListener('touchmove',function(e){
  if(!longPressTimer)return;clearTimeout(longPressTimer);longPressTimer=null;
  if(!arrowDrag||!e.touches||!e.touches.length)return;
  var p=canvasPos(e.touches[0]),cell=chessCellFromPoint(p.x,p.y);
  if(cell){arrowDrag.tr=cell.r;arrowDrag.tc=cell.c;render();}
},{passive:true});
boardCanvas.addEventListener('touchend',function(){
  if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;}
  if(!arrowDrag)return;
  var a=arrowDrag;arrowDrag=null;
  if(a.fr===a.tr&&a.fc===a.tc){
    state.chArrows=state.chArrows.filter(function(x){return !(x.fr===a.fr&&x.fc===a.fc);});
  }else{
    state.chArrows.push({fr:a.fr,fc:a.fc,tr:a.tr,tc:a.tc,color:nextArrowColor()});
  }
  render();
});

function clickTTT(mx,my){
  if(state.tttDrawing)return;
  var c=Math.floor((mx-TTT_OFF)/TTT_S),r=Math.floor((my-TTT_OFF)/TTT_S);
  if(r<0||r>2||c<0||c>2)return;
  var idx=r*3+c;if(state.grid[idx]!==EMPTY)return;
  playTTT(idx,state.turn,function(ended){if(!ended)afterPlayer();});
}
/* 落子＋描邊動畫鎖：動畫畫完才回呼，期間禁止再落子 */
function playTTT(idx,player,cb){
  if(state.tttDrawing)return;
  state.tttDrawing=true;
  placeTTT(idx,player);
  var ended=state.over;
  var gen=state.gen; /* Bug3: 動畫期間重開局，舊回呼不得在新局上觸發 afterPlayer */
  setTimeout(function(){
    if(gen!==state.gen)return;
    state.tttDrawing=false;if(cb)cb(ended);
  },aMs(TTT_DRAW_MS));
}
function placeTTT(idx,player){
  state.grid[idx]=player;state.history.push({idx:idx,player:player});kickAnim('t'+idx,aMs(TTT_DRAW_MS));
  recordHeatmap(Math.floor(idx/3),idx%3,player);
  var line=winTTT(idx,player);
  if(line){finish({line:line},player);return;}
  if(state.history.length===9){drawFinish();return;}
  state.turn=state.turn===P1?P2:P1;updateTurnUI();
}
function winTTT(idx,player){
  var lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(var i=0;i<lines.length;i++){var ln=lines[i];
    if(ln.indexOf(idx)>=0&&state.grid[ln[0]]===player&&state.grid[ln[1]]===player&&state.grid[ln[2]]===player)return ln;}
  return null;
}

function clickC4(mx,my){
  var c=Math.floor((mx-C4_OFF)/C4_S);if(c<0||c>3)return;
  var r=c4Lowest(c);if(r<0)return;
  dropC4(r,c,state.turn);
}
function placeC4(r,c,player){
  state.grid[r][c]=player;state.history.push({row:r,col:c,player:player});playSound('place');
  recordHeatmap(r,c,player);
  var cells=winLineC4(r,c,player);
  if(cells)return{win:cells};
  if(state.history.length===16)return{draw:true};
  /* M6: 只切換資料層回合，UI 標題延後到下落動畫結束（dropC4 的 setTimeout）再更新 */
  state.turn=state.turn===P1?P2:P1;return null;
}
function dropC4(r,c,player){
  var res=placeC4(r,c,player);
  var dur=aMs(200+r*70);
  var gen=state.gen; /* Bug2: 下落動畫期間重開局，舊 timeout 不得在新局 finish */
  state.c4Drop={r:r,c:c,t:performance.now(),d:dur};
  if(!state.animating){state.animating=true;requestAnimationFrame(animTick);}
  setTimeout(function(){
    if(gen!==state.gen)return;
    state.c4Drop=null;
    updateTurnUI(); /* M6: 動畫結束後才切換回合標題，避免提前跳轉 */
    if(res&&res.win)finish({cells:res.win},player);
    else if(res&&res.draw)drawFinish();
    else afterPlayer();
  },dur+25);
}
function c4Lowest(c){for(var r=3;r>=0;r--)if(state.grid[r][c]===EMPTY)return r;return-1;}
function winLineC4(r,c,player){
  for(var d=0;d<DIRS4.length;d++){var dr=DIRS4[d][0],dc=DIRS4[d][1];
    var line=[[r,c]];
    var rr=r+dr,cc=c+dc;
    while(rr>=0&&rr<4&&cc>=0&&cc<4&&state.grid[rr][cc]===player){line.push([rr,cc]);rr+=dr;cc+=dc;}
    rr=r-dr;cc=c-dc;
    while(rr>=0&&rr<4&&cc>=0&&cc<4&&state.grid[rr][cc]===player){line.unshift([rr,cc]);rr-=dr;cc-=dc;}
    if(line.length>=4)return[line[0],line[line.length-1]];}
  return null;
}

function clickGomoku(mx,my){
  var c=Math.round((mx-GK_PAD)/GK_CS),r=Math.round((my-GK_PAD)/GK_CS);
  if(r<0||r>=15||c<0||c>=15||state.grid[r][c]!==EMPTY)return;
  if(placeGomoku(r,c,state.turn))afterPlayer();
}
function clickC6(mx,my){
  var c=Math.round((mx-GK_PAD)/GK_CS),r=Math.round((my-GK_PAD)/GK_CS);
  if(r<0||r>=15||c<0||c>=15||state.grid[r][c]!==EMPTY)return;
  placeC6(r,c,state.turn);afterPlayer();
}
function placeGomoku(r,c,player){
  state.grid[r][c]=player;state.history.push({row:r,col:c,player:player});
  if(gkForbiddenCheck(r,c,player)){
    state.grid[r][c]=EMPTY;state.history.pop();
    playSound('illegal');showToast(tr('forbidden'));
    return false;
  }
  kickAnim('g'+r+'_'+c);playSound('place');
  recordHeatmap(r,c,player);
  var line=winLineGK(r,c,player);
  if(line){finish({start:line[0],end:line[line.length-1]},player);return true;}
  if(state.history.length===225){drawFinish();return true;}
  state.turn=state.turn===P1?P2:P1;updateTurnUI();
  return true;
}
function winLineGK(r,c,player){
  for(var d=0;d<DIRS4.length;d++){var dr=DIRS4[d][0],dc=DIRS4[d][1];
    var line=[[r,c]];
    var rr=r+dr,cc=c+dc;
    while(rr>=0&&rr<15&&cc>=0&&cc<15&&state.grid[rr][cc]===player){line.push([rr,cc]);rr+=dr;cc+=dc;}
    rr=r-dr;cc=c-dc;
    while(rr>=0&&rr<15&&cc>=0&&cc<15&&state.grid[rr][cc]===player){line.unshift([rr,cc]);rr-=dr;cc-=dc;}
    if(line.length>=5)return line;}
  return null;
}
/* 五子禁手（僅黑方 P1）：長連、雙四、雙三 */
function gkCountLine(r,c,dr,dc,player){var cnt=1,rr=r+dr,cc=c+dc;
  while(rr>=0&&rr<15&&cc>=0&&cc<15&&state.grid[rr][cc]===player){cnt++;rr+=dr;cc+=dc;}
  rr=r-dr;cc=c-dc;
  while(rr>=0&&rr<15&&cc>=0&&cc<15&&state.grid[rr][cc]===player){cnt++;rr-=dr;cc-=dc;}
  return cnt;}
function gkLineOpen(r,c,dr,dc,player){var rr=r,cc=c;
  while(rr+dr>=0&&rr+dr<15&&cc+dc>=0&&cc+dc<15&&state.grid[rr+dr][cc+dc]===player){rr+=dr;cc+=dc;}
  var e1=(rr+dr>=0&&rr+dr<15&&cc+dc>=0&&cc+dc<15&&state.grid[rr+dr][cc+dc]===EMPTY);
  rr=r;cc=c;
  while(rr-dr>=0&&rr-dr<15&&cc-dc>=0&&cc-dc<15&&state.grid[rr-dr][cc-dc]===player){rr-=dr;cc-=dc;}
  var e2=(rr-dr>=0&&rr-dr<15&&cc-dc>=0&&cc-dc<15&&state.grid[rr-dr][cc-dc]===EMPTY);
  return e1&&e2;}
/* Bug B14: AI 執黑時內部黑方為 P2（swap 後），用此旗標讓禁手檢查適用於 AI */
var gkInternalBlack=false;
function gkForbiddenCheck(r,c,player){
  if(!state.gkForbidden)return false;
  /* Bug B14: 人局黑=P1；AI 執黑時經 swapGridColors 後內部黑=P2，以旗標切換禁手方 */
  var blackSide=(typeof gkInternalBlack!=='undefined'&&gkInternalBlack)?P2:P1;
  if(player!==blackSide)return false;
  /* 長連（黑方6子以上連線，五子棋連勝規則為5子）直接禁手；成五(5子)是連勝、非禁手。
     注意：長連門檻固定為6，不可用 GK_WIN_LEN（六子棋可能被改為6） */
  for(var d0=0;d0<4;d0++){var d0r=DIRS4[d0][0],d0c=DIRS4[d0][1];
    var cnt0=gkCountLine(r,c,d0r,d0c,player);
    if(cnt0>=6)return true;
    if(cnt0===5)return false;}
  /* M13: 改用基於 GK_PAT 模式表的方向評分，涵蓋跳四(10111等)/跳活三(010110等)，
     不再只用 contiguous gkCountLine，避免漏判跳型雙三/雙四 */
  var fours=0,threes=0;
  for(var d=0;d<4;d++){var s=gkDirPat(r,c,DIRS4[d][0],DIRS4[d][1],player);
    if(s===GKS.RUSH_FOUR||s===GKS.LIVE_FOUR)fours++;
    else if(s===GKS.LIVE_THREE)threes++;}
  return fours>=2||threes>=2;
}
/* 檢查落子 (r,c) 所在方向 (dr,dc) 的四連是否至少一端延伸到空位（衝四） */
function gkFourHasOpenEnd(r,c,dr,dc,player){
  var er=r,ec=c;
  while(er+dr>=0&&er+dr<15&&ec+dc>=0&&ec+dc<15&&state.grid[er+dr][ec+dc]===player){er+=dr;ec+=dc;}
  var openPlus=(er+dr>=0&&er+dr<15&&ec+dc>=0&&ec+dc<15&&state.grid[er+dr][ec+dc]===EMPTY);
  var sr=r,sc=c;
  while(sr-dr>=0&&sr-dr<15&&sc-dc>=0&&sc-dc<15&&state.grid[sr-dr][sc-dc]===player){sr-=dr;sc-=dc;}
  var openMinus=(sr-dr>=0&&sr-dr<15&&sc-dc>=0&&sc-dc<15&&state.grid[sr-dr][sc-dc]===EMPTY);
  return openPlus||openMinus;
}

/* ================================================================
   悔棋 Undo（撤銷一步；AI 模式撤到玩家上一次落子前，相容無步 pass）
   ================================================================ */
function undoGoStep(h){
  if(h.kind==='pass'){state.passN=h.prevPassN;state.turn=h.player;GO_LAST=null;return;}
  state.grid[h.r][h.c]=EMPTY;var go=h.player===P1?P2:P1;
  for(var i=0;i<h.capt.length;i++)state.grid[h.capt[i][0]][h.capt[i][1]]=go;
  state.ko=h.prevKo;state.passN=h.prevPassN;
  if(h.player===P1)state.cap.p1=h.prevCap;else state.cap.p2=h.prevCap;
  GO_LAST=null;state.turn=h.player;
}
function undoMove(){
  if(state.replay||state.over||state.thinking||state.snapIdx<=0||state.c4Drop||state.tttDrawing)return;
  state.usedUndo=true;playSound('undo');
  clearTimeout(aiTimer);clearTimeout(aiInnerTimer);clearTimeout(pendingAITimer);state.gen++;
  $('thinking').classList.remove('active');state.thinking=false;
  /* F11-3: 戰術訓練/殘局悔棋 → 直接重置回題目初始局面，否則 tacticStep/tacticWrong 與棋盤不同步。
     僅限國際象棋（戰術/殘局皆為 chess 專屬），避免其他棋種殘留的 index 誤觸發 */
  if((state.tacticIndex>=0||state.puzzleIndex>=0)&&state.game==='chess'){
    var pzFen=null;
    if(state.tacticIndex>=0){
      var t=TACTICS[state.tacticIndex];
      if(t){pzFen=t.fen;state.tacticStep=0;state.tacticWrong=0;}
    }else{
      var pz=CHESS_PUZZLES[state.puzzleIndex];
      if(pz)pzFen=pz.fen;
    }
    if(pzFen){
      fenToGrid(pzFen);                 /* 重置棋盤/輪次/易位權，內部已清空 history */
      state.snapshots=[];saveSnapshot();state.snapIdx=0;  /* 重建為單一初始幀 */
      updateScore();updateUndoBtn();updateEvalBar();
      if(!state.over)saveGame();
      return;
    }
  }
  clearTimeout(qAITimer);
  if(state.mode==='pvp'||state.mode==='spectate'){
    state.snapIdx--;
  }else{
    var targetIdx=state.snapIdx-1;
    while(targetIdx>0&&state.snapshots[targetIdx]&&state.snapshots[targetIdx].turn!==P1)targetIdx--;
    state.snapIdx=Math.max(0,targetIdx);
  }
  var undoSnap=state.snapshots[state.snapIdx];
  /* 先清選子/提示，再還原快照（快照內的 goLast/history 等會覆蓋） */
  clearSelection();
  restoreSnapshot(undoSnap);
  updateTurnUI();render();updateScore();updateUndoBtn();updateEvalBar();
  /* Bug8: 悔棋後局面已變更，需一併更新 localStorage 存盤 */
  if(!state.over)saveGame();
  /* M6: 旁觀模式悔棋後重新觸發 AI，否則雙 AI 對局停頓 */
  if(state.mode==='spectate'&&!state.over)setTimeout(triggerAI,300);
}
/* 清空所有棋種的選子/高亮/提示狀態（悔棋與重做共用） */
function clearSelection(){
  CK.sel=null;CK.ends={};CK.paths={};CK.jumped=false;
  CH.sel=null;CH.moves=[];
  JG.sel=null;JG.moves=[];
  if(typeof XQ!=='undefined'){XQ.sel=null;XQ.moves=[];}
  if(typeof DR!=='undefined'){DR.sel=null;DR.moves=[];DR.chain=null;}
  state.coachHints=[];
  GO_LAST=null;state.hint=null;state.c4Drop=null;
  /* M10: 悔棋/切換局面時清除進行中的動畫，避免棋子殘留飄浮 */
  state.animMove=null;
}
function redoMove(){
  if(state.replay||state.snapIdx>=state.snapshots.length-1)return;
  state.snapIdx++;
  var s=state.snapshots[state.snapIdx];
  /* 先清選子/提示，再還原快照（快照內的 goLast/history 等會覆蓋） */
  clearSelection();
  restoreSnapshot(s);
  updateTurnUI();render();updateScore();updateUndoBtn();updateEvalBar();
  /* Bug8: 重做後局面已變更，需一併更新 localStorage 存盤 */
  if(!state.over)saveGame();
  /* C2: 重做後若輪到 AI（人機 P2 / 旁觀）須自動走子，否則人機悔棋再重做會卡死 */
  if(!state.over){
    if(state.mode==='spectate')setTimeout(triggerAI,300);
    else if(state.mode==='ai'&&state.turn===P2)triggerAI();
  }
}
/* ---- 棋譜回放 ---- */
function startReplay(){
  if(state.snapshots.length<2)return;
  /* C3: 進入回放前徹底停止 AI，避免回放期間 AI 仍走子污染局面 */
  clearTimeout(aiTimer);clearTimeout(aiInnerTimer);state.gen++;disposeEngines();
  state.thinking=false;
  var thEl=$('thinking');if(thEl)thEl.classList.remove('active');
  $('overlay').classList.remove('active');
  state.replay=true;
  state.snapIdx=0;
  restoreSnapshot(state.snapshots[0]);
  $('replayBar').classList.remove('hidden');
  /* 回放模式禁用操作按鈕 */
  ['btnHint','btnUndo','btnRedo','btnGameRestart'].forEach(function(id){
    var b=$(id);if(b){b.disabled=true;b.classList.add('is-disabled');}
  });
  var gb=$('gameHeader');if(gb)gb.classList.add('replay-mode');
  updateReplayPos();
  updateTurnUI();render();updateScore();
}
function updateReplayPos(){
  var p=$('replayPos');if(p)p.textContent=(state.snapIdx+1)+'/'+state.snapshots.length;
  /* F4: 同步進度條 */
  var sl=$('replaySlider');
  if(sl){sl.max=Math.max(0,state.snapshots.length-1);sl.value=state.snapIdx;}
}
/* F4: 跳轉到第 idx 個快照（供進度條拖拽） */
function replaySeek(idx){
  idx=Math.max(0,Math.min(state.snapshots.length-1,idx));
  if(idx===state.snapIdx)return;
  state.snapIdx=idx;
  restoreSnapshot(state.snapshots[idx]);
  updateReplayPos();
  updateTurnUI();render();updateScore();
  updateReplayCommentary(); /* U12: AI 講解隨回放更新 */
}
/* U12: AI 逐步講解——依目前回放位置顯示上一手的評價/評估變化/原因 */
function updateReplayCommentary(){
  var box=$('replayCommentary');if(!box)return;
  if(!state.aiCommentary||!state.replay||state.snapIdx<=0){box.classList.add('hidden');box.innerHTML='';return;}
  var moveIdx=state.snapIdx-1;
  var d=explainMoveData(moveIdx);
  var q=moveQuality((state.moveEvals[moveIdx-1]||{eval:0}).eval,(state.moveEvals[moveIdx]||{eval:0}).eval,d.mover);
  var qSym=q?q.sym:'';
  var qColor=q?(q.cls==='q-excellent'||q.cls==='q-good')?'#ffd700':(q.cls==='q-blunder'?'#ff6b6b':'#ffaa44'):'#9aa0c0';
  var tags='';
  var tagMap={captured:tr('captured'),check:tr('check'),mate:tr('mate'),castle:tr('castle'),promotion:tr('promotion'),goodMove:tr('goodMove'),blunderMove:tr('blunderMove')};
  for(var i=0;i<d.tags.length;i++)tags+='<span class="explain-tag">'+(tagMap[d.tags[i]]||d.tags[i])+'</span>';
  box.innerHTML='<div style="font-size:.8rem"><b style="color:'+qColor+';font-size:1rem">'+qSym+'</b>'
    +' <span style="color:#9aa0c0">'+tr('whyThisMove')+'</span> '
    +'<span style="color:'+(d.change>=0?'#4dd0e1':'#ff6b6b')+'">'+(d.change>=0?'+':'')+d.change+'</span>'
    +' <span style="color:rgba(255,255,255,.6)">'+tags+'</span></div>';
  box.classList.remove('hidden');
}
function replayStep(dir){
  replaySeek(state.snapIdx+dir);
}
/* H6: 自動回放 */
var replayAutoTimer=null;
function stopReplayAuto(){
  if(replayAutoTimer){clearInterval(replayAutoTimer);replayAutoTimer=null;}
  state.replayPlaying=false;
  var pb=$('replayPlay');if(pb)pb.textContent=tr('replayPlay');
}
function toggleReplayPlay(){
  if(state.replayPlaying){stopReplayAuto();return;}
  state.replayPlaying=true;
  var pb=$('replayPlay');if(pb)pb.textContent=tr('replayPause');
  replayAutoTimer=setInterval(function(){
    if(!state.replay){stopReplayAuto();return;}
    if(state.snapIdx>=state.snapshots.length-1){stopReplayAuto();return;}
    replayStep(1);
  },state.replaySpeed||1000);
}
function setReplaySpeed(ms){
  state.replaySpeed=ms;
  if(state.replayPlaying){stopReplayAuto();toggleReplayPlay();}
}
function exitReplay(){
  stopReplayAuto();
  state.replay=false;
  state.snapIdx=state.snapshots.length-1;
  restoreSnapshot(state.snapshots[state.snapIdx]);
  restoreReplayUI();
  updateTurnUI();render();updateScore();updateUndoBtn();
  /* M10: 退出回放後若輪到 AI（人機 P2 / 旁觀）須自動走子，否則停頓 */
  if(!state.over){
    if(state.mode==='spectate')setTimeout(triggerAI,300);
    else if(state.mode==='ai'&&state.turn===P2)triggerAI();
  }
}
/* 還回放 UI 狀態：隱藏回放條、重啟用操作按鈕、移除 replay-mode class。新局開局時也呼叫，避免回放狀態殘留 */
function restoreReplayUI(){
  state.replay=false;
  var rb=$('replayBar');if(rb)rb.classList.add('hidden');

function updateGameSettingsLock(){

function formatMove(m,idx){
  var g=state.game,note='';
  if(g==='ttt'){note='#'+(m.idx+1);}
  else if(g==='c4'){note='col'+(m.col+1);}
  else if(g==='gomoku'||g==='c6'){note=String.fromCharCode(65+m.col)+(15-m.row);}
  else if(g==='checkers'){note=m.from+'→'+m.to;}
  else if(g==='go'){note=m.kind==='pass'?'pass':String.fromCharCode(65+m.c)+(GO_N-m.r);}
  else if(g==='jungle'){note='('+m.fr+','+m.fc+')→('+m.tr+','+m.tc+')';}
  else if(g==='chess'){
    if(m.snap){var s=m.snap,mm=s.m;
      var from=String.fromCharCode(97+mm.fc)+(8-mm.fr),to=String.fromCharCode(97+mm.tc)+(8-mm.tr);
      if(mm.flag==='ck')note='O-O';
      else if(mm.flag==='cq')note='O-O-O';
      else if(s.cap)note=from+'x'+to;
      else note=from+'-'+to;
      if(mm.flag==='promo')note+='='+(mm.promoType||'Q');
    }else note='?';
  }
  else if(g==='reversi'){note=String.fromCharCode(65+m.col)+(8-m.row);}
  else if(g==='xiangqi'){note='('+m.fr+','+m.fc+')→('+m.tr+','+m.tc+')';}
  else if(g==='draughts'){note=String.fromCharCode(97+m.fc)+(8-m.fr)+'→'+String.fromCharCode(97+m.tc)+(8-m.tr);}
  else if(g==='hex'){note=String.fromCharCode(65+m.c)+(m.r+1);}
  else if(g==='pente'){note=String.fromCharCode(65+m.col)+(15-m.row)+(m.caps&&m.caps.length?'x'+m.caps.length:'');}
  else if(g==='dots'){note=(m.t==='h'?'H':'V')+'('+(m.r+1)+','+(m.c+1)+')'+(m.scored?'+'+m.scored:'');}
  else if(g==='morris'){note=(m.from!=null?(m.from+1)+'→':'#')+(m.node+1)+(m.cap!=null?'x'+(m.cap+1):'');}
  else if(g==='mancala'){note='Pit '+(m.pit<6?'A'+(m.pit+1):'B'+(m.pit-6))+(m.bonus?'★':'');}
  return note;
}

function restoreSnapshot(s){
  if(!s)return;
  if(s.grid)state.grid=JSON.parse(JSON.stringify(s.grid));
  state.turn=s.turn;state.over=s.over;state.win=s.win;
  if(s.ko!==undefined)state.ko=s.ko;
  if(s.passN!==undefined)state.passN=s.passN;
  if(s.ch)state.ch=JSON.parse(JSON.stringify(s.ch));
  if(s.ck)state.ck=JSON.parse(JSON.stringify(s.ck));
  if(s.cap)state.cap=JSON.parse(JSON.stringify(s.cap));
  if(s.rvPass!==undefined)state.rvPass=s.rvPass;
  if(s.lastP1!==undefined)state.lastP1=s.lastP1;
  if(s.lastAny!==undefined)state.lastAny=s.lastAny;
  if(s.c6Second!==undefined)state.c6Second=s.c6Second;
  if(s.penteCap)state.penteCap=JSON.parse(JSON.stringify(s.penteCap));
  if(s.dots)state.dots=JSON.parse(JSON.stringify(s.dots));
  if(s.morris)state.morris=JSON.parse(JSON.stringify(s.morris));
  if(s.mancala)state.mancala=JSON.parse(JSON.stringify(s.mancala));
  if(s.qSnap&&state.questRun){
    Q.grid=s.qSnap.grid.slice();state.grid=Q.grid;Q.turn=s.qSnap.turn;Q.over=s.qSnap.over;Q.moves=s.qSnap.moves;
    if(s.qSnap.big)Q.big=s.qSnap.big.slice();
    if(s.qSnap.fadeOrder)Q.fadeOrder=s.qSnap.fadeOrder.slice();
  }
  if(s.chess960!==undefined)state.chess960=!!s.chess960;
  if(s.ch960!==undefined)state.ch960=s.ch960?JSON.parse(JSON.stringify(s.ch960)):null;
  if(s.goLast!==undefined)GO_LAST=s.goLast;
  /* 還原走子歷史與好壞標註（完整副本，避免長度截斷造成空洞） */
  if(s.hist)state.history=s.hist.slice();
  if(s.evals)state.moveEvals=s.evals.slice();
  /* Bug M4: 還原雙方剩餘時間，否則悔棋後計時器不回滾 */
  if(s.timer){state.timer.p1=s.timer.p1;state.timer.p2=s.timer.p2;updateTimerUI();}
  /* Bug10: 還原棋盤後重建國際象棋 Zobrist 鍵，否則三次重複和棋/置換表索引錯誤 */
  if(state.game==='chess')chKeyBoard();
}

/* Bug9: 繼續對局後從歷史重放重建快照鏈，使悔棋/回放可用。
   僅對「直接落子型」棋種（ttt/c4/gomoku/c6）逐手重放格；其餘棋種保留單幀終局（保守不降級現狀）。 */
function rebuildSnapshotsFromHistory(){
  state.snapshots=[];state.snapIdx=0;state.replay=false;
  var hist=(state.history||[]).slice();
  var simple=(state.game==='ttt'||state.game==='c4'||state.game==='gomoku'||state.game==='c6'||state.game==='hex');
  if(!simple){saveSnapshot();return;}
  var finalGrid=state.grid?JSON.parse(JSON.stringify(state.grid)):null;
  var finalTurn=state.turn;
  if(state.game==='ttt')state.grid=[0,0,0,0,0,0,0,0,0];
  else if(state.game==='c4')state.grid=mk2D(4,4);
  else if(state.game==='hex')state.grid=mk2D(HX_N,HX_N);
  else state.grid=mk2D(15,15);
  state.history=[];state.turn=P1;
  saveSnapshot();
  for(var i=0;i<hist.length;i++){
    var h=hist[i];
    if(state.game==='ttt'){if(h.idx!==undefined)state.grid[h.idx]=h.player;}
    else if(state.game==='hex'){if(h.r!==undefined&&h.c!==undefined)state.grid[h.r][h.c]=h.player;}
    else{if(h.row!==undefined&&h.col!==undefined)state.grid[h.row][h.col]=h.player;}
    state.history=hist.slice(0,i+1);
    if(state.game==='c6'){
      state.c6Second=((i+1)%2===0);
      if(i===0||!state.c6Second)state.turn=(h.player===P1?P2:P1);
    }else{
      state.turn=(h.player===P1?P2:P1);
    }
    saveSnapshot();
  }
  if(finalGrid)state.grid=finalGrid;
  state.history=hist;
  state.turn=finalTurn;
  state.snapIdx=state.snapshots.length-1;
}

function hapticFor(type){
  var map={place:10,capture:30,check:20,win:[50,40,50,40,80],lose:30,undo:10,castle:20,promote:25,lowtime:15};
  var p=map[type];if(p==null)return;
  haptic(p);
}
function playSound(type){
  hapticFor(type);
  if(!state.soundOn||!state.volume)return;
  if(state.soundMix&&state.soundMix[type]===false)return; /* F7: 個別音效靜音 */
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx&&audioCtx.state==='suspended'){try{audioCtx.resume();}catch(e){}}
    ensureAudioPool();
    var t=audioCtx.currentTime;
    var g=audioPool[audioPoolIdx];audioPoolIdx=(audioPoolIdx+1)%audioPool.length;
    var o=audioCtx.createOscillator();
    o.connect(g);
    var v=state.volume;
    if(type==='place'){o.type='sine';o.frequency.value=520;g.gain.setValueAtTime(0.12*v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.09);o.start(t);o.stop(t+0.09);}
    else if(type==='capture'){o.type='square';o.frequency.value=180;g.gain.setValueAtTime(0.08*v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.14);o.start(t);o.stop(t+0.14);}
    else if(type==='win'){o.type='sine';g.gain.setValueAtTime(0.18*v,t);
      o.frequency.setValueAtTime(523,t);o.frequency.setValueAtTime(659,t+0.12);o.frequency.setValueAtTime(784,t+0.24);o.frequency.setValueAtTime(1047,t+0.36);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.6);o.start(t);o.stop(t+0.6);}
    else if(type==='lose'){o.type='sine';g.gain.setValueAtTime(0.15*v,t);
      o.frequency.setValueAtTime(392,t);o.frequency.setValueAtTime(330,t+0.15);o.frequency.setValueAtTime(262,t+0.3);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.5);o.start(t);o.stop(t+0.5);}
    else if(type==='draw'){o.type='triangle';o.frequency.value=440;g.gain.setValueAtTime(0.1*v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);o.start(t);o.stop(t+0.3);}
    else if(type==='click'){o.type='sine';o.frequency.value=800;g.gain.setValueAtTime(0.06*v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);o.start(t);o.stop(t+0.05);}
    else if(type==='undo'){o.type='sine';o.frequency.setValueAtTime(600,t);o.frequency.exponentialRampToValueAtTime(300,t+0.15);g.gain.setValueAtTime(0.08*v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);o.start(t);o.stop(t+0.15);}
    else if(type==='hint'){o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1100,t+0.08);g.gain.setValueAtTime(0.08*v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.start(t);o.stop(t+0.2);}
    else if(type==='illegal'){o.type='sawtooth';o.frequency.value=150;g.gain.setValueAtTime(0.06*v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);o.start(t);o.stop(t+0.12);}
    else if(type==='check'){o.type='sine';g.gain.setValueAtTime(0.14*v,t);
      o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+0.1);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.22);o.start(t);o.stop(t+0.22);}
    else if(type==='castle'){o.type='sine';g.gain.setValueAtTime(0.12*v,t);
      o.frequency.setValueAtTime(440,t);o.frequency.setValueAtTime(554,t+0.09);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.22);o.start(t);o.stop(t+0.22);}
    else if(type==='promote'){o.type='triangle';g.gain.setValueAtTime(0.13*v,t);
      o.frequency.setValueAtTime(523,t);o.frequency.setValueAtTime(659,t+0.09);
      o.frequency.setValueAtTime(784,t+0.18);o.frequency.setValueAtTime(1047,t+0.27);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.45);o.start(t);o.stop(t+0.45);}
    else if(type==='pass'){o.type='sine';o.frequency.value=700;g.gain.setValueAtTime(0.07*v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.08);o.start(t);o.stop(t+0.08);}
    else if(type==='lowtime'){o.type='square';o.frequency.value=1000;g.gain.setValueAtTime(0.08*v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.06);o.start(t);o.stop(t+0.06);}
  }catch(e){}
}
function drawFinish(){
  state.over=true;state.score.draw++;render();updateScore();playSound('draw');
  clearSavedGame();
  var drawGen=state.gen;
  setTimeout(function(){if(drawGen!==state.gen)return;showResult('draw');},400);
}
function finish(win,player){
  state.over=true;if(win&&!win.player)win.player=player;state.win=win;state.winAnimStart=performance.now();
  if(player===P1)state.score.p1++;else state.score.p2++;
  render();updateScore();playSound(state.mode==='ai'?(player===P1?'win':'lose'):'win');
  clearSavedGame();
  /* G3: 每日挑戰——玩家獲勝時記錄完成 */
  if(state.mode==='ai'&&player===P1)markDailyCompleted();
  /* G7: 謎題——對局結束（將勝）時標記完成 */
  if(state.puzzleIndex>=0&&player===P1)markPuzzleSolved(state.puzzleIndex);
  var type;
  if(state.mode==='ai')type=player===P1?'win':'lose';
  else type=player===P1?'p1win':'p2win';
  if(odysseyOnFinish(win,player))return; /* V5: 星海遠征接管結果彈窗 */
  if(tournamentOnFinish(win,player))return; /* F5: 錦標賽自行接管結果彈窗 */
  var finishGen=state.gen;
  setTimeout(function(){if(finishGen!==state.gen)return;showResult(type,player);},450);
}

var TOUR_GAMES=['ttt','c4','gomoku','go','jungle','chess','reversi','checkers','xiangqi','draughts','hex','pente','dots','morris','mancala'];
var TOUR_DIFFS=['easy','normal','hard','master','master'];
function showTournament(){
  loadTournament();
  var html='<div class="puzzle-list" style="max-height:260px;overflow:auto">';
  html+='<div style="margin-bottom:6px;opacity:.7;font-size:.85rem">'+tr('tournamentPickGames')+'</div>';
  for(var i=0;i<TOUR_GAMES.length;i++){var g=TOUR_GAMES[i];
    html+='<label style="display:block;margin:4px 0"><input type="checkbox" class="tour-chk" data-g="'+g+'" checked> '+tr('name.'+g)+'</label>';}
  html+='</div>';
  html+='<button class="primary-btn" id="btnTourStart" type="button" style="margin-top:8px">'+tr('tournamentStart')+'</button>';
  showModal(tr('tournament'),html);
  document.getElementById('btnTourStart').addEventListener('click',function(e){
    e.preventDefault();
    var boxes=document.querySelectorAll('.tour-chk');var picked=[];
    for(var j=0;j<boxes.length;j++)if(boxes[j].checked)picked.push(boxes[j].getAttribute('data-g'));
    if(picked.length<3){showToast(tr('tournamentPickGames'));return;}
    state.tournament={games:picked,round:0,reviveUsed:false,done:false,log:[]};
    saveTournament();closeModal();tournamentNextMatch();
  });
}
function tournamentDiff(){return TOUR_DIFFS[Math.min(state.tournament.round,TOUR_DIFFS.length-1)];}
function tournamentNextMatch(){
  var t=state.tournament;if(!t)return;
  var g=t.games[Math.floor(Math.random()*t.games.length)];
  t.nextGame=g;t.nextDiff=tournamentDiff();saveTournament();
  closeModal();
  startGame(g,'ai',t.nextDiff);
}
/* finish() 攔截：處理錦標賽勝負 */
function tournamentOnFinish(win,player){
  var t=state.tournament;if(!t||t.done||state.mode!=='ai')return false;
  var humanWon=(player===P1&&win);
  var html='<div style="text-align:center;padding:8px">';
  html+='<div style="font-size:1.1rem;margin-bottom:6px">'+tr('tournamentRound')+' '+(t.round+1)+' · '+tr('name.'+t.nextGame)+'</div>';
  if(humanWon){
    t.log.push('W');t.round++;
    if(t.round>=t.games.length+2){ /* 打完足夠輪次即奪冠 */
      t.done=true;saveTournament();
      unlockAchievement('tournament'); /* U2: 錦標賽冠軍成就 */
      html+='<div style="color:#ffd700;font-size:1.3rem;margin:10px 0">'+tr('tournamentChampion')+'</div>';
      html+='<button class="primary-btn" id="btnTourEnd" type="button">OK</button>';
      showModal(tr('tournamentDone'),html);
      document.getElementById('btnTourEnd').addEventListener('click',function(){state.tournament=null;saveTournament();closeModal();toMenu();});
      return true;
    }
    saveTournament();
    html+='<div style="color:#4dd0e1;margin:8px 0">'+tr('tournamentWin')+'</div>';
    html+='<div style="opacity:.7;font-size:.85rem;margin-bottom:8px">'+tr('tournamentNextMatch')+'：'+tr('tournamentRound')+' '+(t.round+1)+'</div>';
    html+='<button class="primary-btn" id="btnTourNext" type="button">'+tr('tournamentNextMatch')+'</button>';
    showModal(tr('tournamentProgress'),html);
    document.getElementById('btnTourNext').addEventListener('click',function(){tournamentNextMatch();});
    return true;
  }else{
    if(!t.reviveUsed){
      t.reviveUsed=true;saveTournament();
      html+='<div style="color:#e040fb;margin:8px 0">'+tr('tournamentLost')+'</div>';
      html+='<button class="primary-btn" id="btnTourRevive" type="button" style="margin-bottom:6px">'+tr('tournamentRevive')+'</button><br>'
        +'<button class="mini-btn" id="btnTourOut" type="button">'+tr('tournamentEliminated')+'</button>';
      showModal(tr('tournamentProgress'),html);
      document.getElementById('btnTourRevive').addEventListener('click',function(){tournamentNextMatch();});
      document.getElementById('btnTourOut').addEventListener('click',function(){state.tournament=null;saveTournament();closeModal();toMenu();});
      return true;
    }
    t.done=true;saveTournament();
    html+='<div style="color:#e040fb;margin:8px 0">'+tr('tournamentEliminated')+'</div>';
    html+='<button class="primary-btn" id="btnTourEnd2" type="button">OK</button>';
    showModal(tr('tournament'),html);
    document.getElementById('btnTourEnd2').addEventListener('click',function(){state.tournament=null;saveTournament();closeModal();toMenu();});
    return true;
  }
}

/* ================================================================
   AI 觸發
   ================================================================ */
var aiTimer=null,aiInnerTimer=null;
/* C5: 旁觀/續局等延遲觸發的 AI 計時器統一追蹤，切局/悔棋/回選單時一併取消 */
var pendingAITimer=null;
/* 銷毀異步引擎（切棋種/回主選單/重開時呼叫），避免 worker 殘留回調 */
function disposeEngines(){
  try{if(typeof StockfishEngine!=='undefined'){StockfishEngine.destroy();StockfishEngine.callback=null;StockfishEngine.evalCallback=null;}}catch(e){}
  try{if(typeof KataGoEngine!=='undefined'){KataGoEngine.destroy();KataGoEngine.callback=null;KataGoEngine.awaitingGenmove=false;}}catch(e){}
}
function triggerAI(){
  if(state.replay)return; /* C3: 回放模式禁止 AI 走子 */
  if(state.thinking||state.over)return;
  var gen=state.gen; /* 局勢代號：過期回調直接丟棄 */
  state.thinking=true;$('thinking').classList.add('active');
  /* 國際象棋大師難度：使用 Stockfish（異步） */
  if(state.game==='chess'&&state.diff==='master'){
    StockfishEngine.load();
    aiTimer=setTimeout(function(){
      if(gen!==state.gen)return;
      if(state.over){state.thinking=false;$('thinking').classList.remove('active');return;}
      var fen=chessToFEN();
      var timedOut=false;
      aiInnerTimer=setTimeout(function(){
        if(gen!==state.gen)return;
        timedOut=true;
        /* 超時降級到內建 hard 難度 */
        state.thinking=false;$('thinking').classList.remove('active');
        if(!state.over){
          var origDiff=state.diff;state.diff='hard';
          var fallbackMove=aiChess();
          state.diff=origDiff;
          if(fallbackMove&&!state.over)aiDoMove(fallbackMove);
        }
      },5000);
      /* G4: 註冊即時評估回調 */
      StockfishEngine.evalCallback=function(ev){
        state.engineEval=ev;
        if(!state.over)updateEvalBar();
      };
      StockfishEngine.getBestMove(fen,function(best){
        if(gen!==state.gen)return;
        if(timedOut)return;
        clearTimeout(aiInnerTimer);
        state.thinking=false;$('thinking').classList.remove('active');
        if(!best||state.over){
          /* Stockfish 失敗降級到內建 hard 難度 */
          if(!state.over){
            var origDiff2=state.diff;state.diff='hard';
            var fallbackMove2=aiChess();
            state.diff=origDiff2;
            if(fallbackMove2&&!state.over)aiDoMove(fallbackMove2);
          }
          return;
        }
        /* 解析 Stockfish 的走法（e2e4 格式） */
        var fc=best.charCodeAt(0)-97,fr=8-parseInt(best[1]);
        var tc=best.charCodeAt(2)-97,tr=8-parseInt(best[3]);
        var promo=best.length>4?best[4].toUpperCase():null;
        var moves=chAllLegal(state.turn);
        for(var i=0;i<moves.length;i++){
          if(moves[i].fr===fr&&moves[i].fc===fc&&moves[i].tr===tr&&moves[i].tc===tc){
            if(promo)moves[i].promoType=promo;
            aiDoMove(moves[i]);
            return;
          }
        }
        /* 走法不匹配，降級到內建 hard 難度 */
        if(!state.over){
          var origDiff3=state.diff;state.diff='hard';
          var fallbackMove3=aiChess();
          state.diff=origDiff3;
          if(fallbackMove3&&!state.over)aiDoMove(fallbackMove3);
        }
      });
    },300);
    return;
  }
  /* 圍棋大師難度：使用 KataGo（異步） */
  if(state.game==='go'&&state.diff==='master'){
    KataGoEngine.load();
    aiTimer=setTimeout(function(){
      if(gen!==state.gen)return;
      if(state.over){state.thinking=false;$('thinking').classList.remove('active');return;}
      var cmds=goToGTPCommands();
      var color=state.turn===P1?'black':'white';
      var timedOut=false;
      aiInnerTimer=setTimeout(function(){
        if(gen!==state.gen)return;
        timedOut=true;
        /* 超時降級到內建 hard 難度 */
        state.thinking=false;$('thinking').classList.remove('active');
        if(!state.over){
          var origDiff=state.diff;state.diff='hard';
          var fallbackMove=aiGo();
          state.diff=origDiff;
          if(fallbackMove&&!state.over)aiDoMove(fallbackMove);
        }
      },8000);
      KataGoEngine.getBestMove(cmds,color,function(best){
        if(gen!==state.gen)return;
        if(timedOut)return;
        clearTimeout(aiInnerTimer);
        state.thinking=false;$('thinking').classList.remove('active');
        if(!best||state.over||best==='pass'||best==='resign'){
          /* KataGo 失敗或pass，降級到內建 hard 難度 */
          if(!state.over){
            var origDiff2=state.diff;state.diff='hard';
            var fallbackMove2=aiGo();
            state.diff=origDiff2;
            if(fallbackMove2&&!state.over)aiDoMove(fallbackMove2);
          }
          return;
        }
        /* 解析 KataGo 的走法（D4 格式） */
        try{
          var coord=gtpToGoCoord(best);
          if(coord.r>=0&&coord.r<GO_N&&coord.c>=0&&coord.c<GO_N&&state.grid[coord.r][coord.c]===EMPTY){
            aiDoMove({r:coord.r,c:coord.c});
            return;
          }
        }catch(e){}
        /* 走法不匹配，降級到內建 hard 難度 */
        if(!state.over){
          var origDiff3=state.diff;state.diff='hard';
          var fallbackMove3=aiGo();
          state.diff=origDiff3;
          if(fallbackMove3&&!state.over)aiDoMove(fallbackMove3);
        }
      });
    },300);
    return;
  }
  aiTimer=setTimeout(function(){
    if(gen!==state.gen)return;
    if(state.over){state.thinking=false;$('thinking').classList.remove('active');return;}
    var move=aiPickMove();
    state.thinking=false;$('thinking').classList.remove('active');
    if(!move||state.over)return;
    aiDoMove(move);
  },300);
}
/* AI 動作選擇分發 */
/* 交換棋盤顏色（用於從 P1 視角計算提示） */
function swapGridColors(){
  var g=state.grid;
  if(g&&g.length){
    if(Array.isArray(g[0])){
      for(var r=0;r<g.length;r++)for(var c=0;c<g[r].length;c++){
        if(g[r][c]===P1)g[r][c]=P2;else if(g[r][c]===P2)g[r][c]=P1;}
    }else{
      for(var i=0;i<g.length;i++){
        if(g[i]===P1)g[i]=P2;else if(g[i]===P2)g[i]=P1;}
    }
  }
  if(state.game==='checkers'&&state.ck){
    for(var id in state.ck){
      if(state.ck[id]===P1)state.ck[id]=P2;else if(state.ck[id]===P2)state.ck[id]=P1;}
  }
  if(state.game==='checkers'&&typeof CK_HOLES!=='undefined'&&CK_HOLES&&CK_HOLES.length){
    for(var j=0;j<CK_HOLES.length;j++){
      if(CK_HOLES[j].p===P1)CK_HOLES[j].p=P2;else if(CK_HOLES[j].p===P2)CK_HOLES[j].p=P1;}
  }
}
/* 計算當前玩家（P1）的最佳走法提示 */
function hintMove(){
  if(state.over||state.thinking||state.turn!==P1)return null;
  var g=state.game;
  /* 對稱純色棋種可用 swapGridColors；方向性/物件棋種直接以 state.hinting=true 為 P1 搜尋 */
  var sym=(g==='ttt'||g==='c4'||g==='gomoku'||g==='c6'||g==='go'||g==='reversi');
  state.hinting=true;
  var m=null;
  try{
    if(sym){swapGridColors();try{m=aiPickMove();}finally{swapGridColors();}}
    else{m=aiPickMove();}
  }finally{state.hinting=false;}
  return m;
}
function showHint(){
  if(state.replay)return;
  var m=hintMove();
  if(!m){state.hint=null;render();playSound('illegal');return;}
  state.hint=m;state.hintUsedThisGame=true; /* U2: Purist 成就追蹤 */
  playSound('hint');
  render();
  /* 3秒後自動清除 */
  setTimeout(function(){if(state.hint===m){state.hint=null;render();}},3000);
}
/* ============ F4: 自訂 AI 強度（1-100） ============ */
/* 回歸 1..100 的標準強度值：easy≈12, normal≈38, hard≈72, master≈95, custom=customDiff */
function aiStr(){
  if(state.diff==='custom')return Math.max(1,Math.min(100,state.customDiff||50));
  return state.diff==='easy'?12:state.diff==='normal'?38:state.diff==='hard'?72:95;
}
/* 國際象棋自訂時限（ms）：1000-4000 線性映射 */
function aiChessDeadline(){var s=aiStr();return 1000+Math.round((s-1)/99*3000);}
/* 五子棋/六子棋自訂時限（ms） */
function aiGkDeadline(){var s=aiStr();return 600+Math.round(s/100*3400);}
/* 跳棋自訂時限（ms） */
function aiCkDeadline(){var s=aiStr();return 300+Math.round(s/100*2700);}
/* 黑白棋搜索深度偏移：強度越高越深 */
function aiRvDepthBias(){return Math.round((aiStr()-1)/99*4);}
/* ============ F2/F5: 進度持久化 ============ */
function loadTsumego(){try{var s=localStorage.getItem('starchess.tsumego');if(s)state.tsumegoSolved=JSON.parse(s)||{};}catch(e){state.tsumegoSolved={};}}
function saveTsumego(){try{localStorage.setItem('starchess.tsumego',JSON.stringify(state.tsumegoSolved||{}));}catch(e){}}
function markTsumegoSolved(i){state.tsumegoSolved=state.tsumegoSolved||{};state.tsumegoSolved[i]=1;saveTsumego();}
function loadTournament(){try{var s=localStorage.getItem('starchess.tournament');if(s)state.tournament=JSON.parse(s)||null;}catch(e){state.tournament=null;}}
function saveTournament(){try{if(state.tournament)localStorage.setItem('starchess.tournament',JSON.stringify(state.tournament));else localStorage.removeItem('starchess.tournament');}catch(e){}}
function aiPickMove(){
  var origDiff=state.diff;
  if(state.mode==='spectate'){state.diff=state.turn===P1?'easy':'hard';}
  var m=null;
  if(state.game==='ttt')m=aiTTT();
  else if(state.game==='c4')m=aiC4();
  else if(state.game==='gomoku')m=aiGomoku();
  else if(state.game==='c6')m=aiC6();
  else if(state.game==='checkers')m=aiCheckers();
  else if(state.game==='go')m=aiGo();
  else if(state.game==='jungle')m=aiJungle();
  else if(state.game==='chess')m=aiChess();
  else if(state.game==='reversi')m=aiReversi();
  else if(state.game==='xiangqi')m=aiXiangqi();
  else if(state.game==='draughts')m=aiDraughts();
  else if(state.game==='hex')m=aiHex();
  else if(state.game==='pente')m=aiPente();
  else if(state.game==='dots')m=aiDots();
  else if(state.game==='morris')m=aiMorris();
  else if(state.game==='mancala')m=aiMancala();
  state.diff=origDiff;
  return m;
}
/* AI 動作執行分發 */
function aiDoMove(m){
  var p=state.mode==='spectate'?state.turn:P2;
  if(state.game==='ttt'){playTTT(m.idx,p,function(ended){if(!ended)afterPlayer();});}
  else if(state.game==='c4'){dropC4(m.row,m.col,p);} /* dropC4 動畫結束後內部呼叫 afterPlayer */
  else if(state.game==='gomoku'){placeGomoku(m.row,m.col,p);if(!state.over)afterPlayer();}
  else if(state.game==='c6'){/* H7: aiC6 只回傳座標，以此處真實顏色 p 連下兩子 */
    var p6=state.mode==='spectate'?state.turn:P2;
    if(m&&m.m1)placeC6(m.m1.row,m.m1.col,p6);
    if(m&&m.m2&&!state.over)placeC6(m.m2.row,m.m2.col,p6);
    if(!state.over)afterPlayer();}
  else if(state.game==='checkers')doCheckersMove(m.from,m.to);
  else if(state.game==='go')doGoMove(m);
  else if(state.game==='jungle')doJungleMove(m.fr,m.fc,m.tr,m.tc);
  else if(state.game==='chess')doChessMove(m.fr,m.fc,m.tr,m.tc,m);
  else if(state.game==='reversi'){placeReversi(m.row,m.col,p);} /* rvAdvance 內部存檔 */
  else if(state.game==='xiangqi')doXiangqiMove(m.fr,m.fc,m.tr,m.tc);
  else if(state.game==='draughts')doDraughtsMove(m);
  else if(state.game==='hex'){placeHex(m.r,m.c,p);if(!state.over)afterPlayer();}
  else if(state.game==='pente'){placePente(m.row,m.col,p);if(!state.over)afterPlayer();}
  else if(state.game==='dots'){doDotsMove(m.t,m.r,m.c,p);}
  else if(state.game==='morris'){doMorrisAIMove(m,p);}
  else if(state.game==='mancala'){doMancalaMove(m.pit,p);}
}

   井字棋 AI
   ================================================================ */
function emptyTTT(){var a=[];for(var i=0;i<9;i++)if(state.grid[i]===EMPTY)a.push(i);return a;}
function aiTTT(){
  var aiP=state.mode==='spectate'?state.turn:P2;
  if(aiP===P1){swapGridColors();var m=aiTTTInternal();swapGridColors();return m;}
  return aiTTTInternal();
}
function aiTTTInternal(){
  var g=state.grid;
  if(state.diff==='easy'){var e=emptyTTT();
    if(Math.random()<.8)return{idx:e[Math.floor(Math.random()*e.length)]};}
  if(state.diff!=='hard'){
    var e2=emptyTTT();
    for(var i=0;i<e2.length;i++){g[e2[i]]=P2;if(winTTT(e2[i],P2)){g[e2[i]]=EMPTY;return{idx:e2[i]};}g[e2[i]]=EMPTY;}
    for(var j=0;j<e2.length;j++){g[e2[j]]=P1;if(winTTT(e2[j],P1)){g[e2[j]]=EMPTY;return{idx:e2[j]};}g[e2[j]]=EMPTY;}
    var order=[4,0,2,6,8,1,3,5,7];
    for(var k=0;k<order.length;k++)if(g[order[k]]===EMPTY)return{idx:order[k]};
  }
  var best=-Infinity,bm=-1;
  for(var m=0;m<9;m++){if(g[m]!==EMPTY)continue;
    g[m]=P2;var sc=mmTTT(0,false);g[m]=EMPTY;
    if(sc>best){best=sc;bm=m;}}
  return{idx:bm};
}
function mmTTT(depth,isMax){
  var g=state.grid;
  var lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(var i=0;i<lines.length;i++){var ln=lines[i];
    if(g[ln[0]]!==EMPTY&&g[ln[0]]===g[ln[1]]&&g[ln[1]]===g[ln[2]])
      return g[ln[0]]===P2?10-depth:depth-10;}
  var full=true;for(var k=0;k<9;k++)if(g[k]===EMPTY){full=false;break;}
  if(full)return 0;
  if(isMax){var best=-Infinity;
    for(var m=0;m<9;m++){if(g[m]!==EMPTY)continue;g[m]=P2;best=Math.max(best,mmTTT(depth+1,false));g[m]=EMPTY;}
    return best;
  }else{var best2=Infinity;
    for(var n=0;n<9;n++){if(g[n]!==EMPTY)continue;g[n]=P1;best2=Math.min(best2,mmTTT(depth+1,true));g[n]=EMPTY;}
    return best2;}
}

function qDrop(col,down){var N=Q.size;
  for(var i=0;i<N;i++){var row=down?N-1-i:i,k=row*N+col;
    if(!Q.block[k]&&Q.grid[k]===EMPTY)return k;}return -1;}
function clickQuest(mx,my){
  if(Q.over)return;
  if(Q.layers){var Lf=-1;
    for(var L=0;L<3;L++){var x0=6+L*Q.l3step;
      if(mx>=x0&&mx<=x0+Q.l3pw&&my>=Q.l3y&&my<=Q.l3y+Q.l3pw){Lf=L;break;}}
    if(Lf<0)return;
    var lx=6+Lf*Q.l3step,lcell=Q.l3pw/3,
      lc=Math.floor((mx-lx)/lcell),lr=Math.floor((my-Q.l3y)/lcell);
    if(lr<0||lr>2||lc<0||lc>2)return;
    var li=Lf*9+lr*3+lc;if(Q.grid[li]!==EMPTY)return;
    qPlace(li,P1);return;}
  if(Q.ult){var uc=Math.floor(mx/120),ur=Math.floor(my/120);
    if(ur<0||ur>2||uc<0||uc>2)return;
    var UB=ur*3+uc,ix=mx-uc*120,iy=my-ur*120,
      upc=Math.floor(ix/40),upr=Math.floor(iy/40);
    if(upr<0||upr>2||upc<0||upc>2)return;
    /* Bug B11: 所屬小盤已被某方奪下後不可再落子 */
    if(Q.big[UB])return;
    var ui=UB*9+upr*3+upc;if(Q.grid[ui]!==EMPTY)return;
    qPlace(ui,P1);return;}
  var c=Math.floor((mx-Q.off)/Q.cell),r=Math.floor((my-Q.off)/Q.cell);
  if(r<0||r>=Q.size||c<0||c>=Q.size)return;
  var kind=qKind(),idx=r*Q.size+c;
  if(kind==='move'){
    var p1Cnt=0;for(var mi=0;mi<Q.grid.length;mi++)if(Q.grid[mi]===P1)p1Cnt++;
    if(p1Cnt<3){
      if(!Q.block[idx]&&Q.grid[idx]===EMPTY)qPlace(idx,P1);
      return;
    }
    if(Q.grid[idx]===P1){Q.moveSel=idx;qRender();return;}
    if(Q.moveSel!=null&&Q.grid[idx]===EMPTY&&!Q.block[idx]){var from=Q.moveSel;Q.moveSel=null;
      Q.grid[from]=EMPTY;delete Q.placedAt[from];qPlace(idx,P1);}return;}
  if(kind==='free'){
    if(Q.block[idx]||Q.grid[idx]!==EMPTY)return;
    var fmark=Q.freeMark;
    Q.grid[idx]=fmark;Q.moves++;Q.placedAt[idx]=performance.now();qKick('t'+idx);playSound('place');
    var fw=qWhoWins(Q.grid);

    if(qFull(Q.grid)){qEnd('draw');return;}

var QDIRS4Q=[[0,1],[1,0],[1,1],[1,-1]];
/* layer3 連線：層內8線 + 跨層豎直 + 4條空間主對角 */
function qL3Win(g){
  var QL3=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(var L=0;L<3;L++)for(var i=0;i<8;i++){var ln=QL3[i],a=L*9+ln[0],b=L*9+ln[1],c=L*9+ln[2];
    if(g[a]!==EMPTY&&g[a]===g[b]&&g[b]===g[c])return{player:g[a],cells:[a,b,c]};}
  for(var p=0;p<9;p++){if(g[p]!==EMPTY&&g[p]===g[p+9]&&g[p+9]===g[p+18])return{player:g[p],cells:[p,p+9,p+18]};}
  var SD=[[0,13,26],[2,13,24],[6,13,20],[8,13,18]];
  for(var s=0;s<4;s++){var z=SD[s];
    if(g[z[0]]!==EMPTY&&g[z[0]]===g[z[1]]&&g[z[1]]===g[z[2]])return{player:g[z[0]],cells:z};}
  return null;
}
/* 通用連線偵測：size×size 盤、連 need 個；回 {player,cells} */
function qDirLines(g){if(Q.layers)return qL3Win(g);var N=Q.size,M=Q.need;
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){var v=g[r*N+c];if(v===EMPTY)continue;
    for(var d=0;d<4;d++){var dr=QDIRS4Q[d][0],dc=QDIRS4Q[d][1],cells=[],ok=true;
      for(var t=0;t<M;t++){var nr=r+dr*t,nc=c+dc*t;
        if(nr<0||nr>=N||nc<0||nc>=N||g[nr*N+nc]!==v){ok=false;break;}cells.push(nr*N+nc);}
      if(ok)return{player:v,cells:cells};}}
  return null;
}
function qWhoWins(g){var r=qDirLines(g);return r?r.player:null;}
function qFull(g){for(var i=0;i<g.length;i++)if(g[i]===EMPTY)return false;return true;}
function qTransform(){var kind=qKind();
  if(kind==='chaos'){var vals=Q.grid.slice();
    for(var i=vals.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=vals[i];vals[i]=vals[j];vals[j]=t;}
    Q.grid=vals;}
  else if(kind==='rotate'&&Q.moves%2===0){var rn=Q.size,rng=[];
    for(var ri=0;ri<rn*rn;ri++)rng.push(0);

function qPincer(idx,player){var opp=player===P1?P2:P1,pn=Q.size,pr=Math.floor(idx/pn),pc=idx%pn;

      if(a1r<0||a1r>=pn||a1c<0||a1c>=pn||a2r<0||a2r>=pn||a2c<0||a2c>=pn)continue;
      if(Q.grid[a1r*pn+a1c]===opp&&Q.grid[a2r*pn+a2c]===player)Q.grid[a1r*pn+a1c]=EMPTY;}}}

function qAiPick(empt){

function qMM(depth,isMax,misere,maxDepth){

function aiC4Internal(){

function c4Pos(r,c,player){

    if(rr<0||rr>=4||cc<0||cc>=4||state.grid[rr][cc]!==EMPTY)block++;
    rr=r-dr;cc=c-dc;

    if(rr<0||rr>=4||cc<0||cc>=4||state.grid[rr][cc]!==EMPTY)block++;

function mmC4(depth,isMax,tt){

var GKS={FIVE:10000000,LIVE_FOUR:1000000,RUSH_FOUR:60000,LIVE_THREE:24000,
  SLEEP_THREE:1200,LIVE_TWO:600,SLEEP_TWO:60,LIVE_ONE:8};
var GK_DEF=1.18;                  // 防守係數：更偏防守，更早介入對手潛在威脅
function inB(r,c){return r>=0&&r<15&&c>=0&&c<15;}
/* 棋型模式表（1=己方 0=空 2=堵/出界；匹配時模式須覆蓋落子中心） */
var GK_PAT={
  FIVE:['11111'],LIVE_FOUR:['011110'],
  RUSH_FOUR:['21111','11112','10111','11011','11101'],
  LIVE_THREE:['011100','001110','010110','011010'],
  SLEEP_THREE:['211100','001112','211010','010112','210110','011012','10101','10011','11001'],
  LIVE_TWO:['0110','01010','010010'],
  SLEEP_TWO:['2110','0112','21010','01012','210010','010012']};
var GK_LEVEL=[['FIVE',GKS.FIVE],['LIVE_FOUR',GKS.LIVE_FOUR],['RUSH_FOUR',GKS.RUSH_FOUR],
  ['LIVE_THREE',GKS.LIVE_THREE],['SLEEP_THREE',GKS.SLEEP_THREE],['LIVE_TWO',GKS.LIVE_TWO],
  ['SLEEP_TWO',GKS.SLEEP_TWO]];
/* 假設 (r,c) 落子為 p，回某方向最強棋型分（含跳棋型） */
function gkDirPat(r,c,dr,dc,p){
  var s=[];
  for(var k=-4;k<=4;k++){
    if(k===0){s.push('1');continue;}
    var nr=r+k*dr,nc=c+k*dc;
    if(!inB(nr,nc))s.push('2');
    else{var v=state.grid[nr][nc];s.push(v===p?'1':v===EMPTY?'0':'2');}
  }
  var str=s.join('');
  for(var li=0;li<GK_LEVEL.length;li++){var pats=GK_PAT[GK_LEVEL[li][0]],score=GK_LEVEL[li][1];
    for(var pi=0;pi<pats.length;pi++){var pat=pats[pi],L=pat.length;
      for(var st=0;st+L<=9;st++)
        if(st<=4&&st+L-1>=4&&str.substr(st,L)===pat)return score;}}
  return 0;
}
function pointScore(r,c,p){
  var total=0,nRF=0,nLT=0;
  for(var d=0;d<4;d++){var s=gkDirPat(r,c,DIRS4[d][0],DIRS4[d][1],p);total+=s;
    if(s===GKS.RUSH_FOUR)nRF++;if(s===GKS.LIVE_THREE)nLT++;}
  if(nRF>=2||(nRF>=1&&nLT>=1)||nLT>=2)total+=GKS.LIVE_FOUR;  // 雙衝四/四三/雙活三≈活四
  return total;
}
function gkCands(range){
  var mark={},has=false;
  for(var r=0;r<15;r++)for(var c=0;c<15;c++){
    if(state.grid[r][c]===EMPTY)continue;has=true;
    for(var dr=-range;dr<=range;dr++)for(var dc=-range;dc<=range;dc++){
      var nr=r+dr,nc=c+dc;
      if(inB(nr,nc)&&state.grid[nr][nc]===EMPTY)mark[nr*15+nc]=true;}}
  if(!has)return[{row:7,col:7}];
  var list=[];for(var k in mark)list.push({row:Math.floor(k/15),col:k%15});
  return list;
}
function evalAll(){
  var ai=0,hu=0;
  for(var r=0;r<15;r++)for(var c=0;c<15;c++){
    if(state.grid[r][c]===P2)ai+=pointScore(r,c,P2);
    else if(state.grid[r][c]===P1)hu+=pointScore(r,c,P1);}
  var defMul=state.aiPersona==='aggressive'?0.88:state.aiPersona==='defensive'?1.42:GK_DEF;
  return ai-hu*defMul;
}
/* Zobrist 增量哈希，搜索更快、更深 */
var ZB=(function(){var t=[];

    t[zr][zc][P1]=(Math.random()*0xffffffff)|0;t[zr][zc][P2]=(Math.random()*0xffffffff)|0;}}

var GKTT={},HIST={},KILLER={},GK_DEADLINE=0,GK_NODES=0,GK_VC_NODES=0,GK_WIN_LEN=5;
/* M17: 依當前棋種所需連線數判定勝利（五子棋5、六子棋6） */
function gkWinAt(r,c,player){

    var rr=r+dr,cc=c+dc;while(inB(rr,cc)&&state.grid[rr][cc]===player){cnt++;rr+=dr;cc+=dc;}
    rr=r-dr;cc=c-dc;while(inB(rr,cc)&&state.grid[rr][cc]===player){cnt++;rr-=dr;cc-=dc;}

var GK_VC_LIMIT=200000; /* VCF/VCT 節點兜底，防止 hard 中盤掛起 */
function scoredCands(me,opp,range){
  var cs=gkCands(range);

function widthAt(depth){return depth<=2?60:depth<=4?42:depth<=6?32:24;}

function gkFive(r,c,player){

/* ===== VCF（連續衝四強制成五）搜尋 ===== */

function gkFours(p){var cs=gkCands(2),out=[];
  for(var i=0;i<cs.length;i++){var m=cs[i];
    if(pointScore(m.row,m.col,p)>=GKS.RUSH_FOUR)out.push(m);}

/* att 連衝四、def 被堵；回 {win,first(獲勝首著)} */
function vcfLine(att,def,depth){

/* ===== VCT（連續活三攻擊強制成五）搜尋 =====

function gkThrees(p){var cs=gkCands(2),out=[];

function vctLine(att,def,depth){

      for(var b=0;b<Math.min(defCands.length,4);b++){var bp=defCands[b];

          var r=vctLine(att,def,depth-1);

        }finally{state.grid[bp.row][bp.col]=EMPTY;}
