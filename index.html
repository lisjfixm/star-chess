<link rel="manifest" href='data:application/json,%7B%22name%22%3A%22%E6%98%9F%E4%B9%8B%E6%A3%8B%22%2C%22short_name%22%3A%22%E6%98%9F%E4%B9%8B%E6%A3%8B%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22orientation%22%3A%22portrait%22%2C%22background_color%22%3A%22%2305051a%22%2C%22theme_color%22%3A%22%2305051a%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data:image/svg+xml,%253Csvg%2520xmlns%253D%2527http%253A//www.w3.org/2000/svg%2527%2520viewBox%253D%25270%25200%2520100%2520100%2527%253E%253Crect%2520width%253D%2527100%2527%2520height%253D%2527100%2527%2520rx%253D%252720%2527%2520fill%253D%2527%252305051a%2527/%253E%253Cpath%2520d%253D%2527M50%252015%2520L61%252038%2520L86%252040%2520L67%252056%2520L73%252081%2520L50%252067%2520L27%252081%2520L33%252056%2520L14%252040%2520L39%252038%2520Z%2527%2520fill%253D%2527%25234dd0e1%2527/%253E%253C/svg%3E%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image/svg+xml%22%2C%22purpose%22%3A%22any%22%7D%5D%7D'>
<title>星之棋</title>
<style>
/* ==================== 星之棋 · 樣式表 ==================== */
/* ---- 主題變數（預設：star） ---- */
:root{
  --p1:#4dd0e1;  --p1-glow:rgba(77,208,225,.4);
  --p1-soft:rgba(77,208,225,.12); --p1-border:rgba(77,208,225,.45);
  --p2:#e040fb;  --p2-glow:rgba(224,64,251,.4);
  --p2-soft:rgba(224,64,251,.12); --p2-border:rgba(224,64,251,.35);
  --gold:#ffd700;
  --line:rgba(255,255,255,.15);
  --bg-deep:#0a0e27; --bg-mid:#141838;
  --title-from:#4dd0e1;--title-mid:#ffffff;--title-to:#e040fb;
}
body.theme-aurora{
  background:radial-gradient(ellipse at 30% 20%,#0d2a3a 0%,#051520 50%,#020a12 100%);
  --p1:#00e6a0;  --p1-glow:rgba(0,230,160,.4);
  --p1-soft:rgba(0,230,160,.12); --p1-border:rgba(0,230,160,.45);
  --p2:#b366ff;  --p2-glow:rgba(179,102,255,.4);
  --p2-soft:rgba(179,102,255,.12); --p2-border:rgba(179,102,255,.35);
  --line:rgba(0,230,160,.15);
  --bg-deep:#04181a; --bg-mid:#0a2a26;
  --title-from:#00ffaa;--title-mid:#aaffee;--title-to:#aa66ff;
}
body.theme-sunset{
  background:radial-gradient(ellipse at 70% 30%,#3a1510 0%,#200a08 50%,#120404 100%);
  --p1:#ffab40;  --p1-glow:rgba(255,171,64,.4);
  --p1-soft:rgba(255,171,64,.12); --p1-border:rgba(255,171,64,.45);
  --p2:#ff5277;  --p2-glow:rgba(255,82,119,.4);
  --p2-soft:rgba(255,82,119,.12); --p2-border:rgba(255,82,119,.35);
  --line:rgba(255,171,64,.15);
  --bg-deep:#1a0a08; --bg-mid:#2a120c;
  --title-from:#ffaa44;--title-mid:#ffddaa;--title-to:#ff5577;
}
body.theme-deepsea{
  background:radial-gradient(ellipse at 40% 60%,#0a2540 0%,#051530 50%,#020a1a 100%);
  --p1:#29d8ff;  --p1-glow:rgba(41,216,255,.4);
  --p1-soft:rgba(41,216,255,.12); --p1-border:rgba(41,216,255,.45);
  --p2:#b388ff;  --p2-glow:rgba(179,136,255,.4);
  --p2-soft:rgba(179,136,255,.12); --p2-border:rgba(179,136,255,.35);
  --line:rgba(41,216,255,.15);
  --bg-deep:#04122a; --bg-mid:#082040;
  --title-from:#00bfff;--title-mid:#87ceeb;--title-to:#1e90ff;
}
body.theme-lava{
  background:radial-gradient(ellipse at 50% 40%,#4a1010 0%,#2a0808 50%,#150404 100%);
  --p1:#ff9100;  --p1-glow:rgba(255,145,0,.4);
  --p1-soft:rgba(255,145,0,.12); --p1-border:rgba(255,145,0,.45);
  --p2:#ff3d3d;  --p2-glow:rgba(255,61,61,.4);
  --p2-soft:rgba(255,61,61,.12); --p2-border:rgba(255,61,61,.35);
  --line:rgba(255,145,0,.15);
  --bg-deep:#1a0606; --bg-mid:#2a0e08;
  --title-from:#ff6600;--title-mid:#ffaa00;--title-to:#ff3300;
}
body.theme-galaxy{
  background:radial-gradient(ellipse at 30% 70%,#1a0a3a 0%,#0d0525 50%,#050210 100%);
  --p1:#e879f9;  --p1-glow:rgba(232,121,249,.4);
  --p1-soft:rgba(232,121,249,.12); --p1-border:rgba(232,121,249,.45);
  --p2:#7c83ff;  --p2-glow:rgba(124,131,255,.4);
  --p2-soft:rgba(124,131,255,.12); --p2-border:rgba(124,131,255,.35);
  --line:rgba(232,121,249,.15);
  --bg-deep:#0d0620; --bg-mid:#1a0f3a;
  --title-from:#a855f7;--title-mid:#e879f9;--title-to:#6366f1;
}
body.theme-amethyst{
  background:radial-gradient(ellipse at 60% 30%,#2d1b4e 0%,#1a0f33 50%,#0d0820 100%);
  --p1:#d896ff;  --p1-glow:rgba(216,150,255,.4);
  --p1-soft:rgba(216,150,255,.12); --p1-border:rgba(216,150,255,.45);
  --p2:#7c9eff;  --p2-glow:rgba(124,158,255,.4);
  --p2-soft:rgba(124,158,255,.12); --p2-border:rgba(124,158,255,.35);
  --line:rgba(216,150,255,.15);
  --bg-deep:#120a2a; --bg-mid:#241548;
  --title-from:#c084fc;--title-mid:#f0abfc;--title-to:#818cf8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang TC','Microsoft JhengHei','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;
  background:radial-gradient(ellipse at center,var(--bg-mid) 0%,var(--bg-deep) 100%);
  color:#fff;min-height:100vh;overflow-x:hidden}

/* 鍵盤焦點 */
:focus-visible{outline:2px solid var(--p1);outline-offset:2px;border-radius:4px}

/* ---------- 星空 ---------- */
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none}
.nebula{position:fixed;border-radius:50%;filter:blur(90px);opacity:.28;z-index:0;pointer-events:none}
.n1{width:550px;height:550px;background:#3a0070;top:-120px;left:-120px;animation:d1 22s ease-in-out infinite alternate}
.n2{width:450px;height:450px;background:#002a5c;bottom:-120px;right:-100px;animation:d2 26s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(120px,60px)}}
@keyframes d2{to{transform:translate(-90px,-70px)}}

/* ---------- 語言切換 ---------- */
.lang-switch{position:fixed;top:calc(14px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));z-index:50;display:flex;gap:3px;
  padding:4px;border-radius:999px;background:rgba(18,18,46,.6);
  border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 18px rgba(0,0,0,.35)}
.lang-btn{min-width:40px;min-height:40px;height:auto;padding:0 9px;border:1px solid transparent;border-radius:999px;
  background:transparent;color:#9aa0c0;font-size:.78rem;cursor:pointer;
  letter-spacing:.5px;transition:all .2s;font-family:inherit;display:flex;align-items:center;justify-content:center}
.lang-btn:hover{color:#fff;background:var(--p1-soft)}
.lang-btn.active{color:#fff;border-color:var(--p1-border);
  background:linear-gradient(135deg,var(--p1-soft),var(--p2-soft));
  box-shadow:0 0 12px var(--p1-glow)}

/* ---------- 視圖切換 ---------- */
.screen{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:24px 16px;min-height:100vh}
.view{display:none;flex-direction:column;align-items:center;width:100%}
.view.active{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- 主選單標題 ---------- */
.hero{display:flex;flex-direction:column;align-items:center;margin-top:10px}
.spark{width:42px;height:42px;animation:sparkPulse 2.5s ease-in-out infinite}
.spark-top{fill:#fff;filter:drop-shadow(0 0 12px rgba(255,255,255,.9));animation-delay:.3s}
.spark-bottom{fill:#fff;filter:drop-shadow(0 0 12px rgba(255,255,255,.9));margin-top:6px;animation-delay:.6s}
@keyframes sparkPulse{0%,100%{transform:scale(1) rotate(0deg);opacity:.85}50%{transform:scale(1.18) rotate(15deg);opacity:1}}
.logo{font-size:3rem;letter-spacing:10px;margin:6px 0;
  background:linear-gradient(to right,var(--title-from),var(--title-to));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 26px var(--p1-glow)) drop-shadow(0 0 12px rgba(255,255,255,.5));}
.tagline{color:#9aa0c0;letter-spacing:5px;margin:10px 0 26px;animation:taglineFade 3s ease-in-out infinite}
@keyframes taglineFade{0%,100%{opacity:.6}50%{opacity:1}}

/* ---------- 遊戲卡片 ---------- */
.card-list{width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px}
.game-card{display:flex;align-items:center;gap:16px;padding:15px 18px;border-radius:15px;cursor:pointer;
  border:1.5px solid var(--line);background:rgba(12,12,40,.6);transition:all .25s;position:relative;overflow:hidden;
  font:inherit;text-align:left;appearance:none;-webkit-appearance:none;width:100%}
.game-card::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,var(--p1-soft),transparent);transition:left .5s}
.game-card:hover::before{left:100%}
.game-card:hover{transform:translateY(-3px);border-color:var(--p1);box-shadow:0 8px 28px var(--p1-glow),0 0 12px var(--p1-soft)}
.game-card:hover .gc-ico{transform:scale(1.08);box-shadow:0 0 16px var(--p1-glow)}
.game-card:hover .gc-arrow{opacity:1;transform:translateX(4px)}
.gc-ico{width:54px;height:54px;border-radius:12px;flex-shrink:0;overflow:hidden;transition:all .25s;
  background:radial-gradient(circle at 50% 42%,var(--p1-soft),rgba(13,13,43,.55));
  border:1px solid var(--line)}
.gc-ico svg{width:100%;height:100%;display:block;padding:4px;color:var(--p1)}
.gc-txt{flex:1}
.gc-name{font-size:1.2rem;font-weight:700;margin-bottom:3px;transition:color .2s;color:#fff}
.game-card:hover .gc-name{color:var(--p1)}
.gc-desc{font-size:.82rem;color:#9aa0c0;letter-spacing:1px}
.gc-arrow{color:var(--p1);font-size:1.3rem;opacity:.7;transition:all .25s}
.gc-elo{font-size:.72rem;color:#ffd700;letter-spacing:.5px;opacity:.85;flex-shrink:0;align-self:flex-start;margin-top:2px}
.foot-hint{color:#9aa0c0;font-size:.85rem;margin:20px 0 6px;letter-spacing:1px}
.version-tag{color:#5a6080;font-size:.72rem;margin:0 0 12px;letter-spacing:2px;opacity:.7}

/* ---------- 頂部返回 / 標題 ---------- */
.top-back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:rgba(18,18,46,.75);border:1px solid var(--line);border-radius:999px;color:#c8d4f0;font-size:.88rem;cursor:pointer;padding:7px 16px;min-height:38px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 16px rgba(0,0,0,.3);transition:all .2s;font-family:inherit;margin-top:env(safe-area-inset-top)}
.top-back:hover{color:#fff;border-color:var(--p1);background:var(--p1-soft);box-shadow:0 0 14px var(--p1-glow);transform:translateY(-1px)}
.top-back:active{transform:translateY(0)}
.game-top .top-back{padding:6px 14px;min-height:36px;font-size:.85rem;margin-top:0}
.gen-head .top-back, .result-box .top-back{padding:5px 12px;min-height:32px;font-size:.82rem;margin:0}
.view-title{font-size:1.6rem;margin:14px 0 26px;letter-spacing:2px;
  background:linear-gradient(135deg,var(--p1),var(--p2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* ---------- 選擇卡片（模式/難度） ---------- */
.select-cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.select-cards.three{gap:16px}
.select-card{width:200px;padding:26px 18px;border-radius:16px;cursor:pointer;text-align:center;
  border:1.5px solid var(--line);background:rgba(12,12,40,.6);transition:all .25s;
  font:inherit;appearance:none;-webkit-appearance:none}
.three .select-card{width:168px;padding:22px 14px}
.select-card:hover{transform:translateY(-4px);border-color:var(--p1);box-shadow:0 10px 32px var(--p1-glow),0 0 14px var(--p1-soft)}
.select-card:hover .sc-ico{transform:scale(1.1);filter:drop-shadow(0 0 8px var(--p1-glow))}
.select-card:hover .sc-name{color:var(--p1)}
.sc-ico{width:64px;height:64px;margin-bottom:12px;transition:all .25s}
.select-card[data-mode="ai"] .sc-ico,
.select-card[data-mode="pvp"] .sc-ico{color:var(--p1)}
.select-card .c-p2{fill:var(--p2)}
.diff-ico{width:48px;height:48px;margin-bottom:10px}
.diff-ico circle,.diff-ico path{stroke:currentColor}
.c-easy{color:var(--p1)} .c-normal{color:var(--gold)} .c-hard{color:var(--p2)}
.sc-name{font-size:1.12rem;font-weight:700;margin-bottom:6px;color:#fff}
.sc-desc{font-size:.78rem;color:#9aa0c0;letter-spacing:.5px}
.diff-dots{display:flex;gap:5px;justify-content:center;margin-top:10px}
.diff-dots i{width:7px;height:7px;border-radius:50%;background:currentColor}
.diff-card[data-diff="easy"]{color:var(--p1)}
.diff-card[data-diff="normal"]{color:var(--gold)}
.diff-card[data-diff="hard"]{color:var(--p2)}
.diff-card[data-diff="master"]{color:#ffd700;border-color:rgba(255,215,0,.4);background:linear-gradient(135deg,rgba(255,215,0,.08),rgba(255,140,0,.05))}
.diff-card[data-diff="master"]:hover{border-color:#ffd700;box-shadow:0 8px 28px rgba(255,215,0,.25),0 0 16px rgba(255,215,0,.15)}
.c-master{color:#ffd700}
.diff-card .sc-name{color:#fff}

/* ---------- 計時模式選擇列 ---------- */
.timer-mode-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  margin-top:22px;padding:10px 16px;border-radius:14px;
  background:rgba(12,12,40,.6);border:1px solid var(--line)}
.tm-label{font-size:.85rem;color:#9aa0c0;letter-spacing:1px;margin-right:4px}
.tm-btn{min-height:38px;padding:7px 16px;border-radius:10px;cursor:pointer;font-size:.85rem;
  color:#9aa0c0;background:transparent;border:1.5px solid var(--line);transition:all .2s;font-family:inherit}
.tm-btn:hover{color:var(--p1);border-color:var(--p1)}
.tm-btn.is-on{color:#fff;border-color:var(--p1);
  background:linear-gradient(135deg,var(--p1-soft),var(--p2-soft));
  box-shadow:0 0 12px var(--p1-glow)}

/* ---------- 遊戲頂欄 ---------- */
.game-top{display:flex;align-items:center;gap:14px;width:100%;max-width:560px;margin-bottom:14px}
.game-h{flex:1;text-align:center;font-size:1.4rem;letter-spacing:3px;
  background:linear-gradient(135deg,var(--p1),var(--p2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.game-h.replay-mode{background-image:linear-gradient(#ffd700,#ffaa00);-webkit-text-fill-color:transparent}
.game-h.replay-mode::after{content:' · 回放中';font-size:.7em;opacity:.8;-webkit-text-fill-color:#ffd700;color:#ffd700}
.mini-btn{min-height:36px;min-width:36px;padding:7px 14px;border-radius:9px;cursor:pointer;font-size:.85rem;color:#9aa0c0;
  background:transparent;border:1.5px solid var(--line);transition:all .2s;position:relative;overflow:hidden;font-family:inherit}
.mini-btn::after{content:'';position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;background:var(--p1-soft);transform:translate(-50%,-50%);transition:width .3s,height .3s}
.mini-btn:hover::after{width:200px;height:200px}
.mini-btn:hover{color:var(--p1);border-color:var(--p1);box-shadow:0 0 12px var(--p1-glow);transform:translateY(-1px)}
.mini-btn:active{transform:translateY(0)}
.gt-btns{display:flex;align-items:center;gap:8px}
.mini-btn.is-disabled,.mini-btn:disabled{opacity:.38;cursor:not-allowed;pointer-events:none}
.mini-btn.is-disabled:hover,.mini-btn:disabled:hover{color:#9aa0c0;border-color:var(--line)}

/* ---------- 回合 / 難度 ---------- */
.turn-pill{display:inline-flex;align-items:center;gap:9px;padding:9px 24px;border-radius:24px;
  border:1.5px solid var(--p1);color:#fff;font-size:1rem;margin-bottom:10px;
  box-shadow:0 0 12px var(--p1-glow)}
.turn-pill.p2-turn{border-color:var(--p2);box-shadow:0 0 12px var(--p2-glow)}
.turn-pill.p2-turn .pill-dot{background:var(--p2);box-shadow:0 0 8px var(--p2-glow)}
.pill-dot{width:12px;height:12px;border-radius:50%;background:var(--p1);box-shadow:0 0 8px var(--p1-glow)}
.diff-badge{font-size:.78rem;padding:4px 14px;border-radius:18px;
  background:var(--p2-soft);color:var(--p2);border:1px solid var(--p2-border);margin-bottom:14px}
/* 局勢評估條 */
.eval-bar{ position:relative; width:100%; max-width:320px; height:22px; margin:0 auto 12px; background:rgba(255,255,255,.06); border-radius:11px; overflow:hidden; border:1px solid var(--line); }
.eval-fill{ position:absolute; top:0; left:50%; width:0; height:100%; background:var(--p1); transition:all .4s ease; transform-origin:left; }
.eval-fill.negative{ left:auto; right:50%; background:var(--p2); }
.eval-label{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:.7rem; font-weight:700; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.8); z-index:1; font-variant-numeric:tabular-nums; }
.arrows{display:flex;gap:10px;margin-bottom:4px}
.arrows i{width:75px;text-align:center;color:var(--p1-border);font-size:.9rem}
.free-x.is-on{color:var(--p1);border-color:var(--p1);box-shadow:0 0 12px var(--p1-glow)}
.free-o.is-on{color:var(--p2);border-color:var(--p2);box-shadow:0 0 12px var(--p2-glow)}
.go-pass{padding:8px 22px;border-radius:10px;cursor:pointer;font-size:.9rem;color:var(--p1);
  background:var(--p1-soft);border:1.5px solid var(--p1-border);transition:all .25s}
.go-pass:hover{background:var(--p1-glow);border-color:var(--p1);box-shadow:0 0 14px var(--p1-glow)}

/* ---------- 棋盤 ---------- */
.board-box{position:relative;padding:18px;border-radius:16px;
  background:linear-gradient(135deg,rgba(28,18,60,.92),rgba(10,10,38,.92));
  border:1px solid var(--line);box-shadow:0 0 50px var(--p1-soft),inset 0 0 30px rgba(0,0,0,.5)}
.board-viewport{position:relative;overflow:hidden;border-radius:8px;max-width:100%;line-height:0;
  touch-action:none;-webkit-user-select:none;user-select:none}
#board{display:block;cursor:pointer;max-width:100%;height:auto;transform-origin:0 0;will-change:transform}
.board-viewport.panning #board{cursor:grabbing}
.zoom-bar{display:flex;align-items:center;justify-content:center;gap:16px;margin:12px 0 4px}
.zoom-btn{width:40px;height:40px;min-width:40px;min-height:40px;border-radius:10px;font-size:1.25rem;line-height:1;cursor:pointer;
  color:var(--p1);background:rgba(28,18,60,.9);border:1px solid var(--line);
  box-shadow:0 0 14px var(--p1-soft);transition:.15s}
.zoom-btn:hover:not(:disabled){border-color:var(--p1);box-shadow:0 0 18px var(--p1-glow)}
.zoom-btn:active:not(:disabled){transform:scale(.93)}
.zoom-btn:disabled{opacity:.35;cursor:not-allowed}
.zoom-val{min-width:62px;text-align:center;font-variant-numeric:tabular-nums;color:var(--p1);letter-spacing:.5px}
.thinking{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;
  background:rgba(0,0,0,.82);padding:14px 28px;border-radius:12px;color:var(--p1);border:1px solid var(--line)}
.thinking.active{display:block}
.thinking span{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}

/* ---------- 計分板 ---------- */
.scoreboard{display:flex;margin-top:18px;border-radius:14px;overflow:hidden;
  border:1px solid var(--line);background:rgba(12,12,40,.7)}
.sb-col{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 30px;font-size:.82rem;color:#9aa0c0}
.sb-col+.sb-col{border-left:1px solid var(--line)}
.sb-col b{font-size:1.3rem;color:#fff}
.sb-dot{width:10px;height:10px;border-radius:50%}
.sb-dot.p1c{background:var(--p1);box-shadow:0 0 8px var(--p1-glow)}
.sb-dot.p2c{background:var(--p2);box-shadow:0 0 8px var(--p2-glow)}

/* ---------- 結果彈窗 ---------- */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);z-index:100;
  justify-content:center;align-items:center}
.overlay.active{display:flex}
.result-box{width:min(320px,92vw);background:linear-gradient(180deg,rgba(20,18,52,.97),rgba(12,12,36,.97));
  padding:30px 26px;border-radius:22px;text-align:center;
  border:1px solid var(--line);box-shadow:0 0 60px var(--p1-soft);animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.result-ico{width:74px;height:74px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--p1) 0%,#fff 50%,var(--p2) 100%);
  box-shadow:0 0 26px var(--p1-glow)}
.result-ico svg{width:36px;height:36px;fill:#fff;transition:fill .3s}
.result-ico svg path{stroke:#000;stroke-width:1.1;stroke-linejoin:round}
.result-ico.sparkle svg{animation:starSparkle 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes starSparkle{0%,100%{transform:scale(1);filter:brightness(.95);opacity:.82}
  50%{transform:scale(1.2);filter:brightness(1.85);opacity:1}}
.result-box h2{font-size:1.6rem;margin-bottom:8px}
.result-sub{font-size:.82rem;color:#9aa0c0;margin-bottom:20px;letter-spacing:1px}
.r-btn{width:100%;padding:13px;border:none;border-radius:12px;cursor:pointer;font-weight:700;font-size:.95rem;margin-bottom:12px;
  background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.r-menu{background:rgba(255,255,255,.06);color:#fff;border:1.5px solid var(--line);margin-bottom:0}
.r-menu:hover{border-color:var(--p1)}

@media(max-width:640px){
  .logo{font-size:2rem;letter-spacing:5px}
  .spark{width:32px;height:32px}
  .select-card{width:150px;padding:20px 12px}
  .three .select-card{width:120px}
  .sb-col{padding:12px 18px}
  .board-box{padding:10px}
  .lang-switch{top:calc(10px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));padding:3px}
  .lang-btn{min-width:36px;min-height:36px;padding:0 6px;font-size:.7rem}
}

/* ================================================================
   井字棋「星之闖關」
   ================================================================ */
.quest-entry{margin-top:30px;text-align:center}
.qe-line{display:flex;align-items:center;gap:12px;color:var(--p1-border);margin-bottom:18px}
.qe-line::before,.qe-line::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--p1-border),transparent)}
.qe-mini{width:108px;height:108px;margin:0 auto 12px;display:grid;grid-template-columns:repeat(3,1fr);
  gap:4px;padding:8px;border-radius:14px;background:rgba(20,16,52,.7);
  border:1px solid var(--line);box-shadow:inset 0 0 18px rgba(0,0,0,.5)}
.qe-mini i{border-radius:6px;background:var(--p1-soft)}
.qe-mini i.x{background:
  linear-gradient(45deg,transparent 46%,var(--p1) 46%,var(--p1) 54%,transparent 54%),
  linear-gradient(-45deg,transparent 46%,var(--p1) 46%,var(--p1) 54%,transparent 54%)}
.qe-mini i.o{border:3px solid var(--p2);background:transparent}
.qe-progress{color:var(--p1);margin-bottom:14px;letter-spacing:1px}
.qe-star{color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,.6)}
.qe-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.qe-btn{padding:12px 26px;border-radius:12px;cursor:pointer;font-weight:700;font-size:.95rem;
  color:#fff;background:rgba(255,255,255,.07);border:1.5px solid var(--line);transition:.18s;font-family:inherit}
.qe-btn:hover{border-color:var(--p1);box-shadow:0 0 18px var(--p1-glow)}
.qe-btn.qe-main{background:linear-gradient(135deg,var(--p1),var(--p2));border:none}
.qe-btn.qe-main:hover{box-shadow:0 0 22px var(--p1-glow)}

/* 選關視圖 */
.q-tabs{display:flex;gap:12px;justify-content:center;margin:14px 0 6px}
.q-tab{padding:10px 26px;border-radius:12px;cursor:pointer;font-weight:700;
  color:var(--p1);background:rgba(255,255,255,.05);border:1.5px solid var(--line);transition:.18s;font-family:inherit}
.q-tab.active{color:#fff;border-color:var(--p1);box-shadow:0 0 18px var(--p1-glow)}
.q-progress-line{text-align:center;color:var(--p1);margin-bottom:14px}
.q-list{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-bottom:30px}
.q-level{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:14px;cursor:pointer;
  background:linear-gradient(135deg,rgba(28,18,60,.9),rgba(12,12,38,.9));
  border:1px solid var(--line);transition:.16s}
.q-level.is-open:hover{border-color:var(--p1);box-shadow:0 0 18px var(--p1-glow);transform:translateX(3px)}
.q-level.is-lock{opacity:.5;cursor:not-allowed}
.ql-no{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#04121a;background:linear-gradient(135deg,var(--p1),var(--p2))}
.is-lock .ql-no{background:rgba(255,255,255,.12);color:var(--p1)}
.ql-body{flex:1;text-align:left}
.ql-title{font-weight:700;color:#eaf2ff;margin-bottom:3px}
.ql-desc{font-size:.76rem;color:#9aa0c0;margin-bottom:3px}
.ql-stars{color:#ffd700;letter-spacing:2px;font-size:.85rem}
.ck-settings{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
.ck-settings label{display:flex;align-items:center;gap:6px;font-size:.82rem;color:#c8d4f0;cursor:pointer;user-select:none}
.ck-settings input[type=checkbox]{width:16px;height:16px;accent-color:var(--p1);cursor:pointer}
.ch-promo{display:flex;gap:10px;align-items:center;justify-content:center}
.ch-promo span{font-size:.85rem;color:#c8d4f0}
.promo-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--p1-border);
  background:rgba(10,14,40,.7);color:#eaf2ff;font-size:1.5rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s}
.promo-btn:hover{border-color:var(--p1);color:var(--p1);transform:scale(1.08)}
.gk-fb{display:flex;align-items:center;gap:6px;font-size:.85rem;color:#c8d4f0;cursor:pointer;user-select:none}
.gk-fb input[type=checkbox]{width:16px;height:16px;accent-color:var(--p1);cursor:pointer}
.sound-toggle{position:fixed;top:calc(16px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));z-index:100;width:40px;height:40px;min-width:40px;min-height:40px;border-radius:50%;
  border:1px solid var(--p1-border);background:rgba(10,14,40,.7);color:#eaf2ff;font-size:1rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0}
.sound-toggle:hover{border-color:var(--p1);color:var(--p1)}
.sound-toggle .ic{width:18px;height:18px;margin:0;display:flex;align-items:center;justify-content:center}
.sound-toggle .ic svg{width:100%;height:100%;display:block}
.hidden{display:none!important}
.q-btn{margin-top:8px;padding:10px 22px;border-radius:12px;cursor:pointer;font-weight:700;font-size:.95rem;
  color:#fff;background:rgba(255,255,255,.07);border:1.5px solid var(--line);transition:all .2s;
  font-family:inherit;appearance:none;-webkit-appearance:none;min-height:44px}
.q-btn:hover{border-color:var(--p1);color:var(--p1);box-shadow:0 0 18px var(--p1-glow);transform:translateY(-1px)}
.q-btn:active{transform:translateY(0)}
.q-btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.timer-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0;font-size:.95rem;font-variant-numeric:tabular-nums}
.timer-p1{color:var(--p1);font-weight:600}
.timer-p2{color:var(--p2);font-weight:600}
.timer-sep{color:rgba(255,255,255,.3)}
.replay-bar{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0;padding:8px 16px;
  background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.25);border-radius:10px}
.replay-bar .mini-btn{color:#ffd700;border-color:rgba(255,215,0,.3)}
.replay-bar .mini-btn:hover{color:#fff;border-color:#ffd700;box-shadow:0 0 10px rgba(255,215,0,.3)}
.replay-pos{font-size:.9rem;color:#ffd700;font-weight:600;font-variant-numeric:tabular-nums;min-width:60px;text-align:center}
.go-size{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.go-size span{color:rgba(255,255,255,.6);font-size:.85rem}
.go-sz{padding:4px 8px;font-size:.8rem;opacity:.6}
.go-sz.is-on{opacity:1;border-color:var(--p1);color:var(--p1)}
.go-handicap{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.go-handicap span{color:rgba(255,255,255,.6);font-size:.85rem}
.go-hc{padding:4px 8px;font-size:.8rem;opacity:.6}
.go-hc.is-on{opacity:1;border-color:var(--p2);color:var(--p2)}
/* F10: 遊戲進行中（已有落子）鎖定局中規則設定 → 明顯變灰、禁止點擊 */
.go-sz:disabled,.go-hc:disabled,.go-sz.locked,.go-hc.locked{
  opacity:.4;cursor:not-allowed;filter:grayscale(1);border-color:var(--line);color:#9aa0c0;pointer-events:none}
.go-sz:disabled:hover,.go-hc:disabled:hover,.go-sz.locked:hover,.go-hc.locked:hover{
  opacity:.4;cursor:not-allowed;border-color:var(--line);color:#9aa0c0;transform:none;box-shadow:none}
#gkForbidden:disabled,#ckMultiJump:disabled,#ckLongJump:disabled{cursor:not-allowed;opacity:.45}
/* 被鎖定 checkbox 所屬 label 一併變灰 */
.gk-fb:has(>#gkForbidden:disabled),.ck-settings label:has(>#ckMultiJump:disabled),
.ck-settings label:has(>#ckLongJump:disabled){opacity:.4;cursor:not-allowed}
/* 通用 .locked 視覺（與 disabled 一致，方便動態標記） */
.locked{opacity:.4!important;cursor:not-allowed!important;filter:grayscale(1);pointer-events:none}
#btnToggleCoords.is-on,#btnCoachVision.is-on,#btnHeatmap.is-on{border-color:var(--p1);color:var(--p1);box-shadow:0 0 10px var(--p1-glow)}
.elo-table{width:100%;border-collapse:collapse;font-size:.85rem;color:#cfd4ee}
.elo-table th,.elo-table td{padding:5px 8px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08)}
.elo-table th{color:rgba(255,255,255,.6);font-weight:500}
.rec-notes{font-size:.8rem;color:#9aa0c0;margin-top:2px;font-style:italic;word-break:break-word}
.elo-fb{margin:2px;padding:3px 8px;font-size:.75rem;opacity:.6}
.elo-fb.is-on{opacity:1;border-color:var(--p1);color:var(--p1)}
.replay-spd{padding:3px 8px;font-size:.75rem;opacity:.6}
.replay-spd.is-on{opacity:1;border-color:var(--p1);color:var(--p1)}
.sc-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sc-row{display:flex;align-items:center;gap:12px;font-size:.88rem;color:#cfd4ee}
.sc-row kbd{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-bottom-width:2px;
  border-radius:6px;padding:2px 8px;font-family:monospace;font-size:.82rem;color:#fff;min-width:78px;text-align:center}
.menu-actions{display:flex;justify-content:center;gap:10px;margin:10px 0}
.ach-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:linear-gradient(135deg,rgba(20,25,60,.95),rgba(40,20,70,.95));
  border:1px solid #ffd700;border-radius:14px;padding:12px 22px;display:flex;align-items:center;gap:12px;
  z-index:9999;transition:transform .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 30px rgba(255,215,0,.3)}
.ach-toast.show{transform:translateX(-50%) translateY(0)}
.ach-toast .ach-icon{font-size:1.8rem}
.ach-toast .ach-text{color:#ffd700;font-weight:600;font-size:1rem}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:8px}
.ach-card{background:rgba(15,20,50,.6);border:1px solid rgba(255,255,255,.1);border-radius:12px;
  padding:14px 10px;text-align:center;position:relative;opacity:.55;transition:all .3s}
.ach-card.got{opacity:1;border-color:#ffd700;box-shadow:0 0 15px rgba(255,215,0,.2)}
.ach-big{font-size:2.2rem;margin-bottom:6px}
.ach-name{color:#fff;font-weight:600;font-size:.9rem;margin-bottom:4px}
.ach-desc{color:rgba(255,255,255,.5);font-size:.75rem;line-height:1.3}
.ach-date{color:#ffd700;font-size:.7rem;margin-top:6px}
.ach-lock{position:absolute;top:8px;right:8px;font-size:.9rem;opacity:.6}
.rec-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;max-height:60vh;overflow-y:auto}
.rec-item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;
  background:rgba(15,20,50,.5);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 14px}
.rec-item.starred{border-color:var(--p1);box-shadow:0 0 12px var(--p1-soft)}
.rec-star{grid-row:1/span 3;display:flex;align-items:center}
.rec-game{color:#fff;font-weight:600;font-size:1rem;grid-column:2}
.rec-meta{color:rgba(255,255,255,.5);font-size:.8rem;grid-column:2}
.rec-date{color:rgba(255,255,255,.35);font-size:.75rem;grid-column:2}
.rec-notes{grid-column:2;color:rgba(255,255,255,.45);font-size:.78rem}
.rec-result{font-weight:700;font-size:.9rem;align-self:center;grid-column:3;grid-row:1/span 3}
.rec-win{color:var(--p1)}
.rec-lose{color:var(--p2)}
.rec-draw{color:#ffd700}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:8px}
.stat-card{background:rgba(15,20,50,.6);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:14px 8px;text-align:center}
.stat-num{font-size:1.6rem;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.stat-lbl{color:rgba(255,255,255,.5);font-size:.75rem;margin-top:4px}
.stat-win .stat-num{color:var(--p1)}
.stat-lose .stat-num{color:var(--p2)}
.stat-draw .stat-num{color:#ffd700}
.stat-elo .stat-num{color:#ffd700;font-size:1.8rem;text-shadow:0 0 12px rgba(255,215,0,.4)}
.stat-ach .stat-num{color:#ffd700}
.stat-pergame{margin-top:8px}
.pg-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.pg-name{width:70px;color:rgba(255,255,255,.8);font-size:.85rem;flex-shrink:0}
.pg-bar{flex:1;height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
.pg-fill{display:block;height:100%;background:linear-gradient(90deg,var(--p1),var(--p2));border-radius:4px;transition:width .5s}
.pg-pct{width:45px;text-align:right;color:rgba(255,255,255,.6);font-size:.8rem;font-variant-numeric:tabular-nums}

/* 安全區域適配（劉海屏） */
body{ padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }

/* ---------- 全域滾動條 ---------- */
::-webkit-scrollbar{ width:6px; height:6px; }
::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.2); border-radius:3px; }
::-webkit-scrollbar-track{ background:transparent; }

/* SVG 圖標 */
.ic{ display:inline-flex; align-items:center; justify-content:center; width:1.15em; height:1.15em; vertical-align:middle; margin-right:.3em; }
.ic svg{ width:100%; height:100%; display:block; }
.ic-gold{ color:#ffd700; }
.sound-toggle .ic{ width:18px; height:18px; margin-right:0; color:#fff; }
.ach-icon{ display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; }
.ach-icon .ic{ width:100%; height:100%; margin-right:0; }
.ach-big{ display:flex; align-items:center; justify-content:center; width:40px; height:40px; margin:0 auto 6px; color:#ffd700; }
.ach-big .ic{ width:100%; height:100%; margin-right:0; }
.ach-lock{ display:flex; align-items:center; justify-content:center; width:18px; height:18px; color:rgba(255,255,255,.4); }
.ach-lock .ic{ width:100%; height:100%; margin-right:0; }
.ql-no .ic{ width:100%; height:100%; margin-right:0; color:rgba(255,255,255,.3); }

/* 對局分析 */
.analysis-box{ text-align:left; }
.analysis-summary{ font-size:15px; color:var(--p1); margin-bottom:8px; padding:8px 12px; background:var(--p1-soft); border-radius:8px; border-left:3px solid var(--p1); }
.analysis-list{ display:flex; flex-direction:column; gap:6px; }
.analysis-item{ display:flex; align-items:center; gap:10px; padding:6px 10px; border-radius:6px; font-size:13px; }
.analysis-item.mistake{ background:rgba(255,107,107,.1); border-left:3px solid #ff6b6b; }
.analysis-item.best{ background:var(--p1-soft); border-left:3px solid var(--p1); }
.an-step{ font-weight:bold; color:#fff; min-width:40px; }
.an-desc{ color:rgba(255,255,255,.7); }

/* 規則說明 */
.rule-btn{ display:inline-flex; align-items:center; gap:6px; margin:16px auto 0; padding:8px 20px; background:var(--p1-soft); border:1px solid var(--p1-border); border-radius:20px; color:var(--p1); font-size:14px; cursor:pointer; transition:all .2s; }
.rule-btn:hover{ background:var(--p1-glow); border-color:var(--p1); }
.rule-btn .ic{ width:16px; height:16px; }
.rule-box{ max-width:480px; }
.rule-content{ text-align:left; font-size:14px; line-height:1.8; color:rgba(255,255,255,.85); margin:12px 0 20px; padding:12px 16px; background:rgba(255,255,255,.04); border-radius:10px; max-height:50vh; overflow-y:auto; }

/* 觀戰模式 */
.select-card[data-mode="spectate"] .sc-ico circle{ fill:#ffd700; }

/* 走子歷史面板 */
.history-panel{ margin-top:10px; border:1px solid var(--line); border-radius:12px; background:rgba(12,12,40,.5); overflow:hidden; max-width:560px; margin-left:auto; margin-right:auto; backdrop-filter:blur(8px); }
.history-header{ display:flex; align-items:center; gap:8px; padding:10px 16px; cursor:pointer; user-select:none; transition:background .2s; position:relative; }
.history-header::after{ content:''; position:absolute; bottom:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,var(--p1-border),transparent); }
.history-header:hover{ background:var(--p1-soft); }
.history-header .ic{ width:16px; height:16px; color:var(--p1); flex-shrink:0; }
.history-header span:nth-child(2){ flex:1; font-size:.9rem; color:#fff; font-weight:500; }
.history-count{ font-size:.75rem; color:#9aa0c0; background:rgba(255,255,255,.08); padding:2px 10px; border-radius:10px; font-weight:600; min-width:28px; text-align:center; }
.history-list{ display:none; max-height:220px; overflow-y:auto; padding:4px 8px 8px; }
.history-panel.open .history-list{ display:block; }
.h-move{ display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:8px; cursor:pointer; transition:all .15s; font-size:.85rem; border-left:2px solid transparent; }
.h-move:nth-child(even){ background:rgba(255,255,255,.02); }
.h-move:hover{ background:var(--p1-soft); transform:translateX(2px); }
.h-move.current{ background:var(--p1-glow); border-left-color:var(--p1); }
.h-step{ color:#6b7090; min-width:32px; font-size:.75rem; font-weight:600; font-variant-numeric:tabular-nums; }
.h-player{ font-size:.8rem; flex-shrink:0; }
.p1mv .h-player{ color:var(--p1); }
.p2mv .h-player{ color:var(--p2); }
.h-note{ color:#e0e4f0; font-family:'SF Mono','Consolas','Monaco',monospace; font-size:.8rem; flex:1; }

/* 主題選擇視圖 */
.theme-hint{ text-align:center; color:#9aa0c0; font-size:.9rem; margin:8px 0 20px; }
.theme-grid{ display:flex; flex-wrap:wrap; gap:16px; justify-content:center; max-width:600px; margin:0 auto; }
.theme-card{ position:relative; width:160px; padding:10px; border-radius:14px; border:1.5px solid var(--line); background:rgba(12,12,40,.5); cursor:pointer; transition:all .2s; }
.theme-card:hover{ transform:translateY(-3px); border-color:var(--p1); box-shadow:0 8px 24px var(--p1-glow); }
.theme-card.active{ border-color:#ffd700; box-shadow:0 0 16px rgba(255,215,0,.3); }
.theme-card.previewing{ border-color:var(--p1); box-shadow:0 0 16px var(--p1-glow); animation:themePulse 1.5s ease-in-out infinite; }
@keyframes themePulse{ 0%,100%{box-shadow:0 0 12px var(--p1-glow)} 50%{box-shadow:0 0 24px var(--p1)} }
.theme-preview{ width:100%; height:100px; border-radius:10px; overflow:hidden; position:relative; margin-bottom:8px; }
.tp-title{ position:absolute; top:12px; left:50%; transform:translateX(-50%); font-size:1rem; font-weight:700; letter-spacing:3px; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; white-space:nowrap; }
.tp-board{ position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:grid; grid-template-columns:repeat(2,1fr); gap:3px; width:50px; height:50px; }
.tp-cell{ border-radius:3px; background:rgba(255,255,255,.1); }
.theme-name{ text-align:center; font-size:.85rem; color:#fff; }
.theme-check{ position:absolute; top:6px; right:8px; width:22px; height:22px; border-radius:50%; background:#ffd700; color:#000; font-size:.8rem; display:flex; align-items:center; justify-content:center; font-weight:bold; }
.theme-check.preview-tag{ width:auto; padding:2px 8px; border-radius:10px; background:var(--p1); color:#000; font-size:.7rem; }

/* 走子質量標註 */
.q-sym{ font-weight:bold; margin-left:6px; font-size:.85rem; }
.q-excellent{ color:var(--p1); text-shadow:0 0 8px var(--p1-glow); }
.q-good{ color:#66bb6a; }
.q-mistake{ color:#ffa726; }
.q-blunder{ color:#ef5350; text-shadow:0 0 8px rgba(239,83,80,.6); }
.h-move.has-q{ padding-right:28px; }

/* ===== 通用彈窗 ===== */
.gen-box{ width:min(560px,94vw); max-height:86vh; display:flex; flex-direction:column; padding:22px 22px 20px; text-align:left; }
.gen-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
.gen-head h2{ font-size:1.15rem; margin:0; color:#fff; flex:1; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gen-head .top-back, .result-box .top-back{ margin:0; padding:4px 8px; font-size:.88rem; flex-shrink:0; white-space:nowrap; }
.gen-foot{ display:flex; justify-content:center; margin-top:14px; flex-shrink:0; }
.gen-foot .r-btn{ max-width:240px; margin:0; }
.gen-close{ flex:none; width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
  background:rgba(255,255,255,.06); color:#c8d4f0; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .18s; }
.gen-close:hover{ background:var(--p1-soft); color:#fff; border-color:var(--p1); }
.gen-close svg{ width:18px; height:18px; }
.gen-body{ flex:1; min-height:0; overflow-y:auto; color:#eaf2ff; font-size:.9rem; line-height:1.6; padding-right:4px; }
.gen-body h4{ color:#fff; font-size:.95rem; margin:12px 0 6px; }
.gen-body p{ color:rgba(234,242,255,.85); }
.gen-body::-webkit-scrollbar{ width:8px; }
.gen-body::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.18); border-radius:4px; }
/* 新手引導浮層 */
.hint-dot{ position:fixed; z-index:200; width:18px; height:18px; border-radius:50%;
  background:radial-gradient(circle,#fff,var(--p1)); box-shadow:0 0 14px var(--p1);
  animation:hintPulse 1.4s ease-in-out infinite; pointer-events:none; }
@keyframes hintPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.5);opacity:.5}}
.guide-bubble{ position:fixed; z-index:201; max-width:260px; background:linear-gradient(180deg,rgba(20,18,52,.98),rgba(12,12,36,.98));
  border:1px solid var(--p1-border); border-radius:14px; padding:12px 14px; color:#eaf2ff; font-size:.85rem;
  box-shadow:0 8px 30px rgba(0,0,0,.5); animation:pop .3s ease-out; }
.guide-bubble .gb-title{ font-weight:700; color:var(--p1); margin-bottom:4px; }
.guide-bubble .gb-actions{ display:flex; gap:8px; margin-top:10px; }
.guide-bubble .gb-actions button{ flex:1; padding:7px; border:none; border-radius:8px; cursor:pointer; font-size:.8rem; font-weight:700; }
.gb-skip{ background:rgba(255,255,255,.08); color:#c8d4f0; }
.gb-next{ background:linear-gradient(135deg,var(--p1),var(--p2)); color:#fff; }
/* ELO 圖表 */
.elo-chart-wrap{ width:100%; background:rgba(10,14,40,.5); border:1px solid var(--line); border-radius:12px; padding:10px; margin:8px 0; }
.elo-empty{ text-align:center; color:#9aa0c0; padding:24px 0; }
/* 對局標籤/收藏 */
.rec-item.starred{ border-color:var(--p1); box-shadow:0 0 12px var(--p1-soft); }
.rec-fav{ cursor:pointer; color:#666; font-size:1rem; margin-left:6px; }
.rec-fav.on{ color:#ffd700; text-shadow:0 0 8px rgba(255,215,0,.6); }

/* ===== G1: 計時器倒數環 ===== */
.timer-ring{ position:relative; width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; }
.timer-ring svg{ position:absolute; inset:0; width:34px; height:34px; transform:rotate(-90deg); }
.timer-ring .ring-bg{ fill:none; stroke:rgba(255,255,255,.12); stroke-width:3; }
.timer-ring .ring-fg{ fill:none; stroke:#4caf50; stroke-width:3; stroke-linecap:round; transition:stroke-dashoffset .4s linear, stroke .3s; }
.timer-ring.timer-ring-yellow .ring-fg{ stroke:#ffd700; }
.timer-ring.timer-ring-red .ring-fg{ stroke:#f44336; animation:timer-pulse 1s ease-in-out infinite; }
.timer-bar.no-ring .timer-ring{ display:none; }
@keyframes timer-pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(244,67,54,.55); } 50%{ box-shadow:0 0 0 6px rgba(244,67,54,0); } }
.timer-bar{ position:relative; }

/* ===== G5: ELO 預估 ===== */
.elo-predict{ margin-top:6px; font-size:.72rem; color:#9aa0c0; font-variant-numeric:tabular-nums; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
.elo-predict .ew{ color:#4caf50; } .elo-predict .ed{ color:#9aa0c0; } .elo-predict .el{ color:#f44336; }

/* ===== G3: 每日挑戰 ===== */
.daily-badge{ display:inline-block; margin-left:6px; font-size:.7rem; padding:1px 7px; border-radius:9px; background:linear-gradient(135deg,#ffd700,#ff9800); color:#221a00; font-weight:700; }

/* ===== G4: 走子講解按鈕 ===== */
.h-move .explain-btn{ margin-left:4px; cursor:pointer; border:none; background:rgba(255,255,255,.08); color:#c8d4f0; border-radius:6px; font-size:.7rem; padding:0 5px; line-height:1.4; }
.h-move .explain-btn:hover{ background:var(--p1); color:#fff; }
.explain-row{ display:flex; justify-content:space-between; gap:10px; padding:3px 0; border-bottom:1px dashed rgba(255,255,255,.1); }
.explain-tags{ margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
.explain-tag{ font-size:.72rem; padding:2px 8px; border-radius:8px; background:rgba(77,208,225,.15); color:#4dd0e1; }

/* ===== G7: 謎題分組 ===== */
.pz-group{ margin:6px 0; }
.pz-group-title{ font-size:.78rem; font-weight:700; color:#ffd700; margin:6px 0 2px; }
.puzzle-item.solved{ opacity:.6; }
.puzzle-item.solved::after{ content:' ✓'; }

/* ===== G6: 無障礙 ===== */
.mini-btn:focus-visible,.q-btn:focus-visible,.select-card:focus-visible,.game-card:focus-visible,.tm-btn:focus-visible,.gb-actions button:focus-visible{ outline:2px solid #ffd700; outline-offset:2px; }
@media (prefers-reduced-motion: reduce){
  *{ animation:none !important; transition:none !important; }
  .stars,.star{ animation:none !important; }
}
/* F1/F4: 自訂列與開關 */
.custom-row{margin:8px auto;max-width:420px;padding:10px 14px;border:1px solid #2a2a55;border-radius:12px;background:rgba(20,20,50,.5);}
.custom-row.hidden{display:none;}
.toggle-line{display:flex;flex-direction:column;gap:2px;cursor:pointer;}
.toggle-desc{font-size:.72rem;color:#9aa0c0;}
.custom-row-hint{font-size:.85rem;margin-bottom:6px;color:#cfd2ff;}
.custom-row-ctrl{display:flex;align-items:center;gap:8px;font-size:.8rem;margin:4px 0;}
.custom-row-ctrl input[type=range]{accent-color:#e040fb;}

/* ===== U1-U12: 新增 UI 樣式 ===== */
.set-seg{padding:4px 10px;font-size:.78rem;opacity:.6;}
.set-seg.is-on{opacity:1;border-color:var(--p1,#4dd0e1);color:var(--p1,#4dd0e1);}
.replay-commentary{min-height:38px;padding:6px 12px;background:rgba(10,10,36,.85);border-top:1px solid rgba(77,208,225,.2);font-size:.85rem;}
.replay-commentary.hidden{display:none;}
.theme-card-create{transition:transform .15s ease;}
.theme-card-create:hover{transform:scale(1.03);}
.ct-color{padding:2px;border:1px solid rgba(255,255,255,.2);border-radius:6px;background:transparent;}

/* ==================== V2: 動畫與特效增強 ==================== */

/* 流星 */
.meteor{position:fixed;width:2px;height:2px;background:#fff;border-radius:50%;z-index:1;pointer-events:none;opacity:0;}
.meteor::before{content:'';position:absolute;top:0;left:0;width:80px;height:1px;background:linear-gradient(90deg,#fff,transparent);transform:translateX(-80px) rotate(-45deg);transform-origin:right;}
@keyframes meteorFall{0%{opacity:0;transform:translate(0,0) rotate(-45deg)}10%{opacity:1}100%{opacity:0;transform:translate(-400px,400px) rotate(-45deg)}}

/* 頁面切換動畫增強 */
.view.active{animation:slideIn .35s cubic-bezier(.16,1,.3,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(30px) scale(.98)}to{opacity:1;transform:none}}
.view.leaving{animation:slideOut .25s ease forwards}
@keyframes slideOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-30px) scale(.98)}}

/* 卡片交錯入場 */
.stagger-item{opacity:0;animation:staggerIn .5s cubic-bezier(.16,1,.3,1) forwards}
@keyframes staggerIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}

/* 落子粒子特效 */
.particle{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:10;}
@keyframes particleBurst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--px),var(--py)) scale(0)}}

/* 落子光環 */
.drop-ripple{position:absolute;border-radius:50%;pointer-events:none;z-index:5;border:2px solid var(--p1);}
@keyframes dropRipple{0%{opacity:.8;transform:scale(.3)}100%{opacity:0;transform:scale(2.5)}}

/* 勝利畫面增強 */
.result-box.win{animation:winPop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes winPop{0%{transform:scale(.5) rotate(-5deg);opacity:0}60%{transform:scale(1.05) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.result-ico.win-glow{animation:winGlow 2s ease-in-out infinite}
@keyframes winGlow{0%,100%{box-shadow:0 0 26px var(--p1-glow),0 0 50px var(--p1-glow)}50%{box-shadow:0 0 40px var(--p1),0 0 80px var(--p1-glow)}}

/* 彩帶粒子 */
.confetti{position:fixed;width:8px;height:8px;pointer-events:none;z-index:200;}
@keyframes confettiFall{0%{opacity:1;transform:translateY(-20px) rotate(0deg)}100%{opacity:0;transform:translateY(100vh) rotate(720deg)}}

/* 數字滾動動畫 */
.num-animate{display:inline-block;animation:numPop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes numPop{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}

/* 按鈕按下效果 */
.btn-press:active{transform:scale(.95)!important;}

/* 發光脈動 */
.glow-pulse{animation:glowPulse 2s ease-in-out infinite}
@keyframes glowPulse{0%,100%{box-shadow:0 0 12px var(--p1-glow)}50%{box-shadow:0 0 24px var(--p1),0 0 40px var(--p1-glow)}}

/* 浮動效果 */
.float-anim{animation:floatAnim 3s ease-in-out infinite}
@keyframes floatAnim{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* 閃爍星星（背景增強） */
.twinkle{animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

/* 漸變邊框流動 */
.gradient-border{position:relative;background:linear-gradient(var(--bg-mid),var(--bg-deep)) padding-box;border:2px solid transparent;}
.gradient-border::before{content:'';position:absolute;inset:-2px;border-radius:inherit;background:linear-gradient(135deg,var(--p1),var(--p2),var(--p1)) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:borderFlow 3s linear infinite;background-size:200% 200%;}
@keyframes borderFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* 卡片 3D 傾斜懸停 */
.tilt-card{transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s;transform-style:preserve-3d;}
.tilt-card:hover{transform:perspective(800px) rotateX(3deg) rotateY(-3deg) translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,.4),0 0 30px var(--p1-glow);}

/* 掃光動畫增強 */
.sweep-light{position:relative;overflow:hidden;}
.sweep-light::after{content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);transform:skewX(-20deg);animation:sweepLight 3s ease-in-out infinite;}
@keyframes sweepLight{0%{left:-100%}50%,100%{left:200%}}

/* 震動效果（錯誤提示） */
.shake{animation:shake .4s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* 進度條流動 */
.progress-flow{background:linear-gradient(90deg,var(--p1),var(--p2),var(--p1));background-size:200% 100%;animation:progressFlow 2s linear infinite;}
@keyframes progressFlow{0%{background-position:0% 0}100%{background-position:200% 0}}

/* 棋盤光暈 */
.board-glow{box-shadow:0 0 40px var(--p1-soft),0 0 80px var(--p1-soft),inset 0 0 30px rgba(0,0,0,.3);}

/* 棋子懸停預覽 */
.hover-preview{opacity:.4;animation:hoverPreview 1s ease-in-out infinite;}
@keyframes hoverPreview{0%,100%{opacity:.3}50%{opacity:.6}}

/* 思考動畫增強 */
.thinking-dots span{display:inline-block;animation:thinkingBounce 1.4s ease-in-out infinite;}
.thinking-dots span:nth-child(2){animation-delay:.2s}
.thinking-dots span:nth-child(3){animation-delay:.4s}
@keyframes thinkingBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}

/* Toast 滑入 */
.toast-slide{animation:toastSlide .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes toastSlide{from{opacity:0;transform:translateY(-30px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}

/* 彈窗背景淡入 */
.overlay.active{animation:overlayFade .3s ease;}
@keyframes overlayFade{from{opacity:0}to{opacity:1}}

/* 滾動條美化 */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:4px;}
::-webkit-scrollbar-thumb{background:linear-gradient(135deg,var(--p1),var(--p2));border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(135deg,var(--p2),var(--p1));}

/* 選取文字顏色 */
::selection{background:var(--p1);color:#000;}

/* ==================== V2: UI 改善 ==================== */

/* 卡片設計優化 */
.game-card{border-radius:16px;background:linear-gradient(135deg,rgba(18,18,50,.8),rgba(10,10,35,.9));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.game-card:hover{box-shadow:0 12px 40px rgba(0,0,0,.4),0 0 24px var(--p1-glow),inset 0 1px 0 rgba(255,255,255,.1);}

.select-card{border-radius:18px;background:linear-gradient(135deg,rgba(18,18,50,.8),rgba(10,10,35,.9));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.select-card:hover{box-shadow:0 12px 40px rgba(0,0,0,.4),0 0 24px var(--p1-glow);}

/* 按鈕設計優化 */
.q-btn{border-radius:12px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.04));border:1.5px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .25s cubic-bezier(.16,1,.3,1);}
.q-btn:hover{border-color:var(--p1);box-shadow:0 6px 20px var(--p1-glow),inset 0 1px 0 rgba(255,255,255,.1);transform:translateY(-2px);}
.q-btn:active{transform:translateY(0) scale(.98);}

.mini-btn{border-radius:10px;background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.03));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}

/* 主按鈕漸變 */
.q-btn.qe-main,.r-btn{background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 4px 20px var(--p1-glow);position:relative;overflow:hidden;}
.q-btn.qe-main::before,.r-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);transition:left .5s;}
.q-btn.qe-main:hover::before,.r-btn:hover::before{left:100%;}

/* 遊戲頂欄優化 */
.game-top{background:linear-gradient(135deg,rgba(18,18,50,.6),rgba(10,10,35,.7));border-radius:16px;padding:12px 16px;border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}

/* 計分板優化 */
.scoreboard{border-radius:16px;background:linear-gradient(135deg,rgba(18,18,50,.6),rgba(10,10,35,.7));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 4px 20px rgba(0,0,0,.3);}

/* 回合提示優化 */
.turn-pill{background:linear-gradient(135deg,rgba(18,18,50,.8),rgba(10,10,35,.9));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}

/* 棋盤容器優化 */
.board-box{border-radius:20px;background:linear-gradient(135deg,rgba(18,18,50,.5),rgba(10,10,35,.7));border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 40px rgba(0,0,0,.4),0 0 30px var(--p1-soft);}

/* 走子歷史面板優化 */
.history-panel{border-radius:16px;background:linear-gradient(135deg,rgba(18,18,50,.6),rgba(10,10,35,.7));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}

/* 彈窗優化 */
.result-box{background:linear-gradient(180deg,rgba(25,22,65,.98),rgba(15,15,45,.98));border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 60px var(--p1-soft);}

/* 語言切換優化 */
.lang-switch{background:linear-gradient(135deg,rgba(18,18,50,.7),rgba(10,10,35,.8));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}

/* 音量按鈕優化 */
.sound-toggle{background:linear-gradient(135deg,rgba(18,18,50,.7),rgba(10,10,35,.8));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}

/* 標題優化 */
.view-title{text-shadow:0 0 30px var(--p1-glow);}
.logo{filter:drop-shadow(0 0 26px var(--p1-glow)) drop-shadow(0 0 50px rgba(255,255,255,.3));}

/* 難度卡片優化 */
.diff-card{border-radius:16px;background:linear-gradient(135deg,rgba(18,18,50,.8),rgba(10,10,35,.9));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.diff-card:hover{box-shadow:0 12px 40px rgba(0,0,0,.4),0 0 24px var(--p1-glow);}

/* 計時模式行優化 */
.timer-mode-row{border-radius:16px;background:linear-gradient(135deg,rgba(18,18,50,.6),rgba(10,10,35,.7));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}

/* 關卡卡片優化 */
.q-level{border-radius:14px;background:linear-gradient(135deg,rgba(28,18,60,.9),rgba(12,12,38,.9));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}

/* 主題卡片優化 */
.theme-card{border-radius:16px;background:linear-gradient(135deg,rgba(18,18,50,.7),rgba(10,10,35,.8));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}

/* 成就卡片優化 */
.ach-card{border-radius:14px;background:linear-gradient(135deg,rgba(18,18,50,.7),rgba(10,10,35,.8));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}

/* 統計卡片優化 */
.stat-card{border-radius:14px;background:linear-gradient(135deg,rgba(18,18,50,.7),rgba(10,10,35,.8));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}

/* 對局記錄優化 */
.rec-item{border-radius:12px;background:linear-gradient(135deg,rgba(18,18,50,.5),rgba(10,10,35,.6));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}

/* 引導氣泡優化 */
.guide-bubble{border-radius:16px;background:linear-gradient(135deg,rgba(25,22,65,.98),rgba(15,15,45,.98));border:1px solid var(--p1-border);box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 30px var(--p1-glow);}

/* 殘局/題目卡片優化 */
.puzzle-item{border-radius:12px;background:linear-gradient(135deg,rgba(18,18,50,.6),rgba(10,10,35,.7));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .2s;}
.puzzle-item:hover{border-color:var(--p1);box-shadow:0 6px 20px var(--p1-glow);transform:translateX(4px);}

/* 自定義行優化 */
.custom-row{border-radius:14px;background:linear-gradient(135deg,rgba(20,20,50,.7),rgba(10,10,35,.8));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);}

/* 分析面板優化 */
.analysis-summary{border-radius:12px;background:linear-gradient(135deg,rgba(18,18,50,.7),rgba(10,10,35,.8));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}

/* 通用彈窗優化 */
.modal-box{border-radius:20px;background:linear-gradient(180deg,rgba(25,22,65,.98),rgba(15,15,45,.98));border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.5);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}

/* 移动端優化 */
@media(max-width:640px){
  .game-card{padding:12px 14px;}
  .gc-ico{width:44px;height:44px;}
  .gc-name{font-size:1.05rem;}
  .board-box{padding:8px;}
  .game-top{padding:10px 12px;}
  .scoreboard{border-radius:14px;}
  .sb-col{padding:10px 16px;}
}

/* 橫屏優化 */
@media(orientation:landscape) and (max-height:500px){
  .game-top{padding:8px 12px;margin-bottom:8px;}
  .board-box{padding:6px;}
  .scoreboard{margin-top:10px;}
  .sb-col{padding:8px 20px;}
}

/* ==================== V3: 小幅排版微調（保留原風格） ==================== */

/* 主選單按鈕組：保持原橫向排列，微調間距 */
.menu-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:28px;max-width:520px;}
.menu-actions .q-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;font-size:.85rem;min-height:40px;}
.menu-actions .q-btn .ic{width:16px;height:16px;}
.menu-actions .q-btn .ic svg{width:100%;height:100%;}
.daily-badge{margin-left:4px;background:#ff4757;color:#fff;font-size:.65rem;padding:1px 6px;border-radius:10px;font-weight:700;}

/* 遊戲卡片：微調圓角和內距 */
.game-card{border-radius:16px;padding:14px 18px;}
.gc-ico{border-radius:12px;}

/* 遊戲頂欄：保持原結構，微調對齊 */
.game-top{display:flex;align-items:center;gap:10px;padding:12px 16px;margin-bottom:14px;width:100%;max-width:600px;}
.top-back{padding:8px 10px;font-size:.9rem;}
.game-h{flex:1;text-align:center;font-size:1.25rem;letter-spacing:2px;}
.gt-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.gt-btns .mini-btn{padding:6px 10px;font-size:.78rem;}

/* 計分板：微調 */
.scoreboard{max-width:420px;border-radius:16px;}
.sb-col{padding:14px 18px;}
.sb-col b{font-size:1.4rem;font-variant-numeric:tabular-nums;}

/* 走子歷史：微調 */
.history-panel{max-width:560px;border-radius:14px;}
.history-header{padding:10px 16px;}
.history-count{margin-left:auto;background:var(--p1-soft);color:var(--p1);padding:2px 10px;border-radius:10px;font-size:.75rem;font-weight:700;}

/* 彈窗：微調圓角 */
.result-box{border-radius:20px;}
.r-btn{border-radius:12px;}

/* 修復未定義的 .primary-btn 樣式 */
.primary-btn{
  padding:11px 20px;border:none;border-radius:12px;cursor:pointer;font-weight:700;font-size:.92rem;
  color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));
  box-shadow:0 4px 18px var(--p1-glow);transition:all .22s cubic-bezier(.16,1,.3,1);
  font-family:inherit;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.primary-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--p1-glow);}
.primary-btn:active{transform:translateY(0) scale(.98);}

/* ==================== V5.0: 星海榮耀資訊欄 & 分類標籤 & 折疊工具匣 ==================== */
.hero-rank-bar{
  width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 12px;
  padding:11px 16px;margin:0 0 14px;border-radius:16px;
  background:linear-gradient(135deg,rgba(20,24,62,.82),rgba(12,14,40,.9));
  border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 6px 24px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.08);
}
.hrb-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 170px;}
.hrb-badge{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--p1-soft),var(--p2-soft));border:1px solid var(--p1-border);
  color:#ffd700;box-shadow:0 0 14px var(--p1-soft);
}
.hrb-badge svg{width:20px;height:20px;}
.hrb-info{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
.hrb-title{font-size:.92rem;font-weight:700;color:#fff;display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;}
.hrb-elo{font-size:.76rem;color:#ffd700;font-weight:700;padding:1px 7px;border-radius:999px;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.3);white-space:nowrap;flex-shrink:0;}
.hrb-sub{font-size:.73rem;color:#9aa0c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hrb-right{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto;}
body.hide-elo .hrb-elo,
body.hide-elo .gc-elo,
body.hide-elo .elo-predict,
body.hide-elo .elo-only,
body.hide-elo .stat-elo{display:none!important;}
.hrb-pill{
  padding:5px 11px;border-radius:999px;font-size:.75rem;font-weight:700;color:var(--p1);
  background:var(--p1-soft);border:1px solid var(--p1-border);cursor:pointer;transition:all .2s;
  display:inline-flex;align-items:center;gap:5px;min-height:32px;
}
.hrb-pill:hover{background:var(--p1-glow);color:#fff;transform:translateY(-1px);}

/* 主選單分類篩選膠囊 */
.menu-cat-tabs{
  width:100%;max-width:480px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
  margin:0 0 14px;padding:4px;border-radius:14px;background:rgba(12,14,42,.55);border:1px solid var(--line);
}
.cat-tab{
  flex:1;min-width:68px;min-height:34px;padding:6px 10px;border-radius:10px;border:1px solid transparent;
  background:transparent;color:#9aa0c0;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;
  font-family:inherit;white-space:nowrap;
}
.cat-tab:hover{color:#fff;background:var(--p1-soft);}
.cat-tab.active{
  color:#fff;border-color:var(--p1-border);
  background:linear-gradient(135deg,var(--p1-soft),var(--p2-soft));
  box-shadow:0 0 12px var(--p1-soft);
}
.game-card.cat-hidden{display:none!important;}
.gc-badge{
  display:inline-block;font-size:.64rem;font-weight:700;padding:1px 6px;border-radius:6px;
  margin-left:6px;vertical-align:middle;background:linear-gradient(135deg,var(--p1),var(--p2));color:#05051a;
}

/* 局內折疊更多工具抽屜（保持頂欄清爽不混亂） */
.more-tools-drawer{
  width:100%;max-width:600px;display:none;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;
  padding:10px 14px;margin:-6px 0 12px;border-radius:14px;
  background:linear-gradient(135deg,rgba(18,20,56,.88),rgba(10,12,36,.92));
  border:1px solid var(--p1-border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 26px rgba(0,0,0,.38);animation:fadeIn .18s ease;
}
.more-tools-drawer.open{display:flex;}
.more-tools-drawer .mini-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;font-size:.8rem;}
#btnMoreTools.is-on{border-color:var(--p1);color:var(--p1);box-shadow:0 0 12px var(--p1-glow);}

/* 沙盒擺盤工具列 */
.sandbox-bar{
  width:100%;max-width:560px;display:none;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;
  padding:8px 14px;margin:0 0 10px;border-radius:13px;
  background:linear-gradient(135deg,rgba(255,215,0,.1),rgba(77,208,225,.1));
  border:1px solid rgba(255,215,0,.45);
}
.sandbox-bar.active{display:flex;}
.sbx-tag{font-size:.8rem;font-weight:700;color:#ffd700;margin-right:4px;}
.sbx-btn{padding:5px 12px;min-height:32px;font-size:.78rem;border-radius:8px;cursor:pointer;
  background:rgba(12,14,40,.8);color:#cfd4ee;border:1px solid var(--line);font-family:inherit;transition:all .18s;}
.sbx-btn.is-on{border-color:#ffd700;color:#ffd700;box-shadow:0 0 10px rgba(255,215,0,.3);}

/* AI 對手性格選擇列 */
.persona-row{
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  margin-top:14px;padding:10px 14px;border-radius:14px;
  background:linear-gradient(135deg,rgba(18,18,50,.6),rgba(10,10,35,.7));
  border:1px solid var(--line);max-width:560px;
}
.persona-btn{
  min-height:36px;padding:6px 13px;border-radius:10px;cursor:pointer;font-size:.82rem;
  color:#9aa0c0;background:transparent;border:1.5px solid var(--line);transition:all .2s;font-family:inherit;
  display:inline-flex;align-items:center;gap:5px;
}
.persona-btn:hover{color:var(--p1);border-color:var(--p1);}
.persona-btn.is-on{
  color:#fff;border-color:var(--p1);
  background:linear-gradient(135deg,var(--p1-soft),var(--p2-soft));
  box-shadow:0 0 12px var(--p1-glow);
}

/* 星海遠征（Odyssey）與任務卡片 */
.odyssey-stage-bar{
  display:flex;align-items:center;justify-content:space-between;gap:6px;margin:10px 0 14px;
  padding:10px 12px;border-radius:12px;background:rgba(12,14,42,.7);border:1px solid var(--line);
}
.ody-node{
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.78rem;font-weight:700;border:1.5px solid var(--line);color:#9aa0c0;background:rgba(255,255,255,.04);
}
.ody-node.done{border-color:#4dd0e1;background:rgba(77,208,225,.2);color:#fff;}
.ody-node.cur{border-color:#ffd700;background:rgba(255,215,0,.22);color:#ffd700;box-shadow:0 0 12px rgba(255,215,0,.4);}
.blessing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:10px 0;}
.blessing-card{
  padding:12px 10px;border-radius:12px;border:1.5px solid var(--line);background:rgba(16,20,54,.75);
  cursor:pointer;text-align:center;transition:all .2s;
}
.blessing-card:hover,.blessing-card.selected{border-color:#ffd700;box-shadow:0 0 16px rgba(255,215,0,.28);transform:translateY(-2px);}
.blessing-title{font-weight:700;color:#ffd700;font-size:.9rem;margin-bottom:4px;}
.blessing-desc{font-size:.76rem;color:#c8d4f0;line-height:1.35;}
.mission-card{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;
  border-radius:12px;background:rgba(16,20,54,.65);border:1px solid var(--line);margin-bottom:8px;
}
.mission-card.done{border-color:#4dd0e1;background:rgba(77,208,225,.1);}
.mission-bar{width:100%;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:5px;}
.mission-fill{height:100%;background:linear-gradient(90deg,var(--p1),var(--p2));border-radius:3px;transition:width .35s;}

/* 選擇卡片：微調 */
.select-card{border-radius:16px;}
.diff-card{border-radius:16px;}

/* 關卡卡片：微調 */
.q-level{border-radius:12px;}

/* 主題卡片：微調 */
.theme-card{border-radius:16px;}

/* ==================== V6.5: 全面棋盤與介面動畫升級 ==================== */
.turn-pill{transition:border-color .3s ease, box-shadow .3s ease, transform .25s cubic-bezier(.34,1.56,.64,1);}
.turn-pill.turn-switch-pop{animation:turnPillPop .36s cubic-bezier(.34,1.56,.64,1);}
@keyframes turnPillPop{0%{transform:scale(.92)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
.turn-pill .pill-dot{animation:pillDotPulse 2s ease-in-out infinite;}
@keyframes pillDotPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.28);opacity:1}}
.board-box.board-enter{animation:boardEnterAnim .45s cubic-bezier(.16,1,.3,1);}
@keyframes boardEnterAnim{0%{opacity:0;transform:scale(.94) translateY(12px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.board-box.check-shake{animation:checkShakeAnim .42s cubic-bezier(.36,.07,.19,.97);}
@keyframes checkShakeAnim{0%,100%{transform:translate(0,0)}18%{transform:translate(-6px,2px)}36%{transform:translate(6px,-2px)}54%{transform:translate(-4px,-2px)}72%{transform:translate(4px,2px)}}
.gc-ico svg{transition:transform .35s cubic-bezier(.34,1.56,.64,1);}
.game-card:hover .gc-ico svg{transform:scale(1.12) rotate(3deg);}


/* ==================== V7.0: 全棋種詳細教學 & 簡潔可展開難度介面 ==================== */
/* 難度視圖：預設只顯示難度名稱本身（如「簡單」），玩家可點擊展開詳細資訊 */
#view-diff .diff-card {
  position: relative;
  padding: 18px 16px 36px;
  min-height: 92px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: all .25s cubic-bezier(.16,1,.3,1);
}
#view-diff .diff-card .sc-name {
  font-size: 1.25rem;
  margin-bottom: 0;
  letter-spacing: 2px;
}
#view-diff .diff-card .diff-ico,
#view-diff .diff-card .sc-desc,
#view-diff .diff-card .diff-dots,
#view-diff .diff-card .elo-predict {
  display: none !important;
}
#view-diff.diff-expanded .diff-card,
#view-diff .diff-card.card-expanded {
  padding: 22px 14px 38px;
}
#view-diff.diff-expanded .diff-card .sc-name,
#view-diff .diff-card.card-expanded .sc-name {
  margin-bottom: 6px;
}
#view-diff.diff-expanded .diff-card .diff-ico,
#view-diff .diff-card.card-expanded .diff-ico {
  display: block !important;
}
#view-diff.diff-expanded .diff-card .sc-desc,
#view-diff .diff-card.card-expanded .sc-desc {
  display: block !important;
}
#view-diff.diff-expanded .diff-card .diff-dots,
#view-diff .diff-card.card-expanded .diff-dots {
  display: flex !important;
}
#view-diff.diff-expanded .diff-card .elo-predict,
#view-diff .diff-card.card-expanded .elo-predict {
  display: flex !important;
}
.diff-more-btn {
  position: absolute;
  bottom: 6px;
  left: 50%;
  transform: translateX(-50%);
  padding: 2px 10px;
  min-height: 22px;
  min-width: 44px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.06);
  color: #9aa0c0;
  font-size: .7rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  transition: all .2s;
  font-family: inherit;
}
.diff-more-btn:hover {
  color: #fff;
  border-color: var(--p1);
  background: var(--p1-soft);
}
#view-diff:not(.diff-expanded) #timerModeGroup,
#view-diff:not(.diff-expanded) #personaGroup {
  display: none !important;
}
.diff-expand-bar {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.diff-expand-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  min-height: 36px;
  border-radius: 999px;
  border: 1px solid var(--p1-border);
  background: var(--p1-soft);
  color: var(--p1);
  font-size: .82rem;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
}
.diff-expand-toggle:hover {
  background: var(--p1-glow);
  color: #fff;
}

/* 局內難度徽章：預設只顯示難度名稱（如「簡單」），點擊可展開詳細資訊 */
.diff-badge {
  cursor: pointer;
  user-select: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all .2s;
}
.diff-badge:hover {
  border-color: var(--p1);
  box-shadow: 0 0 10px var(--p1-soft);
}
.diff-badge .db-arrow {
  font-size: .72rem;
  opacity: .75;
}
.diff-badge .db-extra {
  display: none;
  color: #cfd4ee;
  font-size: .74rem;
  padding-left: 6px;

function tr(key){var d=I18N[curLang]&&I18N[curLang][key];if(d!==undefined)return d;
  var f=I18N['zh-Hant'][key];return f!==undefined?f:key;}
function jgName(lv){return I18N[curLang].jg[lv];}
/* Bug2: 統一更新計分板名稱（pvp/ai/spectate 三模式），避免 spectate 硬編碼難度名 */
function updateScoreboardNames(){
  var p1=$('sbP1Name'),p2=$('sbP2Name');
  if(!p1||!p2)return;
  if(state.mode==='pvp'){p1.textContent=tr('player1');p2.textContent=tr('player2');}
  else if(state.mode==='spectate'){p1.textContent=tr('aiSide1');p2.textContent=tr('aiSide2');}
  else{p1.textContent=tr('you');p2.textContent=tr('ai');}
}
/* 套用所有帶 data-i18n 的靜態文字，並重繪動態處 */
function applyI18n(){
  document.documentElement.lang=curLang;
  try{document.title=tr('logo');}catch(e){}
  var nodes=document.querySelectorAll('[data-i18n]');
  for(var i=0;i<nodes.length;i++){nodes[i].textContent=tr(nodes[i].getAttribute('data-i18n'));}
  var alts=document.querySelectorAll('[data-i18n-alt]');
  for(var a=0;a<alts.length;a++){alts[a].setAttribute('alt',tr(alts[a].getAttribute('data-i18n-alt')));}
  var htmls=document.querySelectorAll('[data-i18n-html]');
  for(var hh=0;hh<htmls.length;hh++){htmls[hh].innerHTML=tr(htmls[hh].getAttribute('data-i18n-html'))+'<span class="dots">...</span>';}
  // 語言按鈕高亮
  var lbs=document.querySelectorAll('.lang-btn');
  for(var b=0;b<lbs.length;b++)lbs[b].classList.toggle('active',lbs[b].getAttribute('data-lang')===curLang);
  // 動態文字刷新
  var mg=$('modeGameName'),dg=$('diffGameName'),gh=$('gameHeader');
  if(state.game){
    if(mg)mg.textContent=tr('name.'+state.game);
    if(dg)dg.textContent=tr('name.'+state.game);
    if(gh)gh.textContent=tr('name.'+state.game);
  }
  refreshDynamicI18n();
  try{applyA11yLabels();}catch(e){}
}
/* M4: 掃描某個 DOM 子樹內的 [data-i18n]/[data-i18n-html] 節點即時翻譯。
   動態插入工具列按鈕後呼叫，否則非中文語言下會顯示硬編碼中文預設文字 */
function applyI18nScope(root){
  if(!root||!root.querySelectorAll)return;
  var ns=root.querySelectorAll('[data-i18n]');
  for(var i=0;i<ns.length;i++){try{ns[i].textContent=tr(ns[i].getAttribute('data-i18n'));}catch(e){}}
  var hs=root.querySelectorAll('[data-i18n-html]');
  for(var h=0;h<hs.length;h++){try{hs[h].innerHTML=tr(hs[h].getAttribute('data-i18n-html'));}catch(e){}}
}
function refreshDynamicI18n(){
  // 計分板名稱 / 難度徽章 / 回合 / 思考 / 圍棋虛手
  updateScoreboardNames();
  var badge=$('diffBadge');
  if(badge&&state.mode==='ai')updateDiffBadge();
  if(typeof state.turn!=='undefined'&&$('pillText')&&$('pillText').textContent)updateTurnUI();
  var th=$('thinking');if(th)th.innerHTML=tr('thinking')+'<span class="dots">...</span>';
  var pb=$('goPassBtn');if(pb)pb.textContent=tr('pass');
  if(state.game&&$('view-game').classList.contains('active')&&typeof render==='function'){try{render();}catch(e){}}
}
function setLang(l){if(!I18N[l])return;curLang=l;
  try{localStorage.setItem('starchess.lang',l);}catch(e){}applyI18n();}

var DPR=(typeof window!=='undefined'&&window.devicePixelRatio)||1;
function setBoardSize(w,h){
  boardCanvas.width=Math.round(w*DPR);
  boardCanvas.height=Math.round(h*DPR);
  boardCanvas.style.width=w+'px';
  boardCanvas.style.aspectRatio=w+'/'+h;
  bctx.setTransform(DPR,0,0,DPR,0,0);
}
function boardW(){return boardCanvas.width/DPR;}
function boardH(){return boardCanvas.height/DPR;}

/* ELO 評分系統 */
var ELO_DEFAULT=1000;
var GAMES_ALL=['ttt','c4','gomoku','c6','checkers','go','jungle','chess','reversi','xiangqi','draughts','hex','pente','dots','morris','mancala'];
function defaultEloByGame(){var o={};for(var i=0;i<GAMES_ALL.length;i++)o[GAMES_ALL[i]]=ELO_DEFAULT;return o;}
/* 綜合 ELO = 各棋種 ELO 平均（只算已對局過的棋種） */
function recomputeOverallElo(){
  var sum=0,n=0;
  for(var i=0;i<GAMES_ALL.length;i++){var g=GAMES_ALL[i];
    if(state.playedGames&&state.playedGames[g]>0){sum+=state.eloByGame[g]||ELO_DEFAULT;n++;}}
  state.elo=n?Math.round(sum/n):ELO_DEFAULT;
}
function loadElo(){try{
  var s=localStorage.getItem('starchess.elo');
  if(s){var o=JSON.parse(s);
    /* G1: 新格式 eloByGame；舊格式單一 elo 遷移到所有棋種 */
    if(o.eloByGame&&typeof o.eloByGame==='object'){
      state.eloByGame=o.eloByGame;
      state.eloBestByGame=o.eloBestByGame||{};
    }else{
      state.eloByGame=defaultEloByGame();
      if(o.elo){for(var i=0;i<GAMES_ALL.length;i++)state.eloByGame[GAMES_ALL[i]]=o.elo;}
      state.eloBestByGame=(o.eloBestByGame&&typeof o.eloBestByGame==='object')?o.eloBestByGame:((o.best&&typeof o.best==='object')?o.best:{});
    }
    /* 補齊缺漏棋種 */
    for(var j=0;j<GAMES_ALL.length;j++){var g=GAMES_ALL[j];
      if(state.eloByGame[g]==null)state.eloByGame[g]=ELO_DEFAULT;
      if(state.eloBestByGame[g]==null)state.eloBestByGame[g]=ELO_DEFAULT;}
    state.eloHistory=o.history||[];
  }else{state.eloByGame=defaultEloByGame();state.eloBestByGame=defaultEloByGame();state.eloHistory=[];}
  recomputeOverallElo();
  state.eloBest=0;for(var k in state.eloBestByGame)if(state.eloBestByGame[k]>state.eloBest)state.eloBest=state.eloBestByGame[k];
}catch(e){state.eloByGame=defaultEloByGame();state.eloBestByGame=defaultEloByGame();state.eloHistory=[];state.elo=ELO_DEFAULT;state.eloBest=ELO_DEFAULT;}}
function saveElo(){try{localStorage.setItem('starchess.elo',JSON.stringify({eloByGame:state.eloByGame,eloBestByGame:state.eloBestByGame,history:state.eloHistory.slice(-100),overall:state.elo,best:state.eloBest}));}catch(e){}}
/* 根據AI難度獲取對手ELO */
function opponentElo(diff,game){
  var base={easy:600,normal:900,hard:1300,master:1800};
  var gameBonus={ttt:0,c4:50,gomoku:100,c6:150,checkers:100,go:200,jungle:50,chess:300,reversi:100,xiangqi:250,draughts:120,hex:140,pente:140,dots:110,morris:150,mancala:130};
  return (base[diff]||900)+(gameBonus[game]||0);
}
/* 計算ELO變化 */
function calcElo(playerElo,oppElo,result){
  var expected=1/(1+Math.pow(10,(oppElo-playerElo)/400));
  var k=playerElo<2100?32:playerElo<2400?24:16;
  var change=Math.round(k*(result-expected));
  return {newElo:playerElo+change,change:change,expected:expected};
}
/* 對局結束後更新ELO（G1: 分棋種） */
function updateElo(result,diff,game){
  if(state.mode!=='ai')return null;
  var opp=opponentElo(diff,game);
  var cur=state.eloByGame[game]||ELO_DEFAULT;
  var res=calcElo(cur,opp,result);
  state.eloByGame[game]=res.newElo;
  state.eloDelta=res.newElo-cur; /* N1: 記錄變化量供結果彈窗顯示 */
  if(res.newElo>(state.eloBestByGame[game]||ELO_DEFAULT))state.eloBestByGame[game]=res.newElo;
  recomputeOverallElo();
  state.eloBest=0;for(var k in state.eloBestByGame)if(state.eloBestByGame[k]>state.eloBest)state.eloBest=state.eloBestByGame[k];
  state.eloHistory.push({date:Date.now(),game:game,diff:diff,result:result,old:cur,neu:res.newElo,change:res.change});
  saveElo();
  return res;
}
/* G5: 預測三種結果下的 ELO 變化。純函式（可用傳入的玩家 ELO 覆寫，方便測試） */
function predictElo(diff,game,playerElo){
  var opp=opponentElo(diff,game);
  var cur=(typeof playerElo==='number')?playerElo:(state.eloByGame[game]||ELO_DEFAULT);
  return {
    win:calcElo(cur,opp,1).change,
    draw:calcElo(cur,opp,0.5).change,
    lose:calcElo(cur,opp,0).change
  };
}
/* G5: 在每個難度卡片下方注入 ELO 預估列 */
function renderELOPredictions(){
  var cards=document.querySelectorAll('.diff-card');
  if(!state.showElo||state.mode!=='ai'){
    for(var k=0;k<cards.length;k++){var o=cards[k].querySelector('.elo-predict');if(o)o.parentNode.removeChild(o);}
    return;
  }
  for(var i=0;i<cards.length;i++)(function(card){
    var d=card.getAttribute('data-diff');
    if(!d)return;
    var pred=predictElo(d,state.game);
    var old=card.querySelector('.elo-predict');
    if(old)old.parentNode.removeChild(old);
    var div=document.createElement('div');
    div.className='elo-predict';
    div.innerHTML='<span class="ew">'+tr('eloWin')+' '+(pred.win>=0?'+':'')+pred.win+'</span>'
      +'<span class="ed">'+tr('eloDraw')+' '+(pred.draw>=0?'+':'')+pred.draw+'</span>'
      +'<span class="el">'+tr('eloLose')+' '+pred.lose+'</span>';
    card.appendChild(div);
  })(cards[i]);
}
