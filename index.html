  /* 根據本局表現與遊戲難度計算星幣獎勵 */
  function awardMatchStarCoins(type){
    if(state.mode === 'spectate') return null;
    var isWin = (type === 'win' || type === 'p1win');
    var isDraw = (type === 'draw');
    var diff = state.mode === 'pvp' ? 'normal' : (state.diff || 'normal');
    var diffMultMap = {easy: 1.0, normal: 1.4, hard: 2.0, master: 2.8, custom: 1.0 + ((state.customDiff || 50) / 100) * 1.5};
    var mult = diffMultMap[diff] || 1.2;

    var base = isWin ? 26 : (isDraw ? 12 : 6);
    var diffBonus = Math.round(base * (mult - 1));
    var tags = [];
    tags.push(tr('coinBase') + ' +' + base);
    if(diffBonus > 0) tags.push(tr('coinDiff') + ' (' + tr(diff) + ') +' + diffBonus);

    var perfBonus = 0;
    if(isWin && (!state.usedUndo || state.activeAegisThisGame)){
      perfBonus += 10;
      tags.push(tr('ach_noUndo') + ' +10');
    }
    if(isWin && !state.hintUsedThisGame){
      perfBonus += 8;
      tags.push(tr('ach_noHint') + ' +8');
    }
    var steps = state.history ? state.history.length : 0;
    if(isWin && steps > 0 && steps <= 16){
      perfBonus += 8;
      tags.push(tr('ach_speedWin') + ' +8');
    }
    var acs = computeAccuracySeries();
    if(acs && acs.avg && acs.avg >= 80){
      var accB = Math.round((acs.avg - 70) * 0.4);
      if(accB > 0){
        perfBonus += accB;
        tags.push(tr('accuracy') + ' ' + acs.avg + '% +' + accB);
      }
    }

    var streakBonus = 0;
    if(isWin && (state.streak || 0) >= 2){
      streakBonus = Math.min(30, (state.streak || 0) * 5);
      tags.push(tr('coinStreak') + ' ×' + state.streak + ' +' + streakBonus);
    }

    var total = base + diffBonus + perfBonus + streakBonus;
    if(isWin && (state.activeEloBoostThisGame || (state.starItems && state.starItems.eloCard > 0))){
      if(!state.activeEloBoostThisGame && state.starItems.eloCard > 0){
        state.starItems.eloCard--;
        state.activeEloBoostThisGame = true;
      }
      var boost = Math.round(total * 0.5);
      total += boost;
      tags.push(tr('item_eloCard') + ' +' + boost);
      if(state.mode === 'ai' && state.game){
        state.eloByGame[state.game] = (state.eloByGame[state.game] || 1000) + 8;
        recomputeOverallElo();
        saveElo();
      }
    }
    state.activeAegisThisGame = false;
    state.activeEloBoostThisGame = false;
    addStarCoins(total);
    return {total: total, tags: tags};
  }

  /* 計算 6 個特殊背景的解鎖進度 */
  function getSpecialBgProgress(id){
    if(state.unlockedSpecialBgs && state.unlockedSpecialBgs[id]) return {cur:1, max:1, unlocked:true, pct:100};
    var totalGames = RECENT.length;
    var totalPlayedSum = 0, distinctGames = 0;
    for(var g2 in (state.playedGames||{})){
      if((state.playedGames[g2]||0)>0){ distinctGames++; totalPlayedSum += state.playedGames[g2]; }
    }
    totalGames = Math.max(totalGames, totalPlayedSum);
    var totalWins = RECENT.filter(function(r){return r.result==='win';}).length;
    if(state.achievements && state.achievements.firstWin) totalWins = Math.max(totalWins, 1);

    if(id==='milkyway'){
      if(totalWins>=1 || totalGames>=3) return {cur:3,max:3,unlocked:true,pct:100};
      return {cur:Math.min(3,totalGames),max:3,unlocked:false,pct:Math.round(Math.min(3,totalGames)/3*100)};
    }
    if(id==='blackhole'){
      var hardWin = !!(state.achievements && (
        state.achievements.tttHard||state.achievements.c4Hard||state.achievements.gomokuHard||
        state.achievements.c6Hard||state.achievements.checkersHard||state.achievements.goHard||
        state.achievements.jungleHard||state.achievements.chessHard||state.achievements.reversiHard||
        state.achievements.xiangqiHard||state.achievements.draughtsHard||state.achievements.hexHard||
        state.achievements.penteHard||state.achievements.dotsHard||state.achievements.masterWin
      ));
      var bestSt = Math.max(state.streak||0, state.bestStreak||0);
      if(hardWin || bestSt>=3) return {cur:3,max:3,unlocked:true,pct:100};
      return {cur:Math.min(3,bestSt),max:3,unlocked:false,pct:Math.round(Math.min(3,bestSt)/3*100)};
    }
    if(id==='pillars'){
      if(distinctGames>=5) return {cur:5,max:5,unlocked:true,pct:100};
      return {cur:distinctGames,max:5,unlocked:false,pct:Math.round(distinctGames/5*100)};
    }
    if(id==='supernova'){
      var achCnt=0; for(var ak in (state.achievements||{})) if(state.achievements[ak]) achCnt++;
      var bestElo = Math.max(state.elo||1000, state.eloBest||1000);
      if(bestElo>=1050 || achCnt>=5) return {cur:5,max:5,unlocked:true,pct:100};
      var p1 = Math.max(0, Math.min(1, (bestElo-1000)/50));
      var p2 = Math.min(1, achCnt/5);
      return {cur:achCnt,max:5,unlocked:false,pct:Math.round(Math.max(p1,p2)*100)};
    }
    if(id==='binary'){
      var pzCnt = solvedPuzzleCount() + solvedTsumegoCount() + solvedTacticsCount() + solvedXqPuzzleCount() + qClearedCount(QMAIN) + qClearedCount(QVAR);
      if(pzCnt>=3 || totalGames>=5) return {cur:3,max:3,unlocked:true,pct:100};
      var pctB = Math.max(pzCnt/3, totalGames/5);
      return {cur:Math.min(3,pzCnt),max:3,unlocked:false,pct:Math.round(Math.min(1,pctB)*100)};
    }
    if(id==='dyson'){
      var odySt = (state.odyssey && state.odyssey.stage) ? state.odyssey.stage : 0;
      if(state.achievements && state.achievements.odysseyClear) odySt = 7;
      if(odySt>=3 || totalWins>=5) return {cur:5,max:5,unlocked:true,pct:100};
      var pctD = Math.max(odySt/3, totalWins/5);
      return {cur:Math.min(5,totalWins),max:5,unlocked:false,pct:Math.round(Math.min(1,pctD)*100)};
    }
    return {cur:0,max:1,unlocked:false,pct:0};
  }

  /* 計算 4 個隱藏背景的多重獨立條件狀態：[bool, bool, bool] */
  function getHiddenBgClueStates(id){
    if(state.unlockedHiddenBgs && state.unlockedHiddenBgs[id]) return [true, true, true];
    var distinctGames = 0;
    for(var g2 in (state.playedGames||{})) if((state.playedGames[g2]||0)>0) distinctGames++;
    var totalWins = RECENT.filter(function(r){return r.result==='win';}).length;
    if(state.achievements && state.achievements.firstWin) totalWins = Math.max(totalWins, 1);
    var achCnt = 0;
    for(var ak in (state.achievements||{})) if(state.achievements[ak]) achCnt++;
    var pzCnt = solvedPuzzleCount() + solvedTsumegoCount() + solvedTacticsCount() + solvedXqPuzzleCount() + qClearedCount(QMAIN) + qClearedCount(QVAR);
    var revealedTotal = 0;
    for(var rk in (state.revealedClues||{})){
      var arr = state.revealedClues[rk] || [];
      for(var ri=0;ri<arr.length;ri++) if(arr[ri]) revealedTotal++;
    }
    var unlockedSpCnt = 0;
    for(var si=0;si<SPECIAL_BGS.length;si++) if(isSpecialBgUnlocked(SPECIAL_BGS[si].id)) unlockedSpCnt++;

    if(id === 'wormhole'){
      var c1 = !!(state.achievements && state.achievements.noUndo);
      var c2 = (distinctGames >= 2);
      var c3 = ((state.totalCoinsEarned || 0) >= 100 || (state.starCoins || 0) >= 60);
      return [c1, c2, c3];
    }
    if(id === 'quantum'){
      var winNormPlus = RECENT.some(function(r){return r.result==='win' && r.diff!=='easy';}) || !!(state.achievements && state.achievements.firstWin);
      var c1q = winNormPlus;
      var c2q = (pzCnt >= 1 || totalWins >= 2);
      var c3q = (achCnt >= 3);
      return [c1q, c2q, c3q];
    }
    if(id === 'seraph'){
      var bestSt = Math.max(state.streak||0, state.bestStreak||0);
      var c1s = (bestSt >= 2 || totalWins >= 3);
      var maxElo = Math.max(state.elo||1000, state.eloBest||1000);
      for(var ek in (state.eloByGame||{})) if(state.eloByGame[ek] > maxElo) maxElo = state.eloByGame[ek];
      var c2s = (maxElo >= 1020);
      var c3s = ((state.shopPurchaseCount || 0) >= 1 || revealedTotal >= 2);
      return [c1s, c2s, c3s];
    }
    if(id === 'singularity'){
      var hardWin = RECENT.some(function(r){return r.result==='win' && (r.diff==='hard'||r.diff==='master');}) || ((state.odyssey && state.odyssey.stage >= 1));
      var c1g = !!hardWin;
      var c2g = (distinctGames >= 4);
      var c3g = (unlockedSpCnt >= 2);
      return [c1g, c2g, c3g];
    }
    return [false, false, false];
  }

  function isSpecialBgUnlocked(id){
    var p = getSpecialBgProgress(id);
    if(p.unlocked && (!state.unlockedSpecialBgs || !state.unlockedSpecialBgs[id])){
      state.unlockedSpecialBgs = state.unlockedSpecialBgs || {};
      state.unlockedSpecialBgs[id] = Date.now();
      saveSpecialAndCoinState();
    }
    return p.unlocked;
  }

  function isHiddenBgUnlocked(id){
    if(state.unlockedHiddenBgs && state.unlockedHiddenBgs[id]) return true;
    var states = getHiddenBgClueStates(id);
    if(states[0] && states[1] && states[2]){
      state.unlockedHiddenBgs = state.unlockedHiddenBgs || {};
      state.unlockedHiddenBgs[id] = Date.now();
      saveSpecialAndCoinState();
      return true;
    }
    return false;
  }

  function checkAllSpecialBgUnlocks(notify){
    state.unlockedSpecialBgs = state.unlockedSpecialBgs || {};
    for(var i=0;i<SPECIAL_BGS.length;i++){
      var id = SPECIAL_BGS[i].id;
      var was = !!state.unlockedSpecialBgs[id];
      var prog = getSpecialBgProgress(id);
      if(prog.unlocked && !was){
        state.unlockedSpecialBgs[id] = Date.now();
        saveSpecialAndCoinState();
        if(notify) showToast(tr('spNewlyUnlocked') + tr('sp_'+id));
      }
    }
    state.unlockedHiddenBgs = state.unlockedHiddenBgs || {};
    for(var j=0;j<HIDDEN_BGS.length;j++){
      var hid = HIDDEN_BGS[j].id;
      var wasH = !!state.unlockedHiddenBgs[hid];
      var nowH = isHiddenBgUnlocked(hid);
      if(nowH && !wasH && notify){
        showToast(tr('hdNewlyUnlocked') + tr('hd_'+hid));
        spawnConfetti();
      }
    }
  }

  /* 解鎖單條隱藏背景線索 */
  function unlockHiddenClue(bgId, clueIdx, cost){
    state.revealedClues = state.revealedClues || {};
    if(!state.revealedClues[bgId]) state.revealedClues[bgId] = [false, false, false];
    if(state.revealedClues[bgId][clueIdx]) return;
    if(!spendStarCoins(cost)) return;
    state.revealedClues[bgId][clueIdx] = true;
    state.shopPurchaseCount = (state.shopPurchaseCount || 0) + 1;
    saveSpecialAndCoinState();
    checkAllSpecialBgUnlocks(true);
    playSound('hint');
    showToast(tr('hdClueRevealedToast') + tr('hd_'+bgId+'_c'+(clueIdx+1)));
    if($('view-theme') && $('view-theme').classList.contains('active')) renderThemeGrid();
  }

  /* 預先生成高細節天體粒子數據（6大特殊 + 4大隱藏背景） */
  var SP_SCENE = {
    milkyway:{stars:[],dust:[],hii:[],clusters:[]},
    blackhole:{disk:[],jets:[]},
    pillars:{motes:[],protostars:[]},
    supernova:{filaments:[],knots:[]},
    binary:{stream:[]},
    dyson:{nodes:[]},
    wormhole:{streaks:[],rings:14},
    quantum:{nodes:[],pulses:[]},
    seraph:{feathers:[]},
    singularity:{shards:[],waves:[]}
  };

  function initSpecialSceneData(){

    for(i=0;i<18;i++){

    /* 2. 黑洞 Black Hole */

    /* 3. 創生之柱 Pillars */
    SP_SCENE.pillars.protostars=[
      {x:0.28,y:0.27,r:3.2,col:'#fff4c2',sp:14},{x:0.31,y:0.36,r:2.4,col:'#aef2ff',sp:10},
      {x:0.50,y:0.21,r:3.8,col:'#ffd6f6',sp:16},{x:0.53,y:0.32,r:2.6,col:'#9be7ff',sp:11},
      {x:0.71,y:0.31,r:3.0,col:'#ffe2a8',sp:13},{x:0.42,y:0.15,r:2.2,col:'#ffffff',sp:9},
      {x:0.63,y:0.18,r:2.5,col:'#b8fff0',sp:10}
    ];
    SP_SCENE.pillars.motes=[];
    for(i=0;i<140;i++){
      SP_SCENE.pillars.motes.push({
        x:Math.random(), y:Math.random(), vy:0.00025 + Math.random()*0.00045,

        col:i%3===0?'#5ef2d6':(i%3===1?'#ff9ee2':'#ffd88a'), ph:Math.random()*6.28
      });

    /* 4. 超新星 Supernova */
    SP_SCENE.supernova.filaments=[]; SP_SCENE.supernova.knots=[];
    var snCols=['#4dd0e1','#ff5277','#ffd700','#b388ff','#00e6a0'];

    /* 5. 雙星日冕 Binary */
    SP_SCENE.binary.stream=[];
    for(i=0;i<140;i++){
      SP_SCENE.binary.stream.push({

    SP_SCENE.dyson.nodes=[];

  initSpecialSceneData();

  /* 核心繪製函式：支援 6 大特殊背景 + 4 大隱藏背景 */
  function renderSpecialScene(ctx, id, w, h, timeMs){
    var t = timeMs * 0.001;
    var cx = w * 0.5, cy = h * 0.5;
    var minDim = Math.min(w, h);
    ctx.save();

    if(id === 'milkyway'){
      var bg = ctx.createRadialGradient(cx, cy, minDim*0.02, cx, cy, Math.max(w,h)*0.75);
      bg.addColorStop(0, '#2a164d'); bg.addColorStop(0.35, '#12092c');
      bg.addColorStop(0.75, '#070418'); bg.addColorStop(1, '#02010a');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

      for(var ci=0;ci<SP_SCENE.milkyway.clusters.length;ci++){
        var cl = SP_SCENE.milkyway.clusters[ci];
        var gx = cl.xFrac * w, gy = cl.yFrac * h, gr = cl.r * (minDim / 500);
        var gGrad = ctx.createRadialGradient(gx, gy, 0, gx, gy, Math.max(2, gr));
        gGrad.addColorStop(0, 'rgba(255,240,200,0.75)');
        gGrad.addColorStop(0.4, 'rgba(180,210,255,0.25)');
        gGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gGrad; ctx.beginPath(); ctx.arc(gx, gy, Math.max(2, gr), 0, Math.PI*2); ctx.fill();
      }
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.42); ctx.scale(1.0, 0.52);
      var galR = Math.max(w, h) * 1.05;
      var diskGlow = ctx.createRadialGradient(0, 0, galR*0.02, 0, 0, galR*0.52);
      diskGlow.addColorStop(0, 'rgba(255,230,180,0.65)');
      diskGlow.addColorStop(0.22, 'rgba(210,130,255,0.32)');
      diskGlow.addColorStop(0.55, 'rgba(70,130,235,0.16)');
      diskGlow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = diskGlow; ctx.beginPath(); ctx.arc(0, 0, galR*0.52, 0, Math.PI*2); ctx.fill();

      for(var hi=0;hi<SP_SCENE.milkyway.hii.length;hi++){
        var hn = SP_SCENE.milkyway.hii[hi];
        var ha = hn.ang + t * hn.spd * 60, hr = hn.rFrac * galR;
        var hx = Math.cos(ha) * hr, hy = Math.sin(ha) * hr, hRad = hn.rad * (minDim / 420);
        var hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, Math.max(2, hRad));
        hg.addColorStop(0, hn.col); hg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(hx, hy, Math.max(2, hRad), 0, Math.PI*2); ctx.fill();
      }
      for(var di=0;di<SP_SCENE.milkyway.dust.length;di++){
        var dn = SP_SCENE.milkyway.dust[di];
        var da = dn.ang + t * dn.spd * 60, dr = dn.rFrac * galR;
        var dx = Math.cos(da) * dr, dy = Math.sin(da) * dr, dRad = dn.rad * (minDim / 420);
        var dg = ctx.createRadialGradient(dx, dy, 0, dx, dy, Math.max(2, dRad));
        dg.addColorStop(0, 'rgba(4,2,14,0.58)'); dg.addColorStop(1, 'rgba(4,2,14,0)');
        ctx.fillStyle = dg; ctx.beginPath(); ctx.arc(dx, dy, Math.max(2, dRad), 0, Math.PI*2); ctx.fill();
      }
      var scaleF = Math.max(0.45, minDim / 520);
      for(var si=0;si<SP_SCENE.milkyway.stars.length;si++){
        var st = SP_SCENE.milkyway.stars[si];
        var sa = st.ang + t * st.spd * 60, sr = st.rFrac * galR;
        var sx = Math.cos(sa) * sr, sy = Math.sin(sa) * sr;
        ctx.globalAlpha = st.alpha * (0.65 + 0.35 * Math.sin(t * 2.2 + st.tw));
        ctx.fillStyle = st.col; ctx.beginPath(); ctx.arc(sx, sy, st.sz * scaleF, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      var coreR = galR * 0.14;
      var cg = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR);
      cg.addColorStop(0, 'rgba(255,255,245,0.96)');
      cg.addColorStop(0.28, 'rgba(255,215,140,0.78)');
      cg.addColorStop(0.65, 'rgba(232,121,249,0.28)');
      cg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(0, 0, coreR, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    else if(id === 'blackhole'){
      var bhBg = ctx.createRadialGradient(cx, cy, minDim*0.05, cx, cy, Math.max(w,h)*0.8);
      bhBg.addColorStop(0, '#260d08'); bhBg.addColorStop(0.45, '#0e0614'); bhBg.addColorStop(1, '#030208');
      ctx.fillStyle = bhBg; ctx.fillRect(0, 0, w, h);
      var rs = minDim * 0.115;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.22);
      for(var ji=0;ji<SP_SCENE.blackhole.jets.length;ji++){
        var jt = SP_SCENE.blackhole.jets[ji];
        var p = (jt.prog + t * jt.spd * 60) % 1;
        var jy = jt.dir * (rs * 0.9 + p * minDim * 0.48), jx = jt.spread * p * rs * 2.2;
        ctx.globalAlpha = (1 - p) * 0.55;
        ctx.fillStyle = p < 0.35 ? '#fff2c6' : '#7ce8ff';
        ctx.beginPath(); ctx.arc(jx, jy, jt.sz * (minDim/480), 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      for(var arch=-1; arch<=1; arch+=2){
        ctx.save(); ctx.scale(1.0, arch * 0.88);
        var lensedG = ctx.createRadialGradient(0, 0, rs*0.95, 0, 0, rs*2.35);
        lensedG.addColorStop(0, 'rgba(0,0,0,0)');
        lensedG.addColorStop(0.12, 'rgba(255,245,210,0.88)');
        lensedG.addColorStop(0.32, 'rgba(255,155,50,0.58)');
        lensedG.addColorStop(0.65, 'rgba(210,45,30,0.22)');
        lensedG.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = lensedG;
        ctx.beginPath();
        ctx.arc(0, 0, rs*2.3, Math.PI*1.06, Math.PI*1.94);
        ctx.arc(0, 0, rs*1.02, Math.PI*1.94, Math.PI*1.06, true);
        ctx.closePath(); ctx.fill(); ctx.restore();
      }
      ctx.save(); ctx.scale(1.0, 0.28);
      var diskBase = ctx.createRadialGradient(0, 0, rs*1.08, 0, 0, rs*3.5);
      diskBase.addColorStop(0, 'rgba(255,250,220,0.92)');
      diskBase.addColorStop(0.22, 'rgba(255,180,70,0.75)');
      diskBase.addColorStop(0.55, 'rgba(235,75,40,0.42)');
      diskBase.addColorStop(0.85, 'rgba(120,20,45,0.15)');
      diskBase.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = diskBase; ctx.beginPath(); ctx.arc(0, 0, rs*3.5, 0, Math.PI*2); ctx.fill();
      for(var bi=0;bi<SP_SCENE.blackhole.disk.length;bi++){

        wGrad.addColorStop(0.35, 'rgba(255,185,50,0.55)');
        wGrad.addColorStop(0.75, 'rgba(255,65,110,0.25)');
        wGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = wGrad;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(side * wingSpan * 0.38, wingSpan * 0.25, side * wingSpan * 0.28, wingSpan * 0.78, 0, wingSpan);
        ctx.bezierCurveTo(-side * wingSpan * 0.08, wingSpan * 0.65, -side * wingSpan * 0.04, wingSpan * 0.25, 0, 0);
        ctx.fill();
        ctx.restore();
      }
      /* 神聖同心天體光輪 (Ophanim Rings) */
      for(var ori=1;ori<=2;ori++){
        ctx.save();
        ctx.rotate(t * (ori===1 ? 0.4 : -0.3));
        ctx.strokeStyle = ori===1 ? 'rgba(255,215,0,0.68)' : 'rgba(255,120,180,0.48)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, minDim*(0.11*ori), 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }
      var sCore = ctx.createRadialGradient(0, 0, 0, 0, 0, minDim*0.14);
      sCore.addColorStop(0, '#ffffff'); sCore.addColorStop(0.35, '#ffd700'); sCore.addColorStop(0.7, 'rgba(255,80,120,0.4)'); sCore.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sCore; ctx.beginPath(); ctx.arc(0, 0, minDim*0.14, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    /* ===== 隱藏背景 4：虛空奇點 · 宇宙視界終焉 (singularity) ===== */
    else if(id === 'singularity'){
      var sgBg = ctx.createRadialGradient(cx, cy, minDim*0.04, cx, cy, Math.max(w,h)*0.8);
      sgBg.addColorStop(0, '#240b42'); sgBg.addColorStop(0.5, '#0c041c'); sgBg.addColorStop(1, '#020106');
      ctx.fillStyle = sgBg; ctx.fillRect(0, 0, w, h);

      ctx.save(); ctx.translate(cx, cy);
      var maxSR = minDim * 0.45;
      /* 逆流向心坍縮引力波環 */
      for(var wv=0;wv<5;wv++){
        var wp2 = 1 - ((t * 0.22 + wv * 0.2) % 1);
        var wr2 = wp2 * maxSR;
        ctx.strokeStyle = 'rgba(192,132,252,' + ((1 - wp2) * 0.65) + ')';
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(0, 0, wr2, 0, Math.PI*2); ctx.stroke();
      }
      /* 懸浮碎裂維度晶體 (Dimensional Shards) */
      for(var shi=0;shi<SP_SCENE.singularity.shards.length;shi++){
        var sh = SP_SCENE.singularity.shards[shi];
        var sa2 = sh.ang + t * sh.spd;
        var sr2 = sh.dist * maxSR;
        var sx3 = Math.cos(sa2) * sr2, sy3 = Math.sin(sa2) * sr2 * 0.78;
        var sSz = sh.sz * (minDim / 480);
        ctx.save();
        ctx.translate(sx3, sy3);
        ctx.rotate(sh.rot + t * 0.8);
        ctx.fillStyle = sh.col;
        ctx.globalAlpha = 0.65;
        ctx.beginPath();
        ctx.moveTo(0, -sSz); ctx.lineTo(sSz*0.65, 0); ctx.lineTo(0, sSz); ctx.lineTo(-sSz*0.65, 0);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
      /* 中心紫晶奇點黑核與裂隙十字芒 */
      var voidR = minDim * 0.095;
      ctx.fillStyle = '#020006';
      ctx.beginPath(); ctx.arc(0, 0, voidR, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#e879f9'; ctx.lineWidth = 2.2;
      ctx.shadowColor = '#c084fc'; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(0, 0, voidR * 1.04, 0, Math.PI*2); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    /* 疊加前景柔和閃爍繁星 */
    for(var sIdx=0;sIdx<stars.length;sIdx+=2){
      var st0 = stars[sIdx];
      var sx0 = (st0.x / Math.max(1, innerWidth)) * w;
      var sy0 = (st0.y / Math.max(1, innerHeight)) * h;
      ctx.fillStyle = 'rgba(255,255,255,' + (Math.abs(st0.a) * 0.65) + ')';
      ctx.beginPath(); ctx.arc(sx0, sy0, st0.r * 0.85, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  /* 覆寫星空主繪製循環 drawStars */
  drawStars = function(){
    if(!starAnimOn){starRAF=null;return;}
    var activeSp = spPreviewBg || state.specialBg;
    for(var i=0;i<stars.length;i++){
      var t=stars[i];t.a+=t.s;if(t.a>1||t.a<0)t.s=-t.s;
    }
    if(activeSp && !state.simplifiedAnim){
      renderSpecialScene(sctx, activeSp, innerWidth, innerHeight, performance.now());
      if($('view-theme') && $('view-theme').classList.contains('active')){
        renderThemeMiniCanvases(performance.now());
      }
      starRAF=requestAnimationFrame(drawStars);
      return;
    }
    sctx.clearRect(0,0,innerWidth,innerHeight);
    for(var j=0;j<stars.length;j++){
      var st=stars[j];
      sctx.beginPath();sctx.arc(st.x,st.y,st.r,0,Math.PI*2);
      sctx.fillStyle='rgba(255,255,255,'+Math.abs(st.a)+')';sctx.fill();
    }
    if(!state.simplifiedAnim){
      meteorTimer++;
      if(meteorTimer>180&&Math.random()<.02){spawnMeteor();meteorTimer=0;}
    }
    for(var m=meteors.length-1;m>=0;m--){var mt=meteors[m];
      mt.x+=mt.vx;mt.y+=mt.vy;mt.life-=.012;
      if(mt.life<=0||mt.y>innerHeight+50||mt.x<-100){meteors.splice(m,1);continue;}
      var grad=sctx.createLinearGradient(mt.x,mt.y,mt.x+mt.vx*8,mt.y+mt.vy*8);
      grad.addColorStop(0,'rgba(255,255,255,'+mt.life+')');
      grad.addColorStop(1,'rgba(255,255,255,0)');
      sctx.strokeStyle=grad;sctx.lineWidth=2;sctx.lineCap='round';
      sctx.beginPath();sctx.moveTo(mt.x,mt.y);sctx.lineTo(mt.x+mt.vx*8,mt.y+mt.vy*8);sctx.stroke();
      sctx.beginPath();sctx.arc(mt.x,mt.y,1.5,0,Math.PI*2);
      sctx.fillStyle='rgba(255,255,255,'+mt.life+')';sctx.fill();}
    if($('view-theme') && $('view-theme').classList.contains('active')){
      renderThemeMiniCanvases(performance.now());
    }
    starRAF=requestAnimationFrame(drawStars);
  };

  /* 2. 星海環境音律合成器 (Procedural Web Audio Ambient BGM) */
  var bgmTimer=null, bgmStep=0;
  var BGM_SCALES={
    nebula:[220, 261.63, 329.63, 392.00, 440, 523.25],
    pulsar:[196, 246.94, 293.66, 369.99, 392, 493.88],
    aurora:[261.63, 293.66, 329.63, 392.00, 440, 587.33]
  };
  function updateBgmBtnUI(){
    var b=$('btnBgmToggle');
    if(b)b.classList.toggle('is-playing',state.bgmMode&&state.bgmMode!=='off');
  }
  function stopCosmicBgm(){
    if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null;}
    updateBgmBtnUI();
  }
  function playCosmicBgmNote(){
    if(!state.bgmMode||state.bgmMode==='off'||!state.soundOn||!state.volume||document.hidden)return;
    try{
      if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended')audioCtx.resume();
      var scale=BGM_SCALES[state.bgmMode]||BGM_SCALES.nebula;
      var freq=scale[(bgmStep*2 + (bgmStep%3))%scale.length];
      bgmStep++;
      var now=audioCtx.currentTime;
      var osc=audioCtx.createOscillator();
      var gain=audioCtx.createGain();
      osc.type=(state.bgmMode==='pulsar')?'triangle':'sine';
      osc.frequency.setValueAtTime(freq,now);
      var vol=Math.min(0.045, 0.035*(state.volume||0.8));
      gain.gain.setValueAtTime(0.0001,now);
      gain.gain.linearRampToValueAtTime(vol,now+0.6);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+2.8);
      osc.connect(gain);gain.connect(audioCtx.destination);
      osc.start(now);osc.stop(now+2.9);
    }catch(e){}
  }
  function setCosmicBgm(mode){
    state.bgmMode=mode||'off';
    saveV63State();
    stopCosmicBgm();
    if(state.bgmMode!=='off'){
      playCosmicBgmNote();
      bgmTimer=setInterval(playCosmicBgmNote, 2600);
    }
    updateBgmBtnUI();
  }
  function cycleCosmicBgm(){
    var modes=['off','nebula','pulsar','aurora'];
    var next=modes[(modes.indexOf(state.bgmMode||'off')+1)%modes.length];
    setCosmicBgm(next);
    var labelMap={off:'bgmOff',nebula:'bgmNebula',pulsar:'bgmPulsar',aurora:'bgmAurora'};
    showToast(tr('bgmTitle')+': '+tr(labelMap[next]));
  }

    while(stars.length < targetCount){
      stars.push({
        x: Math.random() * innerWidth,

        r: Math.random() * 1.5 + 0.5,
        a: Math.random(),

  /* 覆寫 BGM 單音播放以支援獨立 BGM 音量與第 4 首空靈星琴 (zen) */
  playCosmicBgmNote = function(){
    if(!state.bgmMode || state.bgmMode === 'off' || !state.soundOn || !state.volume || !state.bgmVolume || document.hidden) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      var scale = BGM_SCALES[state.bgmMode] || BGM_SCALES.nebula;
      var freq = scale[(bgmStep * 2 + (bgmStep % 3)) % scale.length];
      bgmStep++;
      var now = audioCtx.currentTime;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = (state.bgmMode === 'pulsar') ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(freq, now);
      var vol = Math.min(0.08, 0.05 * (state.volume || 0.8) * (state.bgmVolume != null ? state.bgmVolume : 0.7));
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.55);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.75);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 2.85);
    }catch(e){}
  };

  cycleCosmicBgm = function(){
    var modes = ['off','nebula','pulsar','aurora','zen'];
    var next = modes[(modes.indexOf(state.bgmMode || 'off') + 1) % modes.length];
    setCosmicBgm(next);
    saveV64Settings();
    var labelMap = {off:'bgmOff',nebula:'bgmNebula',pulsar:'bgmPulsar',aurora:'bgmAurora',zen:'bgmZen'};
    showToast(tr('bgmTitle') + ': ' + tr(labelMap[next]));
  };

  /* AI 思考節奏延遲（閃電 80ms / 標準 300ms / 沉思 750ms） */
  function getAiPaceDelay(){
    if(state.aiPace === 'fast') return 80;
    if(state.aiPace === 'slow') return 750;
    return 300;
  }

  var _origTriggerAI = triggerAI;
  triggerAI = function(){
    if(state.replay || state.thinking || state.over) return;
    state.pendingConfirm = null;
    var delay = getAiPaceDelay();
    if(delay === 300 || (state.diff === 'master' && (state.game === 'chess' || state.game === 'go'))){
      _origTriggerAI();
      return;
    }
    var gen = state.gen;
    state.thinking = true;
    var th = $('thinking'); if(th) th.classList.add('active');
    aiTimer = setTimeout(function(){
      if(gen !== state.gen) return;
      if(state.over){ state.thinking = false; if(th) th.classList.remove('active'); return; }
      var move = aiPickMove();
      state.thinking = false; if(th) th.classList.remove('active');
      if(!move || state.over) return;
      aiDoMove(move);
    }, delay);
  };

  /* 防誤觸二次確認落子（支援單點落子型棋種，大盤棋種如五子棋/六子棋/圍棋/夾擊棋/六角星連棋/點格棋/四子棋/井字棋皆可二次確認） */
  var LARGE_CONFIRM_GAMES = {gomoku:1, c6:1, go:1, pente:1, hex:1, dots:1};
  var SINGLE_TAP_CONFIRM_GAMES = {ttt:1, c4:1, gomoku:1, c6:1, go:1, pente:1, hex:1, dots:1, reversi:1, mancala:1};

  function needsMoveConfirm(){
    if(state.sandbox || state.over || state.thinking || state.replay || state.questRun) return false;
    if(state.mode === 'spectate' || (state.mode === 'ai' && state.turn === P2)) return false;
    var cm = state.confirmMove || 'off';
    if(cm === 'off') return false;
    if(!SINGLE_TAP_CONFIRM_GAMES[state.game]) return false;
    if(cm === 'large') return !!LARGE_CONFIRM_GAMES[state.game];
    return true;
  }

  function resolveConfirmTarget(mx, my){
    var g = state.game;
    if(g === 'ttt'){
      var c = Math.floor((mx - TTT_OFF) / TTT_S), r = Math.floor((my - TTT_OFF) / TTT_S);
      if(r < 0 || r > 2 || c < 0 || c > 2 || state.grid[r*3+c] !== EMPTY) return null;
      return {key: 'ttt_'+r+'_'+c, x: TTT_OFF + c*TTT_S + TTT_S/2, y: TTT_OFF + r*TTT_S + TTT_S/2, r: 24};
    }
    if(g === 'c4'){
      var c2 = Math.floor((mx - C4_OFF) / C4_S);
      if(c2 < 0 || c2 > 3) return null;
      var r2 = c4Lowest(c2); if(r2 < 0) return null;
      return {key: 'c4_'+c2, x: c4cx(c2), y: c4cy(r2), r: C4_COIN};
    }
    if(g === 'gomoku' || g === 'c6' || g === 'pente'){
      var gc = Math.round((mx - GK_PAD) / GK_CS), gr = Math.round((my - GK_PAD) / GK_CS);
      if(gr < 0 || gr >= 15 || gc < 0 || gc >= 15 || state.grid[gr][gc] !== EMPTY) return null;
      return {key: g+'_'+gr+'_'+gc, x: GK_PAD + gc*GK_CS, y: GK_PAD + gr*GK_CS, r: 15};
    }
    if(g === 'go'){
      var goc = Math.round((mx - GO_PAD) / GO_S), gor = Math.round((my - GO_PAD) / GO_S);
      if(gor < 0 || gor >= GO_N || goc < 0 || goc >= GO_N || state.grid[gor][goc] !== EMPTY) return null;
      return {key: 'go_'+gor+'_'+goc, x: GO_PAD + goc*GO_S, y: GO_PAD + gor*GO_S, r: GO_S*0.44};
    }
    if(g === 'reversi'){
      var dc = Math.floor(mx / RV_CS), dr = Math.floor(my / RV_CS);
      if(dr < 0 || dr >= RV_N || dc < 0 || dc >= RV_N) return null;
      var lr = pr(dr, RV_N), lc = pc(dc, RV_N);
      if(rvFlips(state.grid, lr, lc, state.turn).length === 0) return null;
      return {key: 'rv_'+lr+'_'+lc, x: dc*RV_CS + RV_CS/2, y: dr*RV_CS + RV_CS/2, r: RV_CS*0.38};
    }
    if(g === 'hex'){
      var best = null, bd = HX_R * 0.95;
      for(var hr=0;hr<HX_N;hr++)for(var hc=0;hc<HX_N;hc++){
        var pt = hexCenter(hr, hc), d = Math.hypot(mx - pt.x, my - pt.y);
        if(d < bd){ bd = d; best = [hr, hc, pt]; }
      }
      if(!best || state.grid[best[0]][best[1]] !== EMPTY) return null;
      return {key: 'hx_'+best[0]+'_'+best[1], x: best[2].x, y: best[2].y, r: HX_R*0.75};
    }
    if(g === 'dots' && state.dots){
      var ed = dotsPickEdge(mx, my);
      if(!ed) return null;
      if((ed.t === 'h' && state.dots.h[ed.r][ed.c]) || (ed.t === 'v' && state.dots.v[ed.r][ed.c])) return null;
      var ep = dotsEdgeCenter(ed.t, ed.r, ed.c);
      return {key: 'dt_'+ed.t+'_'+ed.r+'_'+ed.c, x: ep.x, y: ep.y, r: 16};
    }
    if(g === 'mancala' && state.mancala){
      var pit = mcPickPit(mx, my);
      if(pit < 0) return null;
      if((state.turn === P1 && (pit < 0 || pit > 5)) || (state.turn === P2 && (pit < 7 || pit > 12))) return null;
      if(state.mancala.pits[pit] <= 0) return null;
      var mpt = mcPitCenter(pit);
      return {key: 'mc_'+pit, x: mpt.x, y: mpt.y, r: 30};
    }
    return null;
  }

  var _origHandleBoardClick = handleBoardClick;

      if(usesCanvasFlip()){ checkX = boardW() - mx; checkY = boardH() - my; }
      var tgt = resolveConfirmTarget(checkX, checkY);

      if(!state.pendingConfirm || state.pendingConfirm.key !== tgt.key){
        state.pendingConfirm = tgt;
        playSound('click');

      bctx.strokeStyle = '#ffd700';
      bctx.lineWidth = 2.8;
      bctx.shadowColor = '#ffd700';
      bctx.shadowBlur = 12;
      bctx.beginPath(); bctx.arc(pc.x, pc.y, pc.r, 0, Math.PI * 2); bctx.stroke();
      bctx.lineWidth = 1.6;
      bctx.setLineDash([4, 3]);
      bctx.beginPath(); bctx.arc(pc.x, pc.y, pc.r + 5, 0, Math.PI * 2); bctx.stroke();
      bctx.setLineDash([]);
      /* 準星十字 */
      bctx.beginPath();
      bctx.moveTo(pc.x - 6, pc.y); bctx.lineTo(pc.x + 6, pc.y);
      bctx.moveTo(pc.x, pc.y - 6); bctx.lineTo(pc.x, pc.y + 6);

      if(state.soundMix[t] === undefined) state.soundMix[t] = true;
      var on = state.soundMix[t] !== false;
      html += '<label class="sfx-chip"><input type="checkbox" class="sfx-toggle" data-sfx="' + t + '"' + (on?' checked':'') + '><span>' + tr('sfx'+t.charAt(0).toUpperCase()+t.slice(1)) + '</span></label>';
    }
    html += '</div></div></div>';

    /* ===== 分組 2：對局操控與防誤觸輔助 ===== */
    html += '<div class="set-section-card">'
      + '<div class="set-sec-header">' + ICONS.shield + '<span>' + tr('setSecControl') + '</span></div>'
      + '<div class="set-item-block">'
      + '<div class="set-row-head"><span class="set-row-title">' + tr('confirmMoveLabel') + '</span></div>'
      + '<div class="set-row-desc">' + tr('confirmMoveDesc') + '</div>'
      + '<div class="set-seg-group">';
    var cmOpts = [['off','confirmOff'],['large','confirmLarge'],['all','confirmAll']];
    for(var cmi=0;cmi<cmOpts.length;cmi++){
      var cmk = cmOpts[cmi][0];
      html += '<button class="mini-btn set-seg' + ((state.confirmMove||'off')===cmk?' is-on':'') + '" type="button" data-confirmmv="' + cmk + '">' + tr(cmOpts[cmi][1]) + '</button>';
    }
    html += '</div></div>'
      + '<div class="set-item-block">'
      + '<div class="set-row-head"><span class="set-row-title">' + tr('aiPaceLabel') + '</span></div>'
      + '<div class="set-row-desc">' + tr('aiPaceDesc') + '</div>'
      + '<div class="set-seg-group">';
    var apOpts = [['fast','paceFast'],['normal','paceNormal'],['slow','paceSlow']];
    for(var api=0;api<apOpts.length;api++){
      var apk = apOpts[api][0];
      html += '<button class="mini-btn set-seg' + ((state.aiPace||'normal')===apk?' is-on':'') + '" type="button" data-aipace="' + apk + '">' + tr(apOpts[api][1]) + '</button>';
    }
    html += '</div></div>'
      + '<div class="set-item-block">'
      + '<div class="set-row-head"><span class="set-row-title">' + tr('autoHistLabel') + '</span></div>'
      + '<div class="set-row-desc">' + tr('autoHistDesc') + '</div>'
      + '<div class="set-seg-group">'
      + '<button class="mini-btn set-seg' + (state.autoOpenHistory?' is-on':'') + '" type="button" data-autohist="1">' + tr('hapticOn') + '</button>'
      + '<button class="mini-btn set-seg' + (!state.autoOpenHistory?' is-on':'') + '" type="button" data-autohist="0">' + tr('hapticOff') + '</button>'
      + '</div></div>'
      + '<div class="set-item-block">'
      + '<div class="set-row-head"><span class="set-row-title">' + tr('haptic') + '</span></div>'
      + '<div class="set-seg-group">'
      + '<button class="mini-btn set-seg' + (state.haptic?' is-on':'') + '" type="button" data-haptic="1">' + tr('hapticOn') + '</button>'
      + '<button class="mini-btn set-seg' + (!state.haptic?' is-on':'') + '" type="button" data-haptic="0">' + tr('hapticOff') + '</button>'
      + '</div></div></div>';

    /* ===== 分組 3：棋盤視覺與星空特效 ===== */
    html += '<div class="set-section-card">'
      + '<div class="set-sec-header">' + ICONS.palette + '<span>' + tr('setSecVisual') + '</span></div>'
      + '<div class="set-item-block">'
      + '<div class="set-row-head"><span class="set-row-title">' + tr('boardStyle') + '</span></div>'
      + '<div class="set-seg-group">';
    for(var bsi=0;bsi<BOARD_STYLES.length;bsi++){
      var bsk = BOARD_STYLES[bsi];
      html += '<button class="mini-btn set-seg' + (state.boardStyle===bsk?' is-on':'') + '" type="button" data-bstyle="' + bsk + '">' + tr('style'+bsk.charAt(0).toUpperCase()+bsk.slice(1)) + '</button>';
    }
    html += '</div></div>'
      + '<div class="set-item-block">'
      + '<div class="set-row-head"><span class="set-row-title">' + tr('gridBrightLabel') + '</span></div>'
      + '<div class="set-seg-group">';
    var gbOpts = [['soft','gridSoft'],['normal','gridNormal'],['high','gridHigh']];
    for(var gbi=0;gbi<gbOpts.length;gbi++){
      var gbk = gbOpts[gbi][0];
      html += '<button class="mini-btn set-seg' + ((state.gridBrightness||'normal')===gbk?' is-on':'') + '" type="button" data-gridbr="' + gbk + '">' + tr(gbOpts[gbi][1]) + '</button>';
    }
    html += '</div></div>'
      + '<div class="set-item-block">'
      + '<div class="set-row-head"><span class="set-row-title">' + tr('starDensityLabel') + '</span></div>'
      + '<div class="set-seg-group">';
    var sdOpts = [['low','densityLow'],['normal','densityNormal'],['high','densityHigh']];
    for(var sdi=0;sdi<sdOpts.length;sdi++){
      var sdk = sdOpts[sdi][0];
      html += '<button class="mini-btn set-seg' + ((state.starDensity||'normal')===sdk?' is-on':'') + '" type="button" data-stardens="' + sdk + '">' + tr(sdOpts[sdi][1]) + '</button>';
    }
    html += '</div></div>'
      + '<div class="set-item-block">'
      + '<div class="set-row-head"><span class="set-row-title">' + tr('animSpeed') + '</span></div>'
      + '<div class="set-seg-group">';
    var asOpts = [['slow','animSlow'],['normal','animNormal'],['fast','animFast'],['off','animOff']];
    for(var asi=0;asi<asOpts.length;asi++){
      html += '<button class="mini-btn set-seg' + (state.animSpeed===asOpts[asi][0]?' is-on':'') + '" type="button" data-aspeed="' + asOpts[asi][0] + '">' + tr(asOpts[asi][1]) + '</button>';
    }
    html += '</div></div>'
      + '<div class="set-item-block">'
      + '<div class="set-row-head"><span class="set-row-title">' + tr('simplifiedAnim') + '</span></div>'
      + '<div class="set-row-desc">' + tr('simplifiedAnimDesc') + '</div>'
      + '<div class="set-seg-group">'
      + '<button class="mini-btn set-seg' + (state.simplifiedAnim?' is-on':'') + '" type="button" data-simpanim="1">' + tr('hapticOn') + '</button>'
      + '<button class="mini-btn set-seg' + (!state.simplifiedAnim?' is-on':'') + '" type="button" data-simpanim="0">' + tr('hapticOff') + '</button>'
      + '</div></div></div>';

    /* ===== 分組 4：介面顯示與系統偏好 ===== */
    html += '<div class="set-section-card">'
      + '<div class="set-sec-header">' + ICONS.chart + '<span>' + tr('setSecSystem') + '</span></div>'
      + '<div class="set-item-block">'
      + '<div class="set-row-head"><span class="set-row-title">' + tr('showEvalLabel') + '</span></div>'
      + '<div class="set-row-desc">' + tr('showEvalDesc') + '</div>'
      + '<div class="set-seg-group">'
      + '<button class="mini-btn set-seg' + (state.showEvalBar?' is-on':'') + '" type="button" data-showeval="1">' + tr('hapticOn') + '</button>'
      + '<button class="mini-btn set-seg' + (!state.showEvalBar?' is-on':'') + '" type="button" data-showeval="0">' + tr('hapticOff') + '</button>'
      + '</div></div>'
      + '<div class="set-item-block">'
      + '<div class="set-row-head"><span class="set-row-title">' + tr('showEloLabel') + '</span></div>'
      + '<div class="set-row-desc">' + tr('showEloHint') + '</div>'
      + '<div class="set-seg-group">'
      + '<button class="mini-btn set-seg' + (state.showElo?' is-on':'') + '" type="button" data-showelo="1">' + tr('hapticOn') + '</button>'
      + '<button class="mini-btn set-seg' + (!state.showElo?' is-on':'') + '" type="button" data-showelo="0">' + tr('hapticOff') + '</button>'
      + '</div></div>'
      + '<div class="set-item-block">'
      + '<div class="set-row-head"><span class="set-row-title">' + tr('uiScaleLabel') + '</span></div>'
      + '<div class="set-seg-group">';
    var usOpts = [['normal','scaleNormal'],['md','scaleMd'],['lg','scaleLg']];
    for(var usi=0;usi<usOpts.length;usi++){
      var usk = usOpts[usi][0];
      html += '<button class="mini-btn set-seg' + ((state.uiScale||'normal')===usk?' is-on':'') + '" type="button" data-uiscale="' + usk + '">' + tr(usOpts[usi][1]) + '</button>';
    }
    html += '</div></div>'
      + '<div class="set-item-block">'
      + '<button type="button" class="set-reset-btn" id="btnResetSettings">' + tr('resetSettingsBtn') + '</button>'
      + '</div></div>';

    html += '</div>';
    showModal(tr('settings'), html);

    /* 綁定主音量與 BGM 音量滑桿 */
    var sl = $('volSlider');
    if(sl) sl.addEventListener('input', function(){
      var nv = parseInt(sl.value, 10) / 100;
      state.volume = nv; state.soundOn = nv > 0;
      try{ localStorage.setItem('starchess.vol', String(nv)); }catch(e){}
      var vv = $('volVal'); if(vv) vv.textContent = sl.value + '%';
      var sb = $('btnSound');
      if(sb) sb.innerHTML = '<span class="ic">' + ICONS[volIcon(nv)] + '</span>';
      playSound('click');
    });
    var bsl = $('bgmVolSlider');
    if(bsl) bsl.addEventListener('input', function(){
      var nbv = parseInt(bsl.value, 10) / 100;
      state.bgmVolume = nbv;
      saveV64Settings();
      var bvv = $('bgmVolVal'); if(bvv) bvv.textContent = bsl.value + '%';
      if(state.bgmMode && state.bgmMode !== 'off') playCosmicBgmNote();
    });

    /* 綁定個別音效開關 */
    var toggles = document.querySelectorAll('.sfx-toggle');
    for(var j=0;j<toggles.length;j++)(function(cb){
      cb.addEventListener('change', function(){
        var key = cb.getAttribute('data-sfx');
        state.soundMix[key] = cb.checked;
        saveSoundMix();
        if(cb.checked) playSound(key);
      });
    })(toggles[j]);

    /* 通用分段按鈕綁定器（保留滾動位置） */
    function bindSeg(attr, fn){
      var btns = document.querySelectorAll('[' + attr + ']');
      for(var k=0;k<btns.length;k++)(function(btn){
        btn.addEventListener('click', function(e){
          e.preventDefault();
          var bodyEl = $('genModalBody');
          var st = bodyEl ? bodyEl.scrollTop : 0;
          fn(btn.getAttribute(attr));
          saveV64Settings();
          playSound('click');
          showVolumePanel();
          var bodyEl2 = $('genModalBody');
          if(bodyEl2) bodyEl2.scrollTop = st;
        });
      })(btns[k]);
    }

    bindSeg('data-bgm', function(val){ setCosmicBgm(val); });
    bindSeg('data-confirmmv', function(val){ state.confirmMove = val; state.pendingConfirm = null; if(state.game) render(); });
    bindSeg('data-aipace', function(val){ state.aiPace = val; });
    bindSeg('data-autohist', function(val){ state.autoOpenHistory = (val === '1'); });
    bindSeg('data-haptic', function(val){
      state.haptic = (val === '1');
      try{ localStorage.setItem('starchess.haptic', state.haptic ? '1' : '0'); }catch(_){}
      if(state.haptic) haptic(20);
    });
    bindSeg('data-bstyle', function(val){
      state.boardStyle = val;
      try{ localStorage.setItem('starchess.boardStyle', val); }catch(_){}
      if(state.game) render();
    });
    bindSeg('data-gridbr', function(val){ state.gridBrightness = val; applyV64VisualSettings(); if(state.game) render(); });
    bindSeg('data-stardens', function(val){ state.starDensity = val; applyStarDensity(); });
    bindSeg('data-aspeed', function(val){
      state.animSpeed = val;
      try{ localStorage.setItem('starchess.animSpeed', val); }catch(_){}
    });
    bindSeg('data-simpanim', function(val){
      state.simplifiedAnim = (val === '1');
      try{ localStorage.setItem('starchess.simplifiedAnim', state.simplifiedAnim ? '1' : '0'); }catch(_){}
      document.body.classList.toggle('simplified-anim', state.simplifiedAnim);
    });
    bindSeg('data-showeval', function(val){ state.showEvalBar = (val === '1'); applyV64VisualSettings(); });
    bindSeg('data-showelo', function(val){
      state.showElo = (val === '1');
      try{ localStorage.setItem('starchess.showElo', state.showElo ? '1' : '0'); }catch(_){}
      syncEloVisibility();
    });
    bindSeg('data-uiscale', function(val){ state.uiScale = val; applyV64VisualSettings(); });

    var rBtn = $('btnResetSettings');
    if(rBtn) rBtn.addEventListener('click', function(e){
      e.preventDefault();
      resetAllSettingsToDefault();
    });
  };

  loadV64Settings();
  applyV64VisualSettings();

  /* 在所有模組與四語字典載入完成後，正式啟動 init() */
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
  else init();

})();

})();

</script>
</body>
</html>
